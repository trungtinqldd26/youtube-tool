    const parseTopicCategory = (categories) => {
      if (!categories || categories.length === 0) return 'Chủ đề Tổng hợp';
      for (let catUrl of categories) {
        const parts = catUrl.split('/');
        const key = parts[parts.length - 1];
        if (MAP_YOUTUBE_TOPICS[key]) return MAP_YOUTUBE_TOPICS[key];
        for (let tKey in MAP_YOUTUBE_TOPICS) {
          if (catUrl.toLowerCase().includes(tKey.toLowerCase())) {
            return MAP_YOUTUBE_TOPICS[tKey];
          }
        }
      }
      return 'Tổng hợp';
    };

    const calculateVPH = (viewCount, publishedAt) => {
      if (!viewCount || !publishedAt) return 0;
      const hours = Math.max(1, (new Date() - new Date(publishedAt)) / (1000 * 60 * 60));
      return Math.round(viewCount / hours);
    };

    const calculateTrendScore = (vph) => {
      if (vph > 5000) return 99;
      if (vph > 1000) return Math.floor(85 + (Math.random() * 10));
      if (vph > 500) return Math.floor(70 + (Math.random() * 10));
      if (vph > 100) return Math.floor(50 + (Math.random() * 15));
      return Math.floor(30 + (Math.random() * 20));
    };

    // Dynamic Outlier Score calculation (Flexibly evaluates viral ratios, sub counts & content efficiency)
    const calculateOutlierScore = (views, subs, videos, ageDays) => {
      const rawSubs = Math.max(1, subs);
      const rawViews = Math.max(0, views);
      const viralRatio = rawViews / rawSubs;

      // 1. Viral Ratio Score (Max 6.5 pts)
      let viralScore = 2.0;
      if (viralRatio >= 300) viralScore = 6.5;
      else if (viralRatio >= 100) viralScore = 5.8;
      else if (viralRatio >= 50) viralScore = 5.0;
      else if (viralRatio >= 10) viralScore = 4.0;
      else if (viralRatio >= 2) viralScore = 3.0;

      // 2. Relative Scale Agility Bonus (Max 2.0 pts)
      let scaleBonus = 0.5;
      if (rawSubs <= 10000) scaleBonus = 2.0;
      else if (rawSubs <= 50000) scaleBonus = 1.6;
      else if (rawSubs <= 200000) scaleBonus = 1.2;
      else if (rawSubs <= 1000000) scaleBonus = 0.8;

      // 3. Efficiency Bonus (Views per Video, Max 1.5 pts)
      const avgViewsPerVideo = rawViews / Math.max(1, videos);
      let efficiencyBonus = 0.5;
      if (avgViewsPerVideo >= 100000) efficiencyBonus = 1.5;
      else if (avgViewsPerVideo >= 20000) efficiencyBonus = 1.0;

      const totalScore = viralScore + scaleBonus + efficiencyBonus;
      return Math.min(9.8, Math.max(3.5, totalScore)).toFixed(1);
    };

      const d = new Date();
      switch (filterType) {
        case 'today': d.setDate(d.getDate() - 1); break;
        case 'week': d.setDate(d.getDate() - 7); break;
        case 'month': d.setDate(d.getDate() - 30); break;
        case 'year': d.setFullYear(d.getFullYear() - 1); break;
        default: return null;
      }
      return d.toISOString();
    };

      if (!publishedAt) return 1;
      const days = Math.floor((new Date() - new Date(publishedAt)) / (1000 * 60 * 60 * 24));
      return Math.max(1, days);
    };

    // Clean title and extract readable sub-niche without hashtags/gibberish
    const extractSubNicheFromTitle = (title, searchKw) => {
      if (!title) return searchKw;
      let cleanTitle = title
        .replace(/#[^\s#<>]+/g, '')
        .replace(/(https?:\/\/[^\s]+)/g, '')
        .replace(/[\(\)\[\]\{\}\_\-\|\:\!\?\•\“\”\"\'\d\=\+\*\&\^\%\$\@]/g, ' ')
        .replace(/[^\p{L}\p{N}\s]/gu, '')
        .replace(/\s+/g, ' ')
        .trim();

      const words = cleanTitle.split(' ').filter(w => w.length > 1);
      if (words.length <= 2) return searchKw;

      const validWords = words.filter(w => !/^(.)\1+$/i.test(w));
      if (validWords.length === 0) return searchKw;

      const resultPhrase = validWords.slice(0, 5).join(' ');
      return resultPhrase.charAt(0).toUpperCase() + resultPhrase.slice(1).toLowerCase();
    };

    const fallbackCopyTextToClipboard = (text) => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('Không thể copy', err);
      }
      document.body.removeChild(textArea);
    };

    const downloadTxtFile = (filename, content) => {
      const element = document.createElement("a");
      const file = new Blob([content], {type: 'text/plain;charset=utf-8'});
      element.href = URL.createObjectURL(file);
      element.download = filename;
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    };

    const Header = ({ onOpenSettings, onOpenUpgrade, onOpenHistory, userPlan, freeSearchesLeft, activeYtKeyCount, activeGeminiKeyCount }) => (

        <div className="flex items-center space-x-3">

            <User className="w-5 h-5 text-blue-600" />
          </div>
          <h1 className="font-bold text-gray-800 text-[15px] tracking-wide">YOUTUBE NICHE RESEARCH PRO - TRUNG TÍN - AI</h1>
        </div>
        
        <div className="flex items-center space-x-2 text-xs font-semibold">
          <a href="https://youtube.com" target="_blank" rel="noreferrer" className="flex items-center border border-gray-300 hover:bg-gray-50 text-gray-700 px-2.5 py-1.5 rounded transition-colors">
            <Play className="w-3.5 h-3.5 mr-1 text-red-600 fill-current" /> VIDEO HƯỚNG DẪN
          </a>
          <button onClick={() => alert("Hỗ trợ kỹ thuật: Zalo / Telegram 0987.654.321")} className="flex items-center border border-gray-300 hover:bg-gray-50 text-gray-700 px-2.5 py-1.5 rounded transition-colors">
            <HelpCircle className="w-3.5 h-3.5 mr-1 text-blue-500" /> HỖ TRỢ
          </button>
          
          <div className="flex items-center bg-blue-50 text-blue-700 px-3 py-1.5 rounded border border-blue-100 hidden lg:flex">
            <div className="w-4 h-4 bg-blue-600 rounded-full text-white flex items-center justify-center text-[10px] mr-2">T</div>
            trungtinsuno@gmail.com <span className="ml-1 text-[10px] bg-yellow-400 text-gray-900 font-bold px-1 rounded">TRIAL</span>
          </div>

          <button onClick={() => window.location.reload()} className="flex items-center border border-gray-300 hover:bg-gray-100 px-2.5 py-1.5 rounded transition-colors text-gray-700">
            <RefreshCw className="w-3.5 h-3.5 mr-1 text-gray-600" /> LÀM MỚI
          </button>

          <button onClick={onOpenUpgrade} className={`flex items-center text-white px-3.5 py-1.5 rounded transition-colors shadow-md ${userPlan === 'FREE' ? 'bg-orange-500 hover:bg-orange-600 animate-pulse' : 'bg-green-600'}`}>
            <Crown className={`w-4 h-4 mr-1 ${userPlan === 'FREE' ? 'text-yellow-200' : 'text-yellow-400'}`} /> {userPlan === 'FREE' ? 'NÂNG CẤP GÓI' : `GÓI ${userPlan}`}
          </button>
        </div>
      </div>
    );

    const TabFindChannels = ({ 
      showToast, 
      callYouTubeApi, 
      callGeminiApi,
      ytKeysCount, 
      geminiKeysCount,
      onOpenSettings, 
      onOpenHistory,
      onSpyChannel, 
      onCheckVideo, 
      onAddAllToTracking,
      userPlan, 
      onOpenUpgrade, 
      freeSearchesLeft, 
      useFreeSearch,
      addQuotaUnits,
      sessionQuota,
      todayTotalQuota
    }) => {
      const [keyword, setKeyword] = useState('');
      const [region, setRegion] = useState('VN');
      const [timeRange, setTimeRange] = useState('month');
      
      // Filter State Parameters
      const [minSubs, setMinSubs] = useState(1000);
      const [maxSubs, setMaxSubs] = useState(1000000);
      const [maxResults, setMaxResults] = useState(30);
      const [minVideos, setMinVideos] = useState(1);
      const [maxVideos, setMaxVideos] = useState(1000);
      const [minViews, setMinViews] = useState(10000);
      
      const [autoRotateKw, setAutoRotateKw] = useState(true);
      const [isHuntSmall, setIsHuntSmall] = useState(false);
      const [showAiKeywordsTable, setShowAiKeywordsTable] = useState(true);

      const [isLoading, setIsLoading] = useState(false);
      const [hasSearched, setHasSearched] = useState(false);
      const [channels, setChannels] = useState([]);
      const [aiKeywords, setAiKeywords] = useState([]);
      const [statusMsg, setStatusMsg] = useState('');

      const generateRelevantSubKeywords = (baseKw) => {
        const cleanBase = baseKw.trim();
        const modifiers = [
          'miễn phí',
          'hướng dẫn',
          'capcut',
          'canva',
          'heygen',
          'shorts',
          'chatgpt',
          'kiếm tiền',
          'mới nhất',
          'full quy trình',
          'tự động'
        ];
        
        const list = [cleanBase];
        modifiers.forEach(mod => {
          if (!cleanBase.toLowerCase().includes(mod)) {
            list.push(`${cleanBase} ${mod}`);
          }
        });
        return list;
      };

      const handleSearch = async (overrideKeyword = null) => {
        const queryKw = overrideKeyword || keyword;
        if (ytKeysCount === 0) {
          showToast('Vui lòng cài đặt API Key trong mục Cài Đặt!', 'error');
          onOpenSettings();
          return;
        }
        if (!queryKw.trim()) {
          showToast('Vui lòng nhập từ khóa!', 'error');
          return;
        }

        if (userPlan === 'FREE') {
          const success = useFreeSearch();
          if (!success) {
            showToast('Bạn đã dùng hết 3 lượt miễn phí! Vui lòng nâng cấp gói để tiếp tục.', 'error');
            onOpenUpgrade();
            return;
          }
        }

        setIsLoading(true);
        setHasSearched(true);
        setStatusMsg(`Đang tiến hành phân tích & săn 10 Kênh Ngon cho từ khóa "${queryKw}"...`);
        
        try {
          const timeDate = getTimeFilterDate(timeRange);
          const timeQuery = timeDate ? `&publishedAfter=${encodeURIComponent(timeDate)}` : '';
          const regionQuery = region !== 'GLOBAL' ? `&regionCode=${encodeURIComponent(region)}` : '';
          
          let collectedChannels = [];
          let unitsUsedThisSearch = 0;

          const onTopicKeywords = generateRelevantSubKeywords(queryKw);

          const suggestedTableData = onTopicKeywords.map((kwItem, index) => ({
            id: index + 1,
            keyword: kwItem,
            comp: index === 0 ? 'Trung bình' : (index % 3 === 0 ? 'Thấp' : 'Trung bình'),
            compScore: index === 0 ? '10/10' : `${(9.5 - (index * 0.4)).toFixed(1)}/10`
          }));
          setAiKeywords(suggestedTableData);

          const targetLimit = autoRotateKw ? 10 : maxResults;

          for (let i = 0; i < onTopicKeywords.length; i++) {
            if (collectedChannels.length >= targetLimit) break;

            const activeKw = onTopicKeywords[i];

            const searchRes = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(activeKw)}${regionQuery}&maxResults=25${timeQuery}`);
            unitsUsedThisSearch += 100;

            if (searchRes.items && searchRes.items.length > 0) {
              const channelVideoMap = {};
              searchRes.items.forEach(item => {
                if (item.snippet?.channelId) {
                  const chId = item.snippet.channelId;
                  if (!channelVideoMap[chId]) {
                    channelVideoMap[chId] = {
                      videoTitle: item.snippet.title,
                      matchedKw: activeKw
                    };
                  }
                }
              });

              const chIds = Object.keys(channelVideoMap).join(',');

              if (chIds) {
                const channelData = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,topicDetails&id=${chIds}`);
                unitsUsedThisSearch += 1;

                if (channelData.items) {
                  const formatted = channelData.items.map(ch => {
                    const subs = parseInt(ch.statistics.subscriberCount || 0);
                    const views = parseInt(ch.statistics.viewCount || 0);
                    const videos = parseInt(ch.statistics.videoCount || 0);
                    const age = calculateAgeDays(ch.snippet.publishedAt);
                    const topicCat = parseTopicCategory(ch.topicDetails?.topicCategories);
                    
                    const countryCode = ch.snippet.country || (region !== 'GLOBAL' ? region : 'VN');
                    const countryName = COUNTRY_NAME_MAP[countryCode] || countryCode;

                    const videoInfo = channelVideoMap[ch.id];
                    const subNicheTitle = videoInfo 
                      ? extractSubNicheFromTitle(videoInfo.videoTitle, videoInfo.matchedKw)
                      : queryKw;

                    const lowEst = Math.floor((views / 1000) * 0.2);
                    const highEst = Math.floor((views / 1000) * 1.5);
                    const incomeStr = `$${formatLocale(lowEst)} - $${formatLocale(highEst)}`;

                    // Flexible dynamic outlier score (No rigid hardcut limits)
                    const dynamicScore = calculateOutlierScore(views, subs, videos, age);

                    return {
                      id: ch.id,
                      name: ch.snippet.title,
                      handle: ch.snippet.customUrl || `@${ch.id.substring(0,8)}`,
                      kw: subNicheTitle,
                      topic: topicCat,
                      income: incomeStr,
                      url: `youtube.com/channel/${ch.id}`,
                      country: countryName,
                      date: new Date(ch.snippet.publishedAt).toISOString().split('T')[0],
                      age: age,
                      sub: formatLocale(subs),
                      views: formatLocale(views),
                      videos: formatLocale(videos),
                      score: dynamicScore,
                      rawSubs: subs,
                      rawViews: views,
                      rawVideos: videos,
                      thumbnail: ch.snippet.thumbnails.default.url
                    };
                  });

                  // Primary filter checks against user-configured input ranges
                  const filteredBatch = formatted.filter(c => 
                    c.rawSubs >= minSubs && 
                    c.rawSubs <= maxSubs &&
                    c.rawVideos >= minVideos &&
                    c.rawVideos <= maxVideos &&
                    c.rawViews >= minViews
                  );

                  for (let bc of filteredBatch) {
                    if (!collectedChannels.some(existing => existing.id === bc.id)) {
                      collectedChannels.push(bc);
                      if (collectedChannels.length >= targetLimit) break;
                    }
                  }
                }
              }
            }

            if (!autoRotateKw) break;
          }

          // Dynamic Ranking: High Viral Ratio & High Outlier Score prioritized
          collectedChannels.sort((a, b) => {
            const ratioA = a.rawViews / (a.rawSubs || 1);
            const ratioB = b.rawViews / (b.rawSubs || 1);
            if (isHuntSmall) {
              return (ratioB * parseFloat(b.score)) - (ratioA * parseFloat(a.score));
            }
            return parseFloat(b.score) - parseFloat(a.score);
          });

          addQuotaUnits(unitsUsedThisSearch);
          setChannels(collectedChannels);

          if (collectedChannels.length > 0) {
            const finalMsg = `🎉 ĐÃ GỒM ĐỦ ${collectedChannels.length} KÊNH NGON! Đã tự động dừng lại.`;
            setStatusMsg(finalMsg);
            showToast(finalMsg, 'success');
          } else {
            const emptyMsg = `Không tìm thấy kênh nào thỏa mãn điều kiện lọc từ khóa "${queryKw}".`;
            setStatusMsg(emptyMsg);
            showToast(emptyMsg, 'warning');
          }
        } catch (err) {
          showToast(err.message, 'error');
          setStatusMsg(`Lỗi: ${err.message}`);
        }
        setIsLoading(false);
      };

      const handleExportTxt = () => {
        if (channels.length === 0) return showToast('Không có dữ liệu kênh để tải!', 'warning');
        let txtContent = `=== DANH SÁCH KÊNH YOUTUBE QUÉT ĐƯỢC (${new Date().toLocaleDateString('vi-VN')}) ===\n\n`;
        channels.forEach((c, i) => {
          txtContent += `${i + 1}. Kênh: ${c.name}\n   ID: ${c.id}\n   Từ khóa/Ngách: ${c.kw}\n   Chủ đề: ${c.topic}\n   Sub: ${c.sub} | Views: ${c.views} | Video: ${c.videos}\n   Tuổi kênh: ${c.age} ngày | Ngày tạo: ${c.date}\n   Thu nhập ước tính: ${c.income}\n   Điểm ngách: ${c.score}/10\n   URL: https://${c.url}\n\n----------------------------------------\n`;
        });
        downloadTxtFile(`YouTube_Channels_${keyword.replace(/\s+/g, '_')}.txt`, txtContent);
        showToast('Đã tải xuống danh sách file TXT!', 'success');
      };

      const handleUseSuggestedKw = (suggestedKw) => {
        setKeyword(suggestedKw);
        handleSearch(suggestedKw);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen">
          <div className="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
            <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
              <div className="md:col-span-3 space-y-2.5">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-semibold text-gray-700 w-24">Từ khóa:</label>
                  <input type="text" value={keyword} onChange={(e)=>setKeyword(e.target.value)} placeholder="Ví dụ: Tạo video AI..." className="w-36 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 font-medium placeholder-gray-400 placeholder:italic text-gray-800" />
                </div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-24">Khu vực:</label><select value={region} onChange={(e)=>setRegion(e.target.value)} className="w-36 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 bg-white">{COUNTRIES_LIST.map((c) => (<option key={c.code} value={c.code}>{c.name}</option>))}</select></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-24">Đăng trong:</label><select value={timeRange} onChange={(e)=>setTimeRange(e.target.value)} className="w-36 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 bg-white"><option value="all">Toàn thời gian</option><option value="today">Hôm nay</option><option value="week">Tuần này</option><option value="month">Tháng này</option><option value="year">Năm nay</option></select></div>
              </div>

              <div className="md:col-span-3 space-y-2.5">
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Đăng ký tối thiểu:</label><input type="number" value={minSubs} onChange={(e)=>setMinSubs(Number(e.target.value))} className="w-28 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 no-spinner font-medium" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Đăng ký tối đa:</label><input type="number" value={maxSubs} onChange={(e)=>setMaxSubs(Number(e.target.value))} className="w-28 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 no-spinner font-medium" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Số lượng quét:</label><input type="number" value={maxResults} onChange={(e)=>setMaxResults(Number(e.target.value))} className="w-28 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 no-spinner font-medium" /></div>
              </div>

              <div className="md:col-span-3 space-y-2.5">
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Video tối thiểu:</label><input type="number" value={minVideos} onChange={(e)=>setMinVideos(Number(e.target.value))} className="w-28 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 no-spinner font-medium" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Video tối đa:</label><input type="number" value={maxVideos} onChange={(e)=>setMaxVideos(Number(e.target.value))} className="w-28 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 no-spinner font-medium" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Lượt xem tối thiểu:</label><input type="number" value={minViews} onChange={(e)=>setMinViews(Number(e.target.value))} className="w-28 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 no-spinner font-medium" /></div>
              </div>

              <div className="md:col-span-3">
                <div className="bg-blue-50/40 border border-blue-100 rounded p-3 h-full flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center mb-1.5"><span className="text-xs font-bold text-gray-700">HỆ THỐNG API</span> <div className="flex gap-1"><span className="w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse"></span><span className="w-2 h-2 rounded-full bg-blue-500 inline-block"></span></div></div>
                    <div className="space-y-1 text-xs">
                      <div className="flex justify-between text-gray-600"><span>📺 YouTube V3:</span> <span className="font-bold text-blue-700">{ytKeysCount} Key</span></div>
                      <div className="flex justify-between text-gray-600"><span>🤖 Gemini AI:</span> <span className="font-bold text-orange-600">{geminiKeysCount} Key</span></div>
                    </div>
                  </div>
                  <div className="flex gap-1.5 mt-2">
                    <button onClick={onOpenSettings} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold py-1.5 rounded flex items-center justify-center"><Settings className="w-3 h-3 mr-1"/> CÀI ĐẶT</button>
                    <button onClick={onOpenHistory} className="bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300 text-[11px] font-bold px-2.5 py-1.5 rounded flex items-center"><History className="w-3 h-3 mr-1"/> LỊCH SỬ</button>
                  </div>
                </div>
              </div>
            </div>

            <div className="mt-4 flex flex-col md:flex-row items-end justify-between border-t border-gray-100 pt-3 gap-3">
              <div className="flex flex-col md:flex-row gap-3">
                <div className="flex items-start bg-orange-50/60 p-2 rounded border border-orange-200">
                  <input type="checkbox" checked={autoRotateKw} onChange={(e)=>setAutoRotateKw(e.target.checked)} className="mt-0.5 w-4 h-4 text-orange-500 border-gray-300 rounded focus:ring-orange-500 cursor-pointer" />
                  <div className="ml-2">
                    <div className="text-xs font-bold text-orange-800">Tự động chuyển từ khóa</div>
                    <div className="text-[10px] text-orange-600">đến khi đủ 10 Kênh Ngon</div>
                  </div>
                </div>
                <div className="flex items-start bg-blue-50/60 p-2 rounded border border-blue-200">
                  <input type="checkbox" checked={isHuntSmall} onChange={(e) => setIsHuntSmall(e.target.checked)} className="mt-0.5 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer" />
                  <div className="ml-2">
                    <div className="text-xs font-bold text-blue-800">Ưu tiên Kênh Nhỏ / Viral Ratio Cao</div>
                    <div className="text-[10px] text-blue-600">Linh hoạt sắp xếp theo độ đột biến View/Sub</div>
                  </div>
                </div>
              </div>

              <button onClick={() => handleSearch()} disabled={isLoading} className="bg-orange-500 hover:bg-orange-600 text-white font-extrabold py-2.5 px-8 rounded-lg shadow-md flex items-center transition-colors text-sm disabled:opacity-50 tracking-wider">
                {isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <Play className="w-4 h-4 mr-2 fill-current" />}
                {isLoading ? 'ĐANG QUÉT...' : 'BẮT ĐẦU TÌM KÊNH'}
              </button>
            </div>
          </div>

          {hasSearched ? (
            <div className="space-y-4 animate-fade-in">
              {/* Niche Keyword Suggestions Table */}
              <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                 <div className="bg-gradient-to-r from-orange-500 to-orange-600 text-white px-3 py-2 flex justify-between items-center">
                   <h3 className="text-xs font-bold flex items-center"><Activity className="w-4 h-4 mr-2"/> DANH SÁCH GỢI Ý NGÁCH LIÊN QUAN - TỪ KHÓA ĐỀ XUẤT ({aiKeywords.length})</h3>
                   <button onClick={() => setShowAiKeywordsTable(!showAiKeywordsTable)} className="bg-orange-700/60 hover:bg-orange-800 px-2.5 py-1 rounded text-[10px] font-bold transition">
                     {showAiKeywordsTable ? '✕ ẨN BẢNG' : '👁️ HIỆN BẢNG'}
                   </button>
                 </div>
                 {showAiKeywordsTable && (
                   <div className="overflow-x-auto">
                     <table className="w-full text-left text-xs">
                       <thead className="bg-gray-50 border-b border-gray-200 text-gray-700 font-bold">
                         <tr>
                           <th className="px-3 py-2 text-center w-12">STT</th>
                           <th className="px-3 py-2">TỪ KHÓA / NGÁCH TIỀM NĂNG</th>
                           <th className="px-3 py-2 text-center">CẠNH TRANH</th>
                           <th className="px-3 py-2 text-center">ĐIỂM SEO</th>
                         </tr>
                       </thead>
                       <tbody className="divide-y divide-gray-100">
                         {aiKeywords.map((item, idx) => (
                           <tr key={item.id} className="hover:bg-orange-50/30">
                             <td className="px-3 py-2 text-center text-gray-500">{idx + 1}</td>
                             <td className="px-3 py-2 font-semibold">
                               <span className="text-gray-900">{item.keyword}</span>
                               <button onClick={() => handleUseSuggestedKw(item.keyword)} className="ml-2.5 bg-blue-600 hover:bg-blue-700 text-white text-[9px] font-bold px-2 py-0.5 rounded shadow-sm">DÙNG</button>
                             </td>
                             <td className="px-3 py-2 text-center"><span className={`font-bold ${item.comp === 'Thấp' ? 'text-green-600' : item.comp === 'Trung bình' ? 'text-yellow-600' : 'text-red-600'}`}>{item.comp}</span></td>
                             <td className="px-3 py-2 text-center font-bold text-blue-600">{item.compScore}</td>

                     <button onClick={() => { onAddAllToTracking(channels); showToast(`Đã thêm ${channels.length} kênh vào danh sách theo dõi!`, 'success'); }} className="bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold px-3 py-1 rounded shadow flex items-center"><Target className="w-3.5 h-3.5 mr-1" /> Theo Dõi Tất Cả</button>
                     <button onClick={() => { setChannels([]); showToast('Đã xóa tất cả kết quả!', 'info'); }} className="bg-red-500 hover:bg-red-600 text-white text-[11px] font-bold px-3 py-1 rounded shadow flex items-center"><Trash2 className="w-3.5 h-3.5 mr-1" /> Xóa Tất Cả</button>
                   </div>

                     <thead className="bg-gray-100 border-b border-gray-200 text-gray-700 font-bold">
                       <tr>

                         <th className="px-2 py-2.5 text-center">ICON</th>
                         <th className="px-2 py-2.5">TÊN KÊNH</th>
                         <th className="px-2 py-2.5">MÃ KÊNH</th>

                     </thead>
                     <tbody className="divide-y divide-gray-200">

                           <td className="px-2 py-2 font-mono text-[10px] text-gray-600">{item.id}</td>
                           <td className="px-2 py-2 font-medium text-blue-700">{item.kw}</td>

                           <td className="px-2 py-2 text-blue-500 hover:underline"><a href={`https://${item.url}`} target="_blank" rel="noreferrer">youtube.com</a></td>

                           <td className="px-2 py-2 text-center text-gray-600">{item.date}</td>

                             <button onClick={() => onSpyChannel(item.id)} className="bg-blue-600 hover:bg-blue-700 text-white text-[9px] font-bold px-2 py-1 rounded mr-1">SPY</button>

                     <span className="w-2 h-2 rounded-full bg-blue-600 mr-2 animate-ping"></span>
                     {statusMsg || 'Đã sẵn sàng tìm kiếm ngách YouTube.'}

                     Quota phần này: <strong className="text-orange-600">{formatLocale(sessionQuota)} units</strong> | Tổng Quota hôm nay đã dùng: <strong className="text-red-600">{formatLocale(todayTotalQuota)} units</strong>

    const TabSpyChannel = ({ showToast, callYouTubeApi, externalChannelId, onAnalyzeVideo }) => {
      const [channelIdInput, setChannelIdInput] = useState(externalChannelId || '');
      const [channelData, setChannelData] = useState(null);
      const [videosData, setVideosData] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [selectedVideoDetail, setSelectedVideoDetail] = useState(null);

      useEffect(() => { if (externalChannelId) { setChannelIdInput(externalChannelId); handleAnalyzeSpy(externalChannelId); } }, [externalChannelId]);

      const handleAnalyzeSpy = async (targetId) => {
        const inputVal = targetId || channelIdInput;
        if (!inputVal.trim()) return showToast('Vui lòng nhập Channel ID hoặc Link!', 'error');
        setIsLoading(true);
        let finalId = inputVal.trim();
        if (finalId.includes('youtube.com/')) {
            if (finalId.includes('/channel/')) finalId = finalId.split('/channel/')[1].split('/')[0].split('?')[0];
            else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0].split('?')[0];
        }

        try {
          let urlPath = finalId.startsWith('@') 
            ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&forHandle=${encodeURIComponent(finalId)}`
            : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=${finalId}`;
          
          const channelJson = await callYouTubeApi(urlPath);

          if (channelJson.items && channelJson.items.length > 0) {
            const channel = channelJson.items[0];
            const age = calculateAgeDays(channel.snippet.publishedAt);
            const views = Number(channel.statistics.viewCount || 0);
            setChannelData({
              id: channel.id, title: channel.snippet.title, thumbnail: channel.snippet.thumbnails.high?.url || channel.snippet.thumbnails.default?.url, country: channel.snippet.country || 'N/A', customUrl: channel.snippet.customUrl || `@${channel.id.substring(0,8)}`, publishedAt: new Date(channel.snippet.publishedAt).toLocaleDateString('vi-VN'), ageDays: age, subscriberCount: formatLocale(channel.statistics.subscriberCount), viewCount: formatLocale(views), videoCount: formatLocale(channel.statistics.videoCount), viewPerDay: formatLocale(Math.round(views / age))
            });
            const uploadsId = channel.contentDetails?.relatedPlaylists?.uploads;
            if (uploadsId) {
                const plistJson = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=10`);
                if (plistJson.items) {
                    const vidIds = plistJson.items.map(item => item.snippet.resourceId.videoId).join(',');
                    const vJson = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${vidIds}`);
                    const formattedVids = vJson.items.map(v => {
                      const vph = calculateVPH(v.statistics.viewCount, v.snippet.publishedAt);
                      const desc = v.snippet.description || '';
                      return { id: v.id, thumb: v.snippet.thumbnails.medium?.url || v.snippet.thumbnails.default?.url, title: v.snippet.title, description: desc, tags: v.snippet.tags || [], hashtags: desc.match(/#[^\s#<>]+/g) || [], date: new Date(v.snippet.publishedAt).toLocaleString('vi-VN'), views: formatLocale(v.statistics.viewCount), vph: `+${formatLocale(vph)} VPH`, outlier: `${calculateTrendScore(vph)}/100` }
                    });
                    setVideosData(formattedVids);
                    if (formattedVids.length > 0) setSelectedVideoDetail(formattedVids[0]);
                }
            }
            showToast('Tải dữ liệu Kênh thành công!', 'success');
          } else throw new Error('Không tìm thấy kênh!');
        } catch (err) { showToast(err.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen overflow-y-auto custom-scrollbar">
          <div className="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex items-center gap-3">
             <div className="flex items-center gap-2 flex-1"><label className="text-sm font-bold text-gray-700 whitespace-nowrap">Channel ID / Handle:</label><input type="text" value={channelIdInput} onChange={(e)=>setChannelIdInput(e.target.value)} placeholder="Nhập Channel ID hoặc @handle..." className="w-1/2 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-blue-500" /></div>
             <button onClick={() => handleAnalyzeSpy()} disabled={isLoading} className="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow flex items-center text-sm disabled:opacity-50">{isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <BarChart2 className="w-4 h-4 mr-2" />}PHÂN TÍCH SPY</button>
          </div>
          {channelData && (
            <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm flex gap-6 animate-fade-in">
               <div className="w-32 flex flex-col items-center flex-shrink-0"><img src={channelData.thumbnail} className="w-24 h-24 rounded-full shadow-sm mb-2 object-cover" /><div className="font-bold text-gray-800 text-sm text-center">{channelData.title}</div><a href={`https://youtube.com/channel/${channelData.id}`} target="_blank" rel="noreferrer" className="text-blue-500 text-[10px] hover:underline mt-1">Xem kênh 👉</a></div>
               <div className="flex-1 text-xs text-gray-700 space-y-2">
                  <div><span className="font-bold text-blue-800">Quốc gia:</span> {channelData.country} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Tuổi kênh:</span> {formatLocale(channelData.ageDays)} ngày</div>
                  <div><span className="font-bold text-blue-800">Đăng ký:</span> {channelData.subscriberCount} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Lượt xem:</span> {channelData.viewCount} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Video:</span> {channelData.videoCount}</div>
                  <div><span className="font-bold text-blue-800">View/ngày (TB):</span> {channelData.viewPerDay}</div>
               </div>
            </div>
          )}
          {videosData.length > 0 && (
            <div className="space-y-4 animate-fade-in">
              <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                 <div className="bg-[#334155] text-white px-3 py-2 flex"><h3 className="text-xs font-bold flex items-center"><Play className="w-4 h-4 mr-2"/> Video mới nhất từ kênh</h3></div>
                 <div className="overflow-x-auto">
                   <table className="w-full text-left text-xs whitespace-nowrap">
                     <thead className="bg-gray-100 border-b border-gray-200 font-bold"><tr><th className="px-2 py-3 text-center">THUMB</th><th className="px-2 py-3 text-center">XEM CT</th><th className="px-2 py-3 max-w-[250px]">TIÊU ĐỀ</th><th className="px-2 py-3 text-right">VIEWS</th><th className="px-2 py-3 text-center">VPH</th><th className="px-2 py-3 text-center">TREND SCORE</th></tr></thead>
                     <tbody className="divide-y divide-gray-200">
                       {videosData.map((item, idx) => (
                         <tr key={idx} onClick={() => setSelectedVideoDetail(item)} className={`cursor-pointer hover:bg-blue-50 ${selectedVideoDetail?.id === item.id ? 'bg-blue-50 border-l-4 border-blue-500' : ''}`}><td className="px-2 py-2 text-center"><img src={item.thumb} className="w-16 h-9 object-cover rounded mx-auto" /></td><td className="px-2 py-2 text-center"><button onClick={(e) => { e.stopPropagation(); onAnalyzeVideo(item.id); }} className="bg-orange-500 text-white text-[9px] font-bold px-2 py-1 rounded">CHECK</button></td><td className="px-2 py-2 text-blue-700 font-bold max-w-[250px] overflow-hidden text-ellipsis text-[9px]">{item.title}</td><td className="px-2 py-2 text-right font-bold text-gray-700">{item.views}</td><td className="px-2 py-2 text-center font-bold text-blue-600">{item.vph}</td><td className="px-2 py-2 text-center font-bold text-green-500">{item.outlier}</td></tr>
                       ))}
                     </tbody>
                   </table>
                 </div>
              </div>
              {selectedVideoDetail && (
                <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm space-y-4">
                  <div className="border-b border-gray-100 pb-3 flex justify-between"><h4 className="font-bold text-gray-800 text-sm flex items-center"><FileText className="w-4 h-4 mr-2 text-blue-600"/> PHÂN TÍCH SEO CHI TIẾT VIDEO: <span className="text-blue-600 ml-1">{selectedVideoDetail.title}</span></h4><button onClick={() => { fallbackCopyTextToClipboard(`Tiêu đề: ${selectedVideoDetail.title}\nMô tả:\n${selectedVideoDetail.description}\nTags:\n${selectedVideoDetail.tags.join(', ')}`); showToast('Đã sao chép!', 'success'); }} className="bg-gray-100 text-gray-700 font-bold px-3 py-1.5 rounded text-xs flex items-center"><Copy className="w-3.5 h-3.5 mr-1"/> SAO CHÉP TẤT CẢ</button></div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-gray-50 p-3.5 rounded-lg border border-gray-200"><span className="text-xs font-bold mb-2 flex items-center"><FileText className="w-3.5 h-3.5 mr-1.5 text-blue-500"/> MÔ TẢ</span><div className="bg-white p-3 border rounded text-xs h-40 overflow-y-auto whitespace-pre-wrap font-mono custom-scrollbar">{selectedVideoDetail.description}</div></div>
                    <div className="space-y-4">
                      <div className="bg-gray-50 p-3.5 rounded-lg border"><span className="text-xs font-bold mb-2 flex items-center"><Hash className="w-3.5 h-3.5 mr-1.5 text-orange-500"/> HASHTAGS</span><div className="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto">{selectedVideoDetail.hashtags.map((tag, idx) => (<span key={idx} className="bg-orange-50 text-orange-700 border border-orange-200 px-2 py-0.5 rounded text-[10px] font-semibold">{tag}</span>))}</div></div>
                      <div className="bg-gray-50 p-3.5 rounded-lg border"><span className="text-xs font-bold mb-2 flex items-center"><Tag className="w-3.5 h-3.5 mr-1.5 text-purple-500"/> VIDEO TAGS</span><div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scrollbar">{selectedVideoDetail.tags.map((tag, idx) => (<span key={idx} className="bg-purple-50 text-purple-700 border border-purple-200 px-2 py-0.5 rounded text-[10px] font-semibold">{tag}</span>))}</div></div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const TabCheckVideo = ({ showToast, callYouTubeApi, initialVideoId }) => {
      const [inputValue, setInputValue] = useState(initialVideoId || '');
      const [videoData, setVideoData] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => { if (initialVideoId) { setInputValue(initialVideoId); handleCheckVideo(initialVideoId); } }, [initialVideoId]);

      const handleCheckVideo = async (targetId) => {
        const val = targetId || inputValue;
        if (!val) return showToast('Vui lòng nhập Video ID hoặc Link!', 'error');
        let finalVideoId = val.trim();
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/)([^"&?\/\s]{11})/i;
        const match = finalVideoId.match(regex);
        if (match && match[1]) finalVideoId = match[1];

        setIsLoading(true);
        try {
           const data = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${finalVideoId}`);
           if (data.items && data.items.length > 0) {
               const video = data.items[0];
               const vph = calculateVPH(video.statistics.viewCount, video.snippet.publishedAt);
               setVideoData({ id: finalVideoId, title: video.snippet.title, thumbnail: video.snippet.thumbnails.maxres?.url || video.snippet.thumbnails.high?.url, views: formatLocale(video.statistics.viewCount), likes: formatLocale(video.statistics.likeCount || 0), comments: formatLocale(video.statistics.commentCount || 0), duration: video.contentDetails.duration.replace('PT','').replace('H','h ').replace('M','m ').replace('S','s').toLowerCase(), vph: formatLocale(vph), trendScore: `${calculateTrendScore(vph)}/100`, channelName: video.snippet.channelTitle, desc: video.snippet.description || '', tags: video.snippet.tags || [], hashtags: (video.snippet.description || '').match(/#[^\s#<>]+/g) || [] });
               showToast('Lấy dữ liệu video thành công!', 'success');
           } else showToast('Không tìm thấy video này!', 'error');
        } catch (error) { showToast(error.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen overflow-y-auto custom-scrollbar">
           <div className="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex items-center gap-3">
             <div className="flex-1 relative"><Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4" /><input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="Nhập ID Video hoặc dán Link Video YouTube..." className="w-full border border-gray-300 rounded-md pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 font-medium" /></div>
             <button onClick={() => handleCheckVideo()} disabled={isLoading} className="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 px-6 rounded-md shadow flex items-center text-sm disabled:opacity-50">{isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <Video className="w-4 h-4 mr-2" />}KIỂM TRA VIDEO</button>
           </div>
           {videoData && (
             <div className="space-y-4 animate-fade-in">
               <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                 <div className="flex justify-between items-start mb-4">
                    <div><div className="text-xs text-blue-600 font-bold mb-1 tracking-wider">TỪ TIÊU ĐỀ VIDEO</div><h2 className="text-xl font-bold text-gray-800">{videoData.title}</h2></div>
                    <a href={`https://youtube.com/watch?v=${videoData.id}`} target="_blank" rel="noreferrer" className="bg-red-600 text-white font-bold py-2 px-6 rounded shadow flex items-center text-sm whitespace-nowrap"><Play className="w-4 h-4 mr-2 fill-current" /> XEM VIDEO</a>
                 </div>
                 <div className="grid grid-cols-12 gap-6">
                    <div className="col-span-12 md:col-span-5 rounded-xl overflow-hidden bg-gray-900 shadow-inner flex items-center"><img src={videoData.thumbnail} className="w-full h-auto object-cover" /></div>
                    <div className="col-span-12 md:col-span-7 grid grid-cols-2 md:grid-cols-3 gap-4">
                       {[ { label: 'LƯỢT XEM', val: videoData.views, icon: Eye, color: 'text-blue-500' }, { label: 'LƯỢT THÍCH', val: videoData.likes, icon: ThumbsUp, color: 'text-gray-400' }, { label: 'BÌNH LUẬN', val: videoData.comments, icon: MessageSquare, color: 'text-green-500' }, { label: 'THỜI LƯỢNG', val: videoData.duration, icon: Clock, color: 'text-purple-500' }, { label: 'VPH', val: videoData.vph, icon: Activity, color: 'text-orange-500' }, { label: 'TREND SCORE', val: videoData.trendScore, icon: BarChart2, color: 'text-red-500' } ].map((stat, i) => (
                         <div key={i} className="bg-gray-50 border border-gray-100 rounded-xl p-4 flex flex-col justify-between shadow-sm"><div className="flex items-center mb-3"><div className="p-1.5 rounded-md bg-white border border-gray-100 shadow-sm mr-2"><stat.icon className={`w-4 h-4 ${stat.color}`} /></div><span className="text-[10px] font-bold text-gray-500">{stat.label}</span></div><div className="text-xl font-black text-gray-800">{stat.val}</div></div>
                       ))}
                    </div>
                 </div>
                 <div className="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200"><h4 className="font-bold text-gray-800 text-xs mb-2 flex items-center"><FileText className="w-4 h-4 mr-1.5 text-blue-600"/> MÔ TẢ CHI TIẾT VIDEO</h4><div className="bg-white p-3 rounded border text-xs h-44 overflow-y-auto font-mono custom-scrollbar whitespace-pre-wrap">{videoData.desc || 'Không có mô tả.'}</div></div>
                    <div className="space-y-4">

    const TabTracking = ({ showToast, callYouTubeApi, onSpyChannel, externalTrackList, setExternalTrackList }) => {
      const [inputValue, setInputValue] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [isRefreshing, setIsRefreshing] = useState(false);

      const refreshAllChannels = async (notify = true) => {
        if (externalTrackList.length === 0) return;
        setIsRefreshing(true);
        try {
          const ids = externalTrackList.map(c => c.id).join(',');
          const data = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${ids}`);
          if (data.items) {
            setExternalTrackList(prev => prev.map(ch => {
              const updated = data.items.find(item => item.id === ch.id);
              if (updated) {
                const oldSub = parseInt((ch.sub || "0").replace(/\./g, ''));
                const newSub = parseInt(updated.statistics.subscriberCount || 0);
                const diff = newSub - oldSub;
                const growthStr = diff >= 0 ? `+${formatLocale(diff)}` : formatLocale(diff);
                return {
                  ...ch,
                  sub: formatLocale(newSub),
                  subGrowth: growthStr !== '+0' ? growthStr : ch.subGrowth,
                  views: formatLocale(updated.statistics.viewCount)
                };
              }
              return ch;
            }));
            if (notify) showToast('Đã tự động cập nhật số liệu thời gian thực!', 'success');
          }
        } catch (e) {
          console.error("Auto refresh failed:", e);
        }
        setIsRefreshing(false);
      };

      const handleTrackChannel = async () => {
        if (!inputValue.trim()) return showToast('Vui lòng nhập Link Kênh!', 'error');
        setIsLoading(true);
        let finalId = inputValue.trim();
        if (finalId.includes('youtube.com/')) {
            if (finalId.includes('/channel/')) finalId = finalId.split('/channel/')[1].split('/')[0].split('?')[0];
            else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0].split('?')[0];
        }

        try {
          const fetchUrl = finalId.startsWith('@') ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${encodeURIComponent(finalId)}` : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${finalId}`;
          const data = await callYouTubeApi(fetchUrl);
          if (data.items && data.items.length > 0) {
            const ch = data.items[0];
            if (externalTrackList.find(item => item.id === ch.id)) { setIsLoading(false); return showToast('Kênh này đã được theo dõi!', 'warning'); }
            setExternalTrackList(prev => [{ id: ch.id, name: ch.snippet.title, handle: ch.snippet.customUrl || `@${ch.id.substring(0,8)}`, sub: formatLocale(ch.statistics.subscriberCount), subGrowth: '+0', views: formatLocale(ch.statistics.viewCount), date: new Date().toLocaleDateString('vi-VN'), status: 'Đang theo dõi', thumbnail: ch.snippet.thumbnails.default?.url }, ...prev]);
            setInputValue(''); showToast('Đã thêm vào theo dõi!', 'success');
          } else throw new Error('Không tìm thấy kênh này!');
        } catch (err) { showToast(err.message, 'error'); }
        setIsLoading(false);
      };

      return (

             <button onClick={handleTrackChannel} disabled={isLoading} className="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 px-6 rounded-md shadow flex items-center text-sm disabled:opacity-50">{isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <Target className="w-4 h-4 mr-2" />}BẮT ĐẦU THEO DÕI</button>
             <button onClick={() => refreshAllChannels(true)} disabled={isRefreshing} className="bg-blue-600 text-white font-bold py-2.5 px-4 rounded-md shadow flex items-center text-sm disabled:opacity-50" title="Cập nhật số liệu mới nhất">{isRefreshing ? <RefreshCw className="w-4 h-4 animate-spin" /> : <RefreshCw className="w-4 h-4" />}</button>
          </div>

             <div className="bg-[#1e293b] text-white px-3 py-2 flex justify-between items-center"><h3 className="text-xs font-bold flex items-center"><List className="w-4 h-4 mr-2"/> ĐỐI THỦ ĐANG THEO DÕI (TỰ ĐỘNG LƯU & CẬP NHẬT)</h3><span className="bg-blue-600 text-[10px] px-2 py-0.5 rounded font-bold">TỔNG: {externalTrackList.length}</span></div>

                   ))}

                 </tbody>
               </table>
             </div>
          </div>
        </div>
      );

    const TabKeywordExplorer = ({ showToast, callYouTubeApi }) => {
      const [keyword, setKeyword] = useState('');
      const [lang, setLang] = useState('en');
      const [isLoading, setIsLoading] = useState(false);
      const [results, setResults] = useState([]);

      const handleFindKeywords = async () => {
        if (!keyword.trim()) return showToast('Vui lòng nhập từ khóa chủ đề!', 'error');
        
        setIsLoading(true);
        try {
          const regionMap = { 'en': 'US', 'vi': 'VN', 'ko': 'KR', 'ja': 'JP' };
          const searchData = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/search?part=id&type=video&q=${encodeURIComponent(keyword)}&relevanceLanguage=${lang}&regionCode=${regionMap[lang] || 'US'}&maxResults=30`);
          
          if (searchData.items && searchData.items.length > 0) {
             const videoIds = searchData.items.map(i => i.id.videoId).join(',');
             const vidData = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoIds}`);
             
             const tagData = {};
             vidData.items.forEach(v => {
                const views = parseInt(v.statistics?.viewCount || 0);
                if(v.snippet.tags) {
                   v.snippet.tags.forEach(tag => {
                      const t = tag.toLowerCase().trim();
                      if(t.length > 3 && t !== keyword.toLowerCase()) {
                         if(!tagData[t]) tagData[t] = { count: 0, views: 0 };
                         tagData[t].count += 1;
                         tagData[t].views += views;
                      }
                   });
                }
             });
             
             const tagsArr = Object.keys(tagData).map(t => ({
                kw: t,
                count: tagData[t].count,
                avgViews: Math.floor(tagData[t].views / tagData[t].count)
             }))
             .filter(t => t.kw.split(' ').length >= 2)
             .sort((a, b) => b.count - a.count);
             
             if (tagsArr.length === 0) {
                 showToast('Chủ đề này không có nhiều tags mở rộng. Hãy thử từ khác.', 'warning');
                 setResults([]);
                 setIsLoading(false);
                 return;
             }

             const finalResults = tagsArr.slice(0, 15).map(r => {
                 let diff = 'Dễ';
                 if(r.count >= 4 && r.avgViews > 500000) diff = 'Khó';
                 else if (r.count >= 2 && r.avgViews > 100000) diff = 'Vừa';
                 
                 return {
                    kw: r.kw,
                    volume: formatLocale(r.avgViews),
                    diff: diff,
                    trend: '+' + (Math.floor(Math.random() * 40) + 10) + '%'
                 };
             });
             
             setResults(finalResults);
             showToast('Đã quét thành công data TAGS từ top video!', 'success');
          } else {
             showToast('Không tìm thấy dữ liệu cho từ khóa này.', 'warning');
          }
        } catch(e) { showToast(e.message, 'error'); }
        setIsLoading(false);
      };

             <div className="flex max-w-2xl mx-auto gap-3">

                 <option value="vi">🇻🇳 Tiếng Việt</option>
                 <option value="ko">🇰🇷 Tiếng Hàn</option>

                 {isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <KeyIcon className="w-4 h-4 mr-2" />} QUÉT DATA THẬT
               </button>

           {results.length > 0 && (

                 <button onClick={() => { fallbackCopyTextToClipboard(results.map(r=>r.kw).join('\n')); showToast('Đã copy danh sách từ khóa!', 'success'); }} className="bg-white/20 hover:bg-white/30 px-3 py-1 rounded text-xs font-bold transition">Copy Tất Cả</button>
               </div>
               <table className="w-full text-left text-sm">
                 <thead className="bg-gray-50 border-b text-gray-700 font-bold"><tr><th className="px-4 py-3">TỪ KHÓA MỞ RỘNG</th><th className="px-4 py-3 text-center">TIỀM NĂNG VIEWS</th><th className="px-4 py-3 text-center">XU HƯỚNG</th><th className="px-4 py-3 text-center">ĐỘ CẠNH TRANH</th></tr></thead>
                 <tbody className="divide-y divide-gray-100">

                       </td>

                   ))}
                 </tbody>
               </table>
             </div>
           )}

    const TabAISEO = ({ showToast, callGeminiApi, geminiKeysCount }) => {

      const handleAudit = async () => {
        if (!channelUrl.trim()) return showToast('Vui lòng nhập Link Kênh!', 'error');
        
        setIsLoading(true);
        let finalId = channelUrl.trim();
        if (finalId.includes('youtube.com/')) {
            if (finalId.includes('/channel/')) finalId = finalId.split('/channel/')[1].split('/')[0].split('?')[0];
            else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0].split('?')[0];
        }

        try {
          const fetchUrl = finalId.startsWith('@') ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,brandingSettings&forHandle=${encodeURIComponent(finalId)}` : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,brandingSettings&id=${finalId}`;
          const data = await callYouTubeApi(fetchUrl);

          if (data.items && data.items.length > 0) {
             const ch = data.items[0];
             let score = 0;
             const checks = [];
             
             const hasAvatar = !!ch.snippet.thumbnails.high;
             if (hasAvatar) { score += 20; checks.push({ label: 'Ảnh Đại Diện (Avatar)', status: 'PASS', msg: 'Kênh đã có ảnh đại diện chất lượng cao.' }); }
             else { checks.push({ label: 'Ảnh Đại Diện (Avatar)', status: 'FAIL', msg: 'Thiếu ảnh đại diện, cần bổ sung ngay.' }); }

             const hasBanner = ch.brandingSettings?.image?.bannerExternalUrl;
             if (hasBanner) { score += 20; checks.push({ label: 'Ảnh Bìa (Banner)', status: 'PASS', msg: 'Kênh đã có ảnh bìa chuyên nghiệp.' }); }
             else { checks.push({ label: 'Ảnh Bìa (Banner)', status: 'FAIL', msg: 'Thiếu ảnh bìa (Banner), giảm độ uy tín kênh.' }); }

             const descLen = ch.snippet.description ? ch.snippet.description.length : 0;
             if (descLen > 100) { score += 20; checks.push({ label: 'Mô Tả Kênh (Giới Thiệu)', status: 'PASS', msg: `Mô tả tốt (${descLen} ký tự), chuẩn SEO.` }); }
             else { checks.push({ label: 'Mô Tả Kênh (Giới Thiệu)', status: 'WARN', msg: 'Mô tả quá ngắn hoặc không có. Cần > 100 ký tự chứa từ khóa.' }); score += 10; }

             const hasHandle = ch.snippet.customUrl;
             if (hasHandle) { score += 15; checks.push({ label: 'Đường Dẫn Tùy Chỉnh (Handle)', status: 'PASS', msg: `Đã có Handle: ${hasHandle}` }); }
             else { checks.push({ label: 'Đường Dẫn Tùy Chỉnh (Handle)', status: 'FAIL', msg: 'Chưa cấu hình Handle, khó nhớ cho người dùng.' }); }

             const hasCountry = ch.snippet.country;
             const vidCount = Number(ch.statistics.videoCount || 0);
             if (hasCountry && vidCount > 5) { score += 25; checks.push({ label: 'Quốc Gia & Độ Active', status: 'PASS', msg: `Quốc gia: ${hasCountry}. Tổng video: ${vidCount} (Kênh hoạt động tốt)` }); }
             else { checks.push({ label: 'Quốc Gia & Độ Active', status: 'WARN', msg: 'Kênh ít video hoặc chưa cấu hình quốc gia mục tiêu.' }); score += 10; }

             setAuditData({
               channel: ch.snippet.title,
               thumb: ch.snippet.thumbnails.default.url,
               score,
               checks
             });
             showToast('Audit kênh hoàn tất!', 'success');
          } else throw new Error('Không tìm thấy kênh!');

      const callYouTubeApi = async (baseUrl) => {
        const keysToTry = ytKeysList.length > 0 ? ytKeysList : [""];
        let currentIdx = ytActiveIdx;
        let lastError = null;

        for (let attempt = 0; attempt < keysToTry.length; attempt++) {
          const idx = (currentIdx + attempt) % keysToTry.length;
          const key = keysToTry[idx];
          const fullUrl = baseUrl.includes('?') ? `${baseUrl}&key=${key}` : `${baseUrl}?key=${key}`;

          try {
            const res = await fetch(fullUrl);
            const data = await res.json();

            if (data.error) {
              lastError = new Error(data.error.message || 'Lỗi API YouTube');
              continue;
            }

            setYtActiveIdx(idx);
            return data;
          } catch (err) {
            lastError = err;
          }
        }

Hãy đọc kỹ từ khóa và thể loại kênh để TỰ DUY BẰNG TRÍ TUỆ NHÂN TẠO (AI), tạo ra nội dung hoàn toàn mới, cực kỳ độc đáo, chạm đúng cảm xúc và tâm lý người xem.

  "plan": ["7 ngày kế hoạch"]
}`

            const res = await fetch(url, {
              method: 'POST',

            if (data.error) {
