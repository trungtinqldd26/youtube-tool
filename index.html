            systemInstruction = `Bạn là chuyên gia tư duy chiến lược SEO YouTube. Trả về DUY NHẤT một đối tượng JSON chuẩn: {"titles": ["5 tiêu đề"], "desc": "Bài mô tả", "tags": ["15 tag SEO"], "prompt": "Prompt vẽ ảnh", "plan": ["7 ngày kế hoạch"]}`;
            payload = {
              contents: [{ parts: [{ text: `Phân tích chuyên sâu từ khóa "${keyword || prompt}" (Thể loại kênh: ${topic || 'Giải trí'}).` }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] },
              generationConfig: { responseMimeType: "application/json" }
            };
        } else if (mode === 'niches') {
            systemInstruction = `Bạn là chuyên gia phân tích hành vi tìm kiếm YouTube. QUY TẮC BẮT BUỘC: Mọi từ khóa đề xuất BẮT BUỘC PHẢI CHỨA TỪ KHÓA GỐC BẮT ĐẦU. Trả về DUY NHẤT đối tượng JSON dạng: {"keywords": ["từ gốc ngách 1", "từ gốc ngách 2", ..., "từ gốc ngách 20"]}. Không đổi nghĩa gốc hay phát sinh chủ đề âm nhạc.`;
            payload = {
              contents: [{ parts: [{ text: prompt }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] },
              generationConfig: { responseMimeType: "application/json", temperature: 0.3 }
            };
        }

        for (let attempt = 0; attempt < keysToTry.length; attempt++) {
          const idx = (currentIdx + attempt) % keysToTry.length;
          const key = keysToTry[idx];
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`;
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();
            if (data.error) { lastError = new Error(data.error.message || 'Lỗi API'); continue; }
            if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
              setGeminiActiveIdx(idx); return data;
            }
          } catch (err) { lastError = err; }
        }
        throw lastError || new Error("Không thể kết nối đến Gemini AI.");
      };

      const saveApiKeysSettings = () => {
        const newYtList = ytKeysInputText.split('\n').map(k => k.trim()).filter(Boolean);
        const newGeminiList = geminiKeysInputText.split('\n').map(k => k.trim()).filter(Boolean);
        setYtKeysList(newYtList); localStorage.setItem('yt_keys_list', JSON.stringify(newYtList));
        setGeminiKeysList(newGeminiList); localStorage.setItem('gemini_keys_list', JSON.stringify(newGeminiList));
        setShowSettings(false); showToast('Đã lưu danh sách API Key thành công!', 'success');
      };

      const restoreDefaultKeys = () => {
        setYtKeysList(DEFAULT_YOUTUBE_KEYS); localStorage.setItem('yt_keys_list', JSON.stringify(DEFAULT_YOUTUBE_KEYS));
        setYtKeysInputText(DEFAULT_YOUTUBE_KEYS.join('\n'));
        setGeminiKeysList(DEFAULT_GEMINI_KEYS); localStorage.setItem('gemini_keys_list', JSON.stringify(DEFAULT_GEMINI_KEYS));
        setGeminiKeysInputText(DEFAULT_GEMINI_KEYS.join('\n'));
        showToast('Đã khôi phục toàn bộ Key mặc định!', 'success');
      };

      const useFreeSearch = () => {
        if (userPlan !== 'FREE') return true;
        if (freeSearchesLeft <= 0) return false;
        const nextLeft = freeSearchesLeft - 1;
        setFreeSearchesLeft(nextLeft); localStorage.setItem('free_searches_left', String(nextLeft));
        return true;
      };

      const handleAddAllToTracking = (channelsToAdd) => {
        setTrackedChannelsList(prev => {
          const existingIds = new Set(prev.map(c => c.id));
          const newEntries = channelsToAdd.filter(c => !existingIds.has(c.id)).map(c => ({
            id: c.id, name: c.name, handle: c.handle, sub: c.sub, subGrowth: '+0', views: c.views, date: new Date().toLocaleDateString('vi-VN'), status: 'Đang theo dõi', thumbnail: c.thumbnail
          }));
          return [...newEntries, ...prev];
        });
      };

      const navigateToSpy = (channelId) => { setSpyTargetId(channelId); setActiveTab('tab3'); };
      const navigateToCheckVideo = (videoId) => { setCheckVideoTargetId(videoId); setActiveTab('tab5'); };

      const tabs = [
        { id: 'tab1', label: 'TÌM TREND HOT REAL-TIME', icon: Flame, isLocked: false },
        { id: 'tab2', label: 'TÌM KÊNH & ĐÁNH GIÁ TỪ KHÓA', icon: Search, isLocked: false },
        { id: 'tab3', label: 'PHÂN TÍCH KÊNH ĐỐI THỦ (SPY)', icon: BarChart2, isLocked: false },
        { id: 'tab4', label: 'SO SÁNH ĐỐI THỦ', icon: GitCompare, isLocked: false },
        { id: 'tab5', label: 'KIỂM TRA LINK VIDEO', icon: LinkIcon, isLocked: false },
        { id: 'tab6', label: 'THEO DÕI ĐỐI THỦ (TRACKING)', icon: Target, isLocked: false },
        { id: 'tab7', label: 'TÌM NGÁCH YOUTUBE', icon: LayoutGrid, isLocked: userPlan === 'FREE' },
        { id: 'tab8', label: 'TÌM KEY VIEW NGOẠI', icon: KeyIcon, isLocked: userPlan === 'FREE' },
        { id: 'tab9', label: 'AI SEO & KẾ HOẠCH', icon: Sparkles, isLocked: userPlan === 'FREE' },
        { id: 'tab10', label: 'AUDIT KÊNH', icon: ShieldCheck, isLocked: userPlan === 'FREE' },
      ];

      const handleTabClick = (tab) => {
        if (tab.isLocked) { setCheckoutStep(1); setShowUpgradeModal(true); return; }
        setActiveTab(tab.id);
      };

      const openUpgradeModal = () => { setCheckoutStep(1); setShowUpgradeModal(true); };

      const handleStartPurchase = (plan) => {
        setSelectedPlanToBuy(plan); setOrderCode(`MUA${plan}${Math.floor(1000 + Math.random() * 9000)}`);
        setCheckoutStep(2); setPaymentStatus('idle');
      };

      const handleSimulatePaymentCheck = () => {
        setPaymentStatus('checking');
        setTimeout(() => {
          setPaymentStatus('success'); setUserPlan(selectedPlanToBuy); localStorage.setItem('user_plan', selectedPlanToBuy);
          showToast(`Kích hoạt thành công gói ${selectedPlanToBuy}! Cảm ơn bạn.`, "success");
          setTimeout(() => { setShowUpgradeModal(false); setCheckoutStep(1); }, 1800);
        }, 2000);
      };

      return (
        <div className="min-h-screen bg-white text-gray-800 font-sans flex flex-col">
          <Header onOpenSettings={() => setShowSettings(true)} onOpenUpgrade={openUpgradeModal} onOpenHistory={() => setShowHistoryModal(true)} userPlan={userPlan} freeSearchesLeft={freeSearchesLeft} activeYtKeyCount={ytKeysList.length} activeGeminiKeyCount={geminiKeysList.length} />
          
          <div className="bg-gray-100 border-b border-gray-200 px-4 pt-3 flex space-x-1 overflow-x-auto custom-scrollbar shadow-inner">
            {tabs.map((tab) => {
              const isActive = activeTab === tab.id;
              const Icon = tab.icon;
              return (
                <button
                  key={tab.id}
                  onClick={() => handleTabClick(tab)}
                  className={`flex items-center px-3.5 py-2.5 rounded-t-lg text-[11px] font-bold transition-colors whitespace-nowrap border-t border-l border-r relative ${
                    isActive ? 'bg-blue-600 text-white border-blue-700 shadow-[0_-2px_5px_rgba(0,0,0,0.1)]' : 'bg-gray-200 text-gray-600 border-gray-300 hover:bg-gray-300'
                  }`}
                >
                  <Icon className={`w-3.5 h-3.5 mr-1.5 ${isActive ? 'text-blue-100' : 'text-gray-500'}`} />
                  {tab.label}
                  {tab.isLocked && <Lock className="w-3 h-3 ml-1.5 text-orange-500" />}
                </button>
              );
            })}
          </div>

          <main className="flex-1 overflow-hidden relative bg-gray-50">
            <div style={{ display: activeTab === 'tab1' ? 'block' : 'none', height: '100%' }}>
              <TabTrending showToast={showToast} callYouTubeApi={callYouTubeApi} onSpyChannel={navigateToSpy} onCheckVideo={navigateToCheckVideo} />
            </div>
            <div style={{ display: activeTab === 'tab2' ? 'block' : 'none', height: '100%' }}>
              <TabFindChannels showToast={showToast} callYouTubeApi={callYouTubeApi} callGeminiApi={callGeminiApi} ytKeysCount={ytKeysList.length} geminiKeysCount={geminiKeysList.length} onOpenSettings={() => setShowSettings(true)} onOpenHistory={() => setShowHistoryModal(true)} onSpyChannel={navigateToSpy} onCheckVideo={navigateToCheckVideo} onAddAllToTracking={handleAddAllToTracking} userPlan={userPlan} onOpenUpgrade={openUpgradeModal} freeSearchesLeft={freeSearchesLeft} useFreeSearch={useFreeSearch} addQuotaUnits={addQuotaUnits} sessionQuota={sessionQuota} todayTotalQuota={todayTotalQuota} />
            </div>
            <div style={{ display: activeTab === 'tab3' ? 'block' : 'none', height: '100%' }}>
              <TabSpyChannel showToast={showToast} callYouTubeApi={callYouTubeApi} externalChannelId={spyTargetId} onAnalyzeVideo={navigateToCheckVideo} />
            </div>
            <div style={{ display: activeTab === 'tab4' ? 'block' : 'none', height: '100%' }}>
              <TabCompareChannels showToast={showToast} callYouTubeApi={callYouTubeApi} />
            </div>
            <div style={{ display: activeTab === 'tab5' ? 'block' : 'none', height: '100%' }}>
              <TabCheckVideo showToast={showToast} callYouTubeApi={callYouTubeApi} initialVideoId={checkVideoTargetId} onSpyChannel={navigateToSpy} />
            </div>
            <div style={{ display: activeTab === 'tab6' ? 'block' : 'none', height: '100%' }}>
              <TabTracking showToast={showToast} callYouTubeApi={callYouTubeApi} onSpyChannel={navigateToSpy} externalTrackList={trackedChannelsList} setExternalTrackList={setTrackedChannelsList} />
            </div>
            <div style={{ display: activeTab === 'tab7' ? 'block' : 'none', height: '100%' }}>
              <TabNicheResearch showToast={showToast} callYouTubeApi={callYouTubeApi} onCheckVideo={navigateToCheckVideo} />
            </div>
            <div style={{ display: activeTab === 'tab8' ? 'block' : 'none', height: '100%' }}>
              <TabKeywordExplorer showToast={showToast} callYouTubeApi={callYouTubeApi} />
            </div>
            <div style={{ display: activeTab === 'tab9' ? 'block' : 'none', height: '100%' }}>
              <TabAISEO showToast={showToast} callGeminiApi={callGeminiApi} geminiKeysCount={geminiKeysList.length} />
            </div>
            <div style={{ display: activeTab === 'tab10' ? 'block' : 'none', height: '100%' }}>
              <TabChannelAudit showToast={showToast} callYouTubeApi={callYouTubeApi} />
            </div>
          </main>

          {/* Modal Nâng Cấp Gói */}
          {showUpgradeModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[110] backdrop-blur-sm animate-fade-in p-4">
              <div className="bg-white p-2 rounded-2xl w-full max-w-3xl shadow-2xl relative overflow-hidden">
                <button onClick={() => setShowUpgradeModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 z-10"><X className="w-6 h-6" /></button>
                {checkoutStep === 1 && (
                  <div className="p-6 md:p-8">
                    <div className="text-center mb-8">
                       <h3 className="font-extrabold text-2xl text-gray-800 flex items-center justify-center gap-2"><Crown className="text-orange-500 w-8 h-8"/> NÂNG CẤP GÓI DỊCH VỤ CHUYÊN NGHIỆP</h3>
                       <p className="text-sm text-gray-500 mt-2">Mở khóa toàn bộ 10 công cụ.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                       <div className={`p-4 rounded-xl border-2 flex flex-col justify-between ${userPlan === 'FREE' ? 'border-blue-500 bg-blue-50/20' : 'border-gray-200'}`}>
                          <div>
                            <div className="font-bold text-gray-800 text-sm">Gói Miễn Phí</div><div className="text-lg font-black text-blue-600 my-1">0đ</div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3"><li>• Dùng thử 3 lần tìm kiếm</li><li>• Chỉ dùng 6 Tab cơ bản</li></ul>
                          </div>
                          <div className="mt-4 text-center"><span className="text-[10px] font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full uppercase tracking-wider">Đang sử dụng</span></div>
                       </div>
                       <div className={`p-5 rounded-xl border-2 shadow-lg flex flex-col justify-between ${userPlan === 'PRO' ? 'border-orange-500 bg-orange-50/20' : 'border-orange-200 bg-orange-50/10'}`}>
                          <div>
                            <div className="flex justify-between items-center"><span className="font-bold text-orange-600 text-sm">Chuyên Nghiệp</span></div>
                            <div className="text-2xl font-black text-orange-600 my-2">299k<span className="text-xs text-gray-500 font-normal">/tháng</span></div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3 font-medium"><li>• Quét tới 200 kết quả</li><li>• Không giới hạn lượt tìm</li><li>• Mở khóa tất cả 10 Tab</li></ul>
                          </div>
                          <button onClick={() => handleStartPurchase('PRO')} className="mt-6 w-full bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-2.5 rounded-lg shadow-md transition-all transform hover:scale-105">NÂNG CẤP PRO</button>
                       </div>
                       <div className={`p-5 rounded-xl border-2 flex flex-col justify-between ${userPlan === 'VIP' ? 'border-purple-500 bg-purple-50/20' : 'border-purple-200 bg-purple-50/10'}`}>
                          <div>
                            <div className="font-bold text-purple-700 text-sm">Doanh Nghiệp / VIP</div><div className="text-2xl font-black text-purple-600 my-2">699k<span className="text-xs text-gray-500 font-normal">/tháng</span></div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3 font-medium"><li>• Quét không giới hạn (Unlimited)</li><li>• Tự động xoay từ khóa API</li><li>• Hỗ trợ 1:1 VIP & Tool A-Z</li></ul>
                          </div>
                          <button onClick={() => handleStartPurchase('VIP')} className="mt-6 w-full bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold py-2.5 rounded-lg shadow-md transition-all">NÂNG CẤP VIP</button>
                       </div>
                    </div>
                  </div>
                )}
                {checkoutStep === 2 && (
                  <div className="p-6 md:p-8">
                     <button onClick={() => setCheckoutStep(1)} className="text-blue-600 hover:underline mb-4 font-medium flex items-center text-sm">&larr; Quay lại chọn gói</button>
                     <div className="bg-blue-50/50 border border-blue-100 rounded-xl p-6 text-center">
                        <h2 className="text-xl font-bold text-gray-800 mb-2">Thanh toán tự động gói <span className="text-blue-600">{selectedPlanToBuy}</span></h2>
                        <div className="flex flex-col md:flex-row items-center justify-center gap-8 mt-6">
                          <div className="bg-white p-3 rounded-xl shadow-md border-2 border-dashed border-gray-300">
                            <img src={`https://img.vietqr.io/image/${MY_BANK.BANK_ID}-${MY_BANK.ACCOUNT_NO}-compact2.png?amount=${PLAN_PRICES[selectedPlanToBuy]}&addInfo=${orderCode}&accountName=${encodeURIComponent(MY_BANK.ACCOUNT_NAME)}`} alt="Mã QR Thanh Toán VietQR" className="w-56 h-56 md:w-64 md:h-64 object-contain" />
                          </div>
                          <div className="text-left bg-white p-5 rounded-xl shadow-md w-full max-w-sm text-sm border border-gray-100">
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3"><span className="text-gray-500">Số tài khoản:</span><span className="font-bold text-gray-800">{MY_BANK.ACCOUNT_NO}</span></div>
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3"><span className="text-gray-500">Số tiền:</span><span className="font-bold text-blue-600 text-lg">{PLAN_PRICES[selectedPlanToBuy].toLocaleString()} VNĐ</span></div>
                             <div className="flex flex-col pt-1"><span className="text-gray-500 mb-1">Nội dung (Bắt buộc):</span><span className="font-mono font-bold text-red-600 bg-red-50 border border-red-100 px-3 py-2 rounded text-center tracking-widest text-lg">{orderCode}</span></div>
                          </div>
                        </div>
                        <div className="mt-8 border-t border-gray-200 pt-6">
                          {paymentStatus === 'idle' && (
                            <button onClick={handleSimulatePaymentCheck} className="w-full max-w-md mx-auto flex items-center justify-center py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold shadow-lg transition-all text-sm animate-pulse">TÔI ĐÃ CHUYỂN KHOẢN THÀNH CÔNG</button>
                          )}
                          {paymentStatus === 'success' && (
                            <div className="w-full max-w-md mx-auto flex items-center justify-center py-4 bg-green-100 text-green-800 border-2 border-green-500 rounded-xl font-bold text-sm animate-bounce"><CheckCircle className="w-6 h-6 mr-2 text-green-600" /> THANH TOÁN THÀNH CÔNG!</div>
                          )}
                        </div>
                     </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal Cài Đặt API Keys */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] backdrop-blur-sm animate-fade-in p-4">
              <div className="bg-white p-6 rounded-xl w-full max-w-lg shadow-2xl relative">
                <button onClick={() => setShowSettings(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><X className="w-5 h-5" /></button>
                <h3 className="font-bold text-xl text-gray-800 mb-2 flex items-center gap-2"><Settings className="w-5 h-5 text-blue-600"/> Quản Lý & Tự Động Xoay API Key</h3>
                <div className="space-y-4 mt-4">
                  <div>
                    <label className="text-xs font-bold text-gray-700">YouTube Data API V3 Keys ({ytKeysList.length} mã)</label>
                    <textarea rows={3} value={ytKeysInputText} onChange={(e) => setYtKeysInputText(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none font-mono text-xs custom-scrollbar mt-1" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-700 flex items-center"><Sparkles className="w-3.5 h-3.5 mr-1 text-orange-500"/> Google Gemini API Keys ({geminiKeysList.length} mã)</label>
                    <textarea rows={4} value={geminiKeysInputText} onChange={(e) => setGeminiKeysInputText(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-orange-500 outline-none font-mono text-xs custom-scrollbar mt-1" />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button onClick={restoreDefaultKeys} className="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-lg text-xs transition-colors">Khôi Phục Mặc Định</button>
                    <button onClick={saveApiKeysSettings} className="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-xs transition-colors shadow">Lưu Cấu Hình</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal Lịch Sử */}
          {showHistoryModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] backdrop-blur-sm animate-fade-in p-4">
              <div className="bg-white p-6 rounded-xl w-full max-w-xl shadow-2xl relative">
                <button onClick={() => setShowHistoryModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><X className="w-5 h-5" /></button>
                <h3 className="font-bold text-xl text-gray-800 mb-4 flex items-center gap-2"><History className="w-5 h-5 text-blue-600"/> Lịch Sử Tìm Kiếm & Quota API</h3>
                <div className="divide-y divide-gray-100 max-h-80 overflow-y-auto border border-gray-200 rounded-lg">
                   {historyLogs.map((log, idx) => (
                     <div key={idx} className="p-3 flex justify-between items-center text-xs hover:bg-gray-50">
                        <div><div className="font-bold text-gray-800">{log.kw}</div><div className="text-[10px] text-gray-500 mt-0.5">{log.time}</div></div>
                        <div className="text-right"><span className="font-bold text-blue-600">{log.count} kênh</span><div className="text-[10px] text-orange-600 font-mono">{log.quota} units</div></div>
                     </div>
                   ))}
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast.visible && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center px-4 py-3 rounded-md shadow-2xl border transition-all duration-300 animate-fade-in ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : toast.type === 'warning' ? 'bg-yellow-50 border-yellow-200 text-yellow-800' : 'bg-green-50 border-green-200 text-green-800'}`}>
               {toast.type === 'error' ? <AlertCircle className="w-5 h-5 mr-2 text-red-500" /> : <CheckCircle className="w-5 h-5 mr-2 text-green-500" />}
               <span className="text-sm font-bold">{toast.message}</span>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
