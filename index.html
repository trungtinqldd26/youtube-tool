      };

      const handleSimulatePaymentCheck = () => {
        setPaymentStatus('checking');
        
        setTimeout(() => {
          setPaymentStatus('success');
          setUserPlan(selectedPlanToBuy);
          localStorage.setItem('user_plan', selectedPlanToBuy);
          
          showToast(`Kích hoạt thành công gói ${selectedPlanToBuy}! Cảm ơn bạn.`, "success");
          
          setTimeout(() => {
            setShowUpgradeModal(false);
            setCheckoutStep(1);
          }, 1800);
        }, 2000);
      };

      return (
        <div className="min-h-screen bg-white text-gray-800 font-sans flex flex-col">
          <Header 
            onOpenSettings={() => setShowSettings(true)} 
            onOpenUpgrade={openUpgradeModal} 
            onOpenHistory={() => setShowHistoryModal(true)}
            userPlan={userPlan} 
            freeSearchesLeft={freeSearchesLeft}
            activeYtKeyCount={ytKeysList.length}
            activeGeminiKeyCount={geminiKeysList.length}
          />
          
          <div className="bg-gray-200 border-b border-gray-300 px-3 pt-2 flex space-x-1 overflow-x-auto custom-scrollbar shadow-inner">
            {tabs.map((tab) => {
              const isActive = activeTab === tab.id;
              const Icon = tab.icon;
              return (
                <button
                  key={tab.id}
                  onClick={() => handleTabClick(tab)}
                  className={`flex items-center px-3.5 py-2 rounded-t-lg text-[11px] font-extrabold transition-colors whitespace-nowrap border-t border-l border-r relative ${
                    isActive ? 'bg-blue-600 text-white border-blue-700 shadow-md' : 'bg-gray-300/80 text-gray-700 border-gray-400 hover:bg-gray-300'
                  }`}
                >
                  <Icon className={`w-3.5 h-3.5 mr-1.5 ${isActive ? 'text-white' : 'text-gray-600'}`} />
                  {tab.label}
                  {tab.isLocked && <Lock className="w-3 h-3 ml-1.5 text-orange-500" />}
                </button>
              );
            })}
          </div>

          <main className="flex-1 overflow-hidden relative bg-gray-50">
            <div style={{ display: activeTab === 'tab1' ? 'block' : 'none', height: '100%' }}>
              <TabFindChannels 
                showToast={showToast} 
                callYouTubeApi={callYouTubeApi} 
                callGeminiApi={callGeminiApi}
                ytKeysCount={ytKeysList.length} 
                geminiKeysCount={geminiKeysList.length}
                onOpenSettings={() => setShowSettings(true)} 
                onOpenHistory={() => setShowHistoryModal(true)}
                onSpyChannel={navigateToSpy} 
                onCheckVideo={navigateToCheckVideo} 
                onAddAllToTracking={handleAddAllToTracking}
                userPlan={userPlan} 
                onOpenUpgrade={openUpgradeModal} 
                freeSearchesLeft={freeSearchesLeft} 
                useFreeSearch={useFreeSearch}
                addQuotaUnits={addQuotaUnits}
                sessionQuota={sessionQuota}
                todayTotalQuota={todayTotalQuota}
              />
            </div>
            
            <div style={{ display: activeTab === 'tab2' ? 'block' : 'none', height: '100%' }}>
              <TabSpyChannel showToast={showToast} callYouTubeApi={callYouTubeApi} externalChannelId={spyTargetId} onAnalyzeVideo={navigateToCheckVideo} />
            </div>
            
            <div style={{ display: activeTab === 'tab3' ? 'block' : 'none', height: '100%' }}>
              <TabCheckVideo showToast={showToast} callYouTubeApi={callYouTubeApi} initialVideoId={checkVideoTargetId} />
            </div>
            
            <div style={{ display: activeTab === 'tab4' ? 'block' : 'none', height: '100%' }}>
              <TabTracking showToast={showToast} callYouTubeApi={callYouTubeApi} onSpyChannel={navigateToSpy} externalTrackList={trackedChannelsList} setExternalTrackList={setTrackedChannelsList} />
            </div>
            
            <div style={{ display: activeTab === 'tab5' ? 'block' : 'none', height: '100%' }}>
              <TabNicheResearch showToast={showToast} callYouTubeApi={callYouTubeApi} onCheckVideo={navigateToCheckVideo} />
            </div>
            
            <div style={{ display: activeTab === 'tab6' ? 'block' : 'none', height: '100%' }}>
              <TabKeywordExplorer showToast={showToast} callYouTubeApi={callYouTubeApi} />
            </div>
            
            <div style={{ display: activeTab === 'tab7' ? 'block' : 'none', height: '100%' }}>
              <TabAISEO showToast={showToast} callGeminiApi={callGeminiApi} geminiKeysCount={geminiKeysList.length} />
            </div>
            
            <div style={{ display: activeTab === 'tab8' ? 'block' : 'none', height: '100%' }}>
              <TabChannelAudit showToast={showToast} callYouTubeApi={callYouTubeApi} />
            </div>
          </main>

          {/* Modal History Log */}
          {showHistoryModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[110] backdrop-blur-sm animate-fade-in p-4">
              <div className="bg-white p-6 rounded-xl w-full max-w-xl shadow-2xl relative">
                <button onClick={() => setShowHistoryModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><X className="w-5 h-5" /></button>
                <h3 className="font-bold text-lg text-gray-800 mb-3 flex items-center gap-2"><History className="w-5 h-5 text-blue-600"/> Lịch Sử Quét & Quota API</h3>
                <div className="overflow-x-auto max-h-72 custom-scrollbar">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-gray-100 font-bold border-b">
                      <tr><th className="p-2">THỜI GIAN</th><th className="p-2">TỪ KHÓA</th><th className="p-2 text-center">KÊNH</th><th className="p-2 text-right">QUOTA UNIT</th></tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      {searchHistory.map((log, i) => (
                        <tr key={i}><td className="p-2 text-gray-500">{log.time}</td><td className="p-2 font-bold text-blue-700">{log.kw}</td><td className="p-2 text-center">{log.channels}</td><td className="p-2 text-right font-bold text-orange-600">{log.units} units</td></tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="mt-4 pt-3 border-t text-right">
                  <button onClick={() => setShowHistoryModal(false)} className="bg-gray-200 text-gray-800 font-bold px-4 py-1.5 rounded text-xs">ĐÓNG</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Upgrade */}
          {showUpgradeModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[110] backdrop-blur-sm animate-fade-in p-4">
              <div className="bg-white p-2 rounded-2xl w-full max-w-3xl shadow-2xl relative overflow-hidden">
                <button onClick={() => setShowUpgradeModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 z-10"><X className="w-6 h-6" /></button>
                
                {checkoutStep === 1 && (
                  <div className="p-6 md:p-8">
                    <div className="text-center mb-8">
                       <h3 className="font-extrabold text-2xl text-gray-800 flex items-center justify-center gap-2"><Crown className="text-orange-500 w-8 h-8"/> NÂNG CẤP GÓI DỊCH VỤ CHUYÊN NGHIỆP</h3>
                       <p className="text-sm text-gray-500 mt-2">Mở khóa toàn bộ 8 công cụ chuyên sâu dành cho Youtuber Pro.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                       <div className={`p-4 rounded-xl border-2 flex flex-col justify-between ${userPlan === 'FREE' ? 'border-blue-500 bg-blue-50/20' : 'border-gray-200'}`}>
                          <div>
                            <div className="font-bold text-gray-800 text-sm">Gói Miễn Phí</div><div className="text-lg font-black text-blue-600 my-1">0đ</div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3"><li>• Tối đa 15-20 kết quả quét</li><li>• Dùng thử 3 lần tìm kiếm</li><li>• Chỉ dùng 5 Tab cơ bản</li></ul>
                          </div>
                          <div className="mt-4 text-center"><span className="text-[10px] font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full uppercase tracking-wider">Đang sử dụng</span></div>
                       </div>
                       <div className={`p-5 rounded-xl border-2 shadow-lg flex flex-col justify-between ${userPlan === 'PRO' ? 'border-orange-500 bg-orange-50/20' : 'border-orange-200 bg-orange-50/10'}`}>
                          <div>
                            <div className="flex justify-between items-center"><span className="font-bold text-orange-600 text-sm">Chuyên Nghiệp</span><span className="bg-orange-500 text-white text-[9px] font-bold px-2 py-1 rounded">PHỔ BIẾN</span></div>
                            <div className="text-2xl font-black text-orange-600 my-2">299k<span className="text-xs text-gray-500 font-normal">/tháng</span></div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3 font-medium"><li>• Quét tới 200 kết quả</li><li>• Không giới hạn lượt tìm</li><li>• Mở khóa Tab AI SEO & Key Ngoại</li></ul>
                          </div>
                          <button onClick={() => handleStartPurchase('PRO')} className="mt-6 w-full bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-2.5 rounded-lg shadow-md transition-all transform hover:scale-105">NÂNG CẤP PRO</button>
                       </div>
                       <div className={`p-5 rounded-xl border-2 flex flex-col justify-between ${userPlan === 'VIP' ? 'border-purple-500 bg-purple-50/20' : 'border-purple-200 bg-purple-50/10'}`}>
                          <div>
                            <div className="font-bold text-purple-700 text-sm">Doanh Nghiệp / VIP</div><div className="text-2xl font-black text-purple-600 my-2">699k<span className="text-xs text-gray-500 font-normal">/tháng</span></div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3 font-medium"><li>• Quét không giới hạn (Unlimited)</li><li>• Tự động xoay từ khóa API</li><li>• Audit & Tool VIP A-Z</li></ul>
                          </div>
                          <button onClick={() => handleStartPurchase('VIP')} className="mt-6 w-full bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold py-2.5 rounded-lg shadow-md transition-all">NÂNG CẤP VIP</button>
                       </div>
                    </div>
                  </div>
                )}

                {checkoutStep === 2 && (
                  <div className="p-6 md:p-8">
                     <button onClick={() => setCheckoutStep(1)} className="text-blue-600 hover:underline mb-4 font-medium flex items-center text-sm">
                       &larr; Quay lại chọn gói
                     </button>
                     
                     <div className="bg-blue-50/50 border border-blue-100 rounded-xl p-6 text-center">
                        <h2 className="text-xl font-bold text-gray-800 mb-2">Thanh toán tự động gói <span className="text-blue-600">{selectedPlanToBuy}</span></h2>
                        <p className="text-sm text-gray-600 mb-6">Sử dụng ứng dụng ngân hàng quét mã QR bên dưới để thanh toán. Cú pháp sẽ được tự động điền.</p>
                        
                        <div className="flex flex-col md:flex-row items-center justify-center gap-8">
                          <div className="bg-white p-3 rounded-xl shadow-md border-2 border-dashed border-gray-300">
                            <img 
                              src={`https://img.vietqr.io/image/${MY_BANK.BANK_ID}-${MY_BANK.ACCOUNT_NO}-compact2.png?amount=${PLAN_PRICES[selectedPlanToBuy]}&addInfo=${orderCode}&accountName=${encodeURIComponent(MY_BANK.ACCOUNT_NAME)}`} 
                              alt="Mã QR Thanh Toán VietQR" 
                              className="w-56 h-56 md:w-64 md:h-64 object-contain" 
                            />
                          </div>

                          <div className="text-left bg-white p-5 rounded-xl shadow-md w-full max-w-sm text-sm border border-gray-100">
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3">
                               <span className="text-gray-500">Ngân hàng thụ hưởng:</span>
                               <span className="font-bold text-gray-800">MBBank</span>
                             </div>
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3">
                               <span className="text-gray-500">Số tài khoản:</span>
                               <span className="font-bold text-gray-800">{MY_BANK.ACCOUNT_NO}</span>
                             </div>
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3">
                               <span className="text-gray-500">Chủ tài khoản:</span>
                               <span className="font-bold text-gray-800">{MY_BANK.ACCOUNT_NAME}</span>
                             </div>
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3">
                               <span className="text-gray-500">Số tiền:</span>
                               <span className="font-bold text-blue-600 text-lg">{PLAN_PRICES[selectedPlanToBuy].toLocaleString()} VNĐ</span>
                             </div>
                             <div className="flex flex-col pt-1">
                               <span className="text-gray-500 mb-1">Nội dung chuyển khoản (Bắt buộc):</span>
                               <span className="font-mono font-bold text-red-600 bg-red-50 border border-red-100 px-3 py-2 rounded text-center tracking-widest text-lg">{orderCode}</span>
                             </div>
                          </div>
                        </div>

                        <div className="mt-8 border-t border-gray-200 pt-6">
                          {paymentStatus === 'idle' && (
                            <button 
                              onClick={handleSimulatePaymentCheck}
                              className="w-full max-w-md mx-auto flex items-center justify-center py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold shadow-lg transition-all text-sm animate-pulse"
                            >
                              <CheckCircle className="w-5 h-5 mr-2" />
                              TÔI ĐÃ CHUYỂN KHOẢN THÀNH CÔNG
                            </button>
                          )}

                          {paymentStatus === 'checking' && (
                            <div className="w-full max-w-md mx-auto flex items-center justify-center py-4 bg-gray-200 text-gray-700 rounded-xl font-bold text-sm">
                              <RefreshCw className="w-5 h-5 mr-2 animate-spin text-blue-600" />
                              Hệ thống đang kiểm tra giao dịch (Vui lòng đợi 2s)...
                            </div>
                          )}

                          {paymentStatus === 'success' && (
                            <div className="w-full max-w-md mx-auto flex items-center justify-center py-4 bg-green-100 text-green-800 border-2 border-green-500 rounded-xl font-bold text-sm animate-bounce">
                              <CheckCircle className="w-6 h-6 mr-2 text-green-600" />
                              THANH TOÁN THÀNH CÔNG! HỆ THỐNG ĐANG MỞ KHÓA...
                            </div>
                          )}
                        </div>
                     </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Settings API Modal */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] backdrop-blur-sm animate-fade-in p-4">
              <div className="bg-white p-6 rounded-xl w-full max-w-lg shadow-2xl relative">
                <button onClick={() => setShowSettings(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><X className="w-5 h-5" /></button>
                <h3 className="font-bold text-xl text-gray-800 mb-2 flex items-center gap-2"><Settings className="w-5 h-5 text-blue-600"/> Quản Lý & Tự Động Xoay API Key</h3>
                <p className="text-xs text-gray-500 mb-4">Mỗi mã xuống 1 dòng. Hệ thống sẽ tự động lưu và chuyển sang mã dự phòng khi bị hết Quota.</p>
                
                <div className="space-y-4">
                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-bold text-gray-700">YouTube Data API V3 Keys ({ytKeysList.length} mã)</label>
                      <span className="text-[10px] text-blue-600 font-semibold">Key đang dùng: #{ytActiveIdx + 1}</span>
                    </div>
                    <textarea 
                      rows={3} 
                      value={ytKeysInputText} 
                      onChange={(e) => setYtKeysInputText(e.target.value)} 
                      placeholder="Dán mã API YouTube tại đây (mỗi mã 1 dòng)..." 
                      className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none font-mono text-xs custom-scrollbar"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-bold text-gray-700 flex items-center">
                        <Sparkles className="w-3.5 h-3.5 mr-1 text-orange-500"/> Google Gemini API Keys ({geminiKeysList.length} mã)
                      </label>
                      <span className="text-[10px] text-orange-600 font-semibold">Key đang dùng: #{geminiActiveIdx + 1}</span>
                    </div>
                    <textarea 
                      rows={4} 
                      value={geminiKeysInputText} 
                      onChange={(e) => setGeminiKeysInputText(e.target.value)} 
                      placeholder="Dán mã API Gemini tại đây (mỗi mã 1 dòng)..." 
                      className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-orange-500 outline-none font-mono text-xs custom-scrollbar"
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button onClick={restoreDefaultKeys} className="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-lg text-xs transition-colors">
                      Khôi Phục Mặc Định
                    </button>
                    <button onClick={saveApiKeysSettings} className="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-xs transition-colors shadow">
                      Lưu Cấu Hình & Ghi Nhớ
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast.visible && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center px-4 py-3 rounded-md shadow-2xl border transition-all duration-300 animate-fade-in ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : toast.type === 'warning' ? 'bg-yellow-50 border-yellow-200 text-yellow-800' : 'bg-green-50 border-green-200 text-green-800'}`}>
               {toast.type === 'error' ? <AlertCircle className="w-5 h-5 mr-2 text-red-500" /> : <CheckCircle className="w-5 h-5 mr-2 text-green-500" />}
               <span className="text-sm font-bold">{toast.message}</span>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
