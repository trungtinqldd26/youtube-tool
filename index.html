    const calculateOutlierScore = (views, subs, videos, ageDays) => {
      const rawSubs = Math.max(1, subs);
      const rawViews = Math.max(0, views);
      const viralRatio = rawViews / rawSubs;

      let viralScore = 2.0;
      if (viralRatio >= 300) viralScore = 6.5;
      else if (viralRatio >= 100) viralScore = 5.8;
      else if (viralRatio >= 50) viralScore = 5.0;
      else if (viralRatio >= 10) viralScore = 4.0;
      else if (viralRatio >= 2) viralScore = 3.0;

      let scaleBonus = 0.5;
      if (rawSubs <= 10000) scaleBonus = 2.0;
      else if (rawSubs <= 50000) scaleBonus = 1.6;
      else if (rawSubs <= 200000) scaleBonus = 1.2;
      else if (rawSubs <= 1000000) scaleBonus = 0.8;

      const avgViewsPerVideo = rawViews / Math.max(1, videos);
      let efficiencyBonus = 0.5;
      if (avgViewsPerVideo >= 100000) efficiencyBonus = 1.5;
      else if (avgViewsPerVideo >= 20000) efficiencyBonus = 1.0;

      const totalScore = viralScore + scaleBonus + efficiencyBonus;
      return Math.min(9.8, Math.max(3.5, totalScore)).toFixed(1);
    };

    const formatLocale = (num) => Number(num || 0).toLocaleString('vi-VN');

    const parseIsoDuration = (isoDuration) => {
      if (!isoDuration) return 'N/A';
      const match = isoDuration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return isoDuration;
      const hours = parseInt(match[1] || 0);
      const minutes = parseInt(match[2] || 0);
      const seconds = parseInt(match[3] || 0);
      if (hours > 0) return `${hours}h ${minutes}m`;
      return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    };

    const isShortsDuration = (isoDuration) => {
      if (!isoDuration) return false;
      const match = isoDuration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return false;
      const hours = parseInt(match[1] || 0);
      const minutes = parseInt(match[2] || 0);
      const seconds = parseInt(match[3] || 0);
      return hours === 0 && minutes === 0 && seconds <= 60;
    };

    const getTimeFilterDate = (filterType) => {
      const d = new Date();
      switch (filterType) {
        case 'today': d.setDate(d.getDate() - 1); break;
        case 'week': d.setDate(d.getDate() - 7); break;
        case 'month': d.setDate(d.getDate() - 30); break;
        case 'year': d.setFullYear(d.getFullYear() - 1); break;
        default: return null;
      }
      return d.toISOString();
    };

    const calculateAgeDays = (publishedAt) => {
      if (!publishedAt) return 1;
      const days = Math.floor((new Date() - new Date(publishedAt)) / (1000 * 60 * 60 * 24));
      return Math.max(1, days);
    };

    const extractSubNicheFromTitle = (title, searchKw) => {
      if (!title) return searchKw;
      let cleanTitle = title
        .replace(/#[^\s#<>]+/g, '')
        .replace(/(https?:\/\/[^\s]+)/g, '')
        .replace(/[\(\)\[\]\{\}\_\-\|\:\!\?\•\“\”\"\'\d\=\+\*\&\^\%\$\@]/g, ' ')
        .replace(/[^\p{L}\p{N}\s]/gu, '')
        .replace(/\s+/g, ' ')
        .trim();

      const words = cleanTitle.split(' ').filter(w => w.length > 1);
      if (words.length <= 2) return searchKw;

      const validWords = words.filter(w => !/^(.)\1+$/i.test(w));
      if (validWords.length === 0) return searchKw;

      const resultPhrase = validWords.slice(0, 5).join(' ');
      return resultPhrase.charAt(0).toUpperCase() + resultPhrase.slice(1).toLowerCase();
    };

    const fallbackCopyTextToClipboard = (text) => {

      document.body.removeChild(textArea);
    };

    const Header = ({ onOpenSettings, onOpenUpgrade, onOpenHistory, userPlan, freeSearchesLeft, activeYtKeyCount, activeGeminiKeyCount }) => (

      const handleSearch = async (overrideKeyword = null) => {

        setIsLoading(true); setHasSearched(true);

        try {
          const timeDate = getTimeFilterDate(timeRange);
          const timeQuery = timeDate ? `&publishedAfter=${encodeURIComponent(timeDate)}` : '';
          const regionQuery = region !== 'GLOBAL' ? `&regionCode=${encodeURIComponent(region)}` : '';
          
          let collectedChannels = [];
          let unitsUsedThisSearch = 0;

          let final20Keywords = [];
          try {

            const aiPrompt = `Từ khóa gốc bắt buộc: "${queryKw}".
Nhiệm vụ: Hãy tư duy và đề xuất ĐÚNG 20 từ khóa ngách nhỏ (Long-tail search queries) để tìm kiếm kênh YouTube tại thị trường ${countryStr}.
QUY TẮC BẮT BUỘC: Tất cả 20 từ khóa BẮT BUỘC PHẢI BẮT ĐẦU HOẶC CHỨA CHÍNH XÁC CỤM TỪ CỐ ĐỊNH "${queryKw}". Không được đổi từ khóa gốc sang từ khác.
Phân bổ 20 từ khóa ngách này theo 4 nhóm:
1. Định dạng (${queryKw} shorts, ${queryKw} compilation, ${queryKw} animation...)
2. Khán giả (${queryKw} for kids, ${queryKw} for beginners...)
3. Chủ đề kết hợp (${queryKw} reaction, ${queryKw} funny moments...)
4. Giải pháp thực tế (${queryKw} tutorial, ${queryKw} full process...)
Trả về DUY NHẤT định dạng JSON: {"keywords": ["ngách 1", "ngách 2", ..., "ngách 20"]}`;

            const geminiRes = await callGeminiApi(aiPrompt, 'niches');
            let textObj = geminiRes.candidates?.[0]?.content?.parts?.[0]?.text || "";
            textObj = textObj.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(textObj);
            
            if (parsed.keywords && Array.isArray(parsed.keywords) && parsed.keywords.length >= 20) {
              final20Keywords = parsed.keywords.slice(0, 20).map(kw => {
                if (!kw.toLowerCase().includes(queryKw.toLowerCase())) {
                  return `${queryKw} ${kw}`;
                }
                return kw;
              });
            } else {
              throw new Error("Gemini AI không đủ 20 từ khóa");
            }
          } catch (e) {
            console.warn("Dự phòng thuật toán Neo Từ Khóa Gốc kích hoạt", e);
            final20Keywords = generateAnchorProtectedFallbackKeywords(queryKw);
          }

          const suggestedTableData = final20Keywords.map((kwItem, index) => ({
            id: index + 1,
            keyword: kwItem,
            comp: index === 0 ? 'Trung bình' : (index % 3 === 0 ? 'Thấp' : 'Trung bình'),
            compScore: index === 0 ? '10/10' : `${(9.8 - (index * 0.15)).toFixed(1)}/10`
          }));
          setAiKeywords(suggestedTableData);

          const targetLimit = autoRotateKw ? 10 : maxResults;
          const searchKeywordsToUse = autoRotateKw ? final20Keywords : [queryKw];

          for (let i = 0; i < searchKeywordsToUse.length; i++) {
            if (collectedChannels.length >= targetLimit) break;
            const activeKw = searchKeywordsToUse[i];

            const searchRes = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(activeKw)}${regionQuery}&maxResults=25${timeQuery}`);
            unitsUsedThisSearch += 100;

            if (searchRes.items && searchRes.items.length > 0) {
              const channelVideoMap = {};
              searchRes.items.forEach(item => {
                if (item.snippet?.channelId) {
                  const chId = item.snippet.channelId;
                  if (!channelVideoMap[chId]) {
                    channelVideoMap[chId] = {
                      videoTitle: item.snippet.title,
                      matchedKw: activeKw
                    };
                  }
                }
              });

              const chIds = Object.keys(channelVideoMap).join(',');

              if (chIds) {
                const channelData = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,topicDetails&id=${chIds}`);
                unitsUsedThisSearch += 1;

                if (channelData.items) {
                  const formatted = channelData.items.map(ch => {
                    const subs = parseInt(ch.statistics.subscriberCount || 0);
                    const views = parseInt(ch.statistics.viewCount || 0);
                    const videos = parseInt(ch.statistics.videoCount || 0);
                    const age = calculateAgeDays(ch.snippet.publishedAt);
                    const topicCat = parseTopicCategory(ch.topicDetails?.topicCategories);
                    
                    const countryCode = ch.snippet.country || (region !== 'GLOBAL' ? region : 'VN');
                    const countryName = COUNTRY_NAME_MAP[countryCode] || countryCode;

                    const videoInfo = channelVideoMap[ch.id];
                    const subNicheTitle = videoInfo 
                      ? extractSubNicheFromTitle(videoInfo.videoTitle, videoInfo.matchedKw)
                      : queryKw;

                    const lowEst = Math.floor((views / 1000) * 0.2);
                    const highEst = Math.floor((views / 1000) * 1.5);
                    const incomeStr = `$${formatLocale(lowEst)} - $${formatLocale(highEst)}`;
                    const dynamicScore = calculateOutlierScore(views, subs, videos, age);

                    return {
                      id: ch.id,
                      name: ch.snippet.title,
                      handle: ch.snippet.customUrl || `@${ch.id.substring(0,8)}`,
                      kw: subNicheTitle,
                      topic: topicCat,
                      income: incomeStr,
                      url: `youtube.com/channel/${ch.id}`,
                      country: countryName,
                      date: new Date(ch.snippet.publishedAt).toISOString().split('T')[0],
                      age: age,
                      sub: formatLocale(subs),
                      views: formatLocale(views),
                      videos: formatLocale(videos),
                      score: dynamicScore,
                      rawSubs: subs,
                      rawViews: views,
                      rawVideos: videos,
                      thumbnail: ch.snippet.thumbnails.default.url
                    };
                  });

                  const filteredBatch = formatted.filter(c => {
                    if (isHuntSmall) {
                       return c.rawSubs <= 50000 && (c.age <= 30 || (c.rawViews / Math.max(1, c.rawSubs)) >= 5) && c.rawViews >= minViews;
                    }
                    if (isOutlierScoreRank) {
                       return c.rawSubs >= minSubs && c.rawSubs <= maxSubs && c.rawViews >= minViews;
                    }
                    return c.rawSubs >= minSubs && c.rawSubs <= maxSubs && c.rawVideos >= minVideos && c.rawVideos <= maxVideos && c.rawViews >= minViews;
                  });

                  for (let bc of filteredBatch) {
                    if (!collectedChannels.some(existing => existing.id === bc.id)) {
                      collectedChannels.push(bc);
                      if (collectedChannels.length >= targetLimit) break;
                    }
                  }
                }
              }
            }
            if (!autoRotateKw) break;
          }

          collectedChannels.sort((a, b) => {
            const ratioA = a.rawViews / (a.rawSubs || 1);
            const ratioB = b.rawViews / (b.rawSubs || 1);
            if (isHuntSmall) {
              return (ratioB * parseFloat(b.score)) - (ratioA * parseFloat(a.score));
            }
            if (isOutlierScoreRank) {
              return parseFloat(b.score) - parseFloat(a.score);
            }
            return parseFloat(b.score) - parseFloat(a.score);
          });

          addQuotaUnits(unitsUsedThisSearch);
          setChannels(collectedChannels);

          if (collectedChannels.length > 0) {

      return (

                  <input type="text" value={keyword} onChange={(e)=>setKeyword(e.target.value)} placeholder="Ví dụ: Tạo video AI..." className="w-36 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 font-medium placeholder-gray-400 placeholder:italic text-gray-800" />
                </div>

                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-24">Đăng trong:</label><select value={timeRange} onChange={(e)=>setTimeRange(e.target.value)} className="w-36 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 bg-white"><option value="all">Toàn thời gian</option><option value="today">Hôm nay</option><option value="week">Tuần này</option><option value="month">Tháng này</option><option value="year">Năm nay</option></select></div>
              </div>

              <div className="md:col-span-3 space-y-2.5">

                  <FormattedNumberInput value={minSubs} onChange={setMinSubs} className="w-28 border border-gray-300 rounded px-2.5 py-1 text-sm focus:outline-none focus:border-blue-500 font-medium text-right" />

    };

    const TabSpyChannel = ({ showToast, callYouTubeApi, externalChannelId, onAnalyzeVideo }) => {
      const [channelIdInput, setChannelIdInput] = useState(externalChannelId || '');
      const [channelData, setChannelData] = useState(() => { const saved = localStorage.getItem('spy_channelData'); return saved ? JSON.parse(saved) : null; });
      const [videosData, setVideosData] = useState(() => { const saved = localStorage.getItem('spy_videosData'); return saved ? JSON.parse(saved) : []; });
      const [isLoading, setIsLoading] = useState(false);
      const [selectedVideoDetail, setSelectedVideoDetail] = useState(null);

      useEffect(() => {
        localStorage.setItem('spy_channelData', JSON.stringify(channelData));
        localStorage.setItem('spy_videosData', JSON.stringify(videosData));
      }, [channelData, videosData]);

      useEffect(() => { if (externalChannelId) { setChannelIdInput(externalChannelId); handleAnalyzeSpy(externalChannelId); } }, [externalChannelId]);

      const handleAnalyzeSpy = async (targetId) => {
        const inputVal = targetId || channelIdInput;
        if (!inputVal.trim()) return showToast('Vui lòng nhập Channel ID hoặc Link!', 'error');
        setIsLoading(true);
        let finalId = inputVal.trim();
        if (finalId.includes('youtube.com/')) {
            if (finalId.includes('/channel/')) finalId = finalId.split('/channel/')[1].split('/')[0].split('?')[0];
            else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0].split('?')[0];
        }

        try {
          let urlPath = finalId.startsWith('@') 
            ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&forHandle=${encodeURIComponent(finalId)}`
            : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=${finalId}`;
          
          const channelJson = await callYouTubeApi(urlPath);

          if (channelJson.items && channelJson.items.length > 0) {
            const channel = channelJson.items[0];
            const age = calculateAgeDays(channel.snippet.publishedAt);
            const views = Number(channel.statistics.viewCount || 0);
            setChannelData({
              id: channel.id, title: channel.snippet.title, thumbnail: channel.snippet.thumbnails.high?.url || channel.snippet.thumbnails.default?.url, country: channel.snippet.country || 'N/A', customUrl: channel.snippet.customUrl || `@${channel.id.substring(0,8)}`, publishedAt: new Date(channel.snippet.publishedAt).toLocaleDateString('vi-VN'), ageDays: age, subscriberCount: formatLocale(channel.statistics.subscriberCount), viewCount: formatLocale(views), videoCount: formatLocale(channel.statistics.videoCount), viewPerDay: formatLocale(Math.round(views / age))
            });
            const uploadsId = channel.contentDetails?.relatedPlaylists?.uploads;
            if (uploadsId) {
                const plistJson = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=10`);
                if (plistJson.items) {
                    const vidIds = plistJson.items.map(item => item.snippet.resourceId.videoId).join(',');
                    const vJson = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${vidIds}`);
                    const formattedVids = vJson.items.map(v => {
                      const vph = calculateVPH(v.statistics.viewCount, v.snippet.publishedAt);
                      const desc = v.snippet.description || '';
                      return { id: v.id, thumb: v.snippet.thumbnails.medium?.url || v.snippet.thumbnails.default?.url, title: v.snippet.title, description: desc, tags: v.snippet.tags || [], hashtags: desc.match(/#[^\s#<>]+/g) || [], date: new Date(v.snippet.publishedAt).toLocaleString('vi-VN'), views: formatLocale(v.statistics.viewCount), vph: `+${formatLocale(vph)} VPH`, outlier: `${calculateTrendScore(vph)}/100` }
                    });
                    setVideosData(formattedVids);
                    if (formattedVids.length > 0) setSelectedVideoDetail(formattedVids[0]);
                }
            }
            showToast('Tải dữ liệu Kênh thành công!', 'success');
          } else throw new Error('Không tìm thấy kênh!');
        } catch (err) { showToast(err.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen overflow-y-auto custom-scrollbar">

             <button onClick={() => handleAnalyzeSpy()} disabled={isLoading} className="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow flex items-center text-sm disabled:opacity-50">{isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <BarChart2 className="w-4 h-4 mr-2" />}PHÂN TÍCH SPY</button>
          </div>
          {channelData && (
            <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm flex gap-6 animate-fade-in">
               <div className="w-32 flex flex-col items-center flex-shrink-0"><img src={channelData.thumbnail} className="w-24 h-24 rounded-full shadow-sm mb-2 object-cover" /><div className="font-bold text-gray-800 text-sm text-center">{channelData.title}</div><a href={`https://youtube.com/channel/${channelData.id}`} target="_blank" rel="noreferrer" className="text-blue-500 text-[10px] hover:underline mt-1">Xem kênh 👉</a></div>
               <div className="flex-1 text-xs text-gray-700 space-y-2">
                  <div><span className="font-bold text-blue-800">Quốc gia:</span> {channelData.country} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Tuổi kênh:</span> {formatLocale(channelData.ageDays)} ngày</div>
                  <div><span className="font-bold text-blue-800">Đăng ký:</span> {channelData.subscriberCount} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Lượt xem:</span> {channelData.viewCount} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Video:</span> {channelData.videoCount}</div>
                  <div><span className="font-bold text-blue-800">View/ngày (TB):</span> {channelData.viewPerDay}</div>
               </div>
            </div>
          )}
          {videosData.length > 0 && (
            <div className="space-y-4 animate-fade-in">
              <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                 <div className="bg-[#334155] text-white px-3 py-2 flex"><h3 className="text-xs font-bold flex items-center"><Play className="w-4 h-4 mr-2"/> Video mới nhất từ kênh</h3></div>
                 <div className="overflow-x-auto">
                   <table className="w-full text-left text-xs whitespace-nowrap">
                     <thead className="bg-gray-100 border-b border-gray-200 font-bold"><tr><th className="px-2 py-3 text-center">THUMB</th><th className="px-2 py-3 text-center">XEM CT</th><th className="px-2 py-3 max-w-[250px]">TIÊU ĐỀ</th><th className="px-2 py-3 text-right">VIEWS</th><th className="px-2 py-3 text-center">VPH</th><th className="px-2 py-3 text-center">TREND SCORE</th></tr></thead>
                     <tbody className="divide-y divide-gray-200">
                       {videosData.map((item, idx) => (
                         <tr key={idx} onClick={() => setSelectedVideoDetail(item)} className={`cursor-pointer hover:bg-blue-50 ${selectedVideoDetail?.id === item.id ? 'bg-blue-50 border-l-4 border-blue-500' : ''}`}><td className="px-2 py-2 text-center"><img src={item.thumb} className="w-16 h-9 object-cover rounded mx-auto" /></td><td className="px-2 py-2 text-center"><button onClick={(e) => { e.stopPropagation(); onAnalyzeVideo(item.id); }} className="bg-orange-500 text-white text-[9px] font-bold px-2 py-1 rounded">CHECK</button></td><td className="px-2 py-2 text-blue-700 font-bold max-w-[250px] overflow-hidden text-ellipsis text-[9px]">{item.title}</td><td className="px-2 py-2 text-right font-bold text-gray-700">{item.views}</td><td className="px-2 py-2 text-center font-bold text-blue-600">{item.vph}</td><td className="px-2 py-2 text-center font-bold text-green-500">{item.outlier}</td></tr>
                       ))}
                     </tbody>
                   </table>
                 </div>
              </div>
              {selectedVideoDetail && (
                <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm space-y-4">
                  <div className="border-b border-gray-100 pb-3 flex justify-between"><h4 className="font-bold text-gray-800 text-sm flex items-center"><FileText className="w-4 h-4 mr-2 text-blue-600"/> PHÂN TÍCH SEO CHI TIẾT VIDEO: <span className="text-blue-600 ml-1">{selectedVideoDetail.title}</span></h4><button onClick={() => { fallbackCopyTextToClipboard(`Tiêu đề: ${selectedVideoDetail.title}\nMô tả:\n${selectedVideoDetail.description}\nTags:\n${selectedVideoDetail.tags.join(', ')}`); showToast('Đã sao chép!', 'success'); }} className="bg-gray-100 text-gray-700 font-bold px-3 py-1.5 rounded text-xs flex items-center"><Copy className="w-3.5 h-3.5 mr-1"/> SAO CHÉP TẤT CẢ</button></div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-gray-50 p-3.5 rounded-lg border border-gray-200"><span className="text-xs font-bold mb-2 flex items-center"><FileText className="w-3.5 h-3.5 mr-1.5 text-blue-500"/> MÔ TẢ</span><div className="bg-white p-3 border rounded text-xs h-40 overflow-y-auto whitespace-pre-wrap font-mono custom-scrollbar">{selectedVideoDetail.description}</div></div>
                    <div className="space-y-4">
                      <div className="bg-gray-50 p-3.5 rounded-lg border"><span className="text-xs font-bold mb-2 flex items-center"><Hash className="w-3.5 h-3.5 mr-1.5 text-orange-500"/> HASHTAGS</span><div className="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto">{selectedVideoDetail.hashtags.map((tag, idx) => (<span key={idx} className="bg-orange-50 text-orange-700 border border-orange-200 px-2 py-0.5 rounded text-[10px] font-semibold">{tag}</span>))}</div></div>
                      <div className="bg-gray-50 p-3.5 rounded-lg border"><span className="text-xs font-bold mb-2 flex items-center"><Tag className="w-3.5 h-3.5 mr-1.5 text-purple-500"/> VIDEO TAGS</span><div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scrollbar">{selectedVideoDetail.tags.map((tag, idx) => (<span key={idx} className="bg-purple-50 text-purple-700 border border-purple-200 px-2 py-0.5 rounded text-[10px] font-semibold">{tag}</span>))}</div></div>

    const TabCompareChannels = ({ showToast, callYouTubeApi }) => {
      const [input1, setInput1] = useState(() => localStorage.getItem('compare_input1') || '');
      const [input2, setInput2] = useState(() => localStorage.getItem('compare_input2') || '');
      const [isLoading, setIsLoading] = useState(false);
      const [comparedData, setComparedData] = useState(() => { const saved = localStorage.getItem('compare_data'); return saved ? JSON.parse(saved) : []; });

      useEffect(() => {
        localStorage.setItem('compare_input1', input1);
        localStorage.setItem('compare_input2', input2);
        localStorage.setItem('compare_data', JSON.stringify(comparedData));
      }, [input1, input2, comparedData]);

      const handleCompare = async () => {
        if (!input1.trim() || !input2.trim()) return showToast('Vui lòng nhập ít nhất 2 Channel ID / Handle!', 'error');
        setIsLoading(true);

        const inputs = [input1.trim(), input2.trim()].filter(Boolean);
        const results = [];

        try {
          for (let val of inputs) {
            let finalId = val;
            if (finalId.includes('youtube.com/')) {
              if (finalId.includes('/channel/')) finalId = finalId.split('/channel/')[1].split('/')[0];
              else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0];
            }

            const fetchUrl = finalId.startsWith('@') 
              ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${encodeURIComponent(finalId)}`
              : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${finalId}`;

            const data = await callYouTubeApi(fetchUrl);
            if (data.items && data.items.length > 0) {
              const ch = data.items[0];
              const subs = parseInt(ch.statistics.subscriberCount || 0);
              const views = parseInt(ch.statistics.viewCount || 0);
              const vids = parseInt(ch.statistics.videoCount || 0);
              const age = calculateAgeDays(ch.snippet.publishedAt);
              const viewPerDay = Math.round(views / age);

              results.push({
                id: ch.id,
                title: ch.snippet.title,
                thumb: ch.snippet.thumbnails.medium?.url || ch.snippet.thumbnails.default?.url,
                subsStr: formatLocale(subs),
                viewsStr: formatLocale(views),
                vidsStr: formatLocale(vids),
                age: age,
                viewPerDayStr: formatLocale(viewPerDay),
                viralRatio: (views / Math.max(1, subs)).toFixed(1),
                score: calculateOutlierScore(views, subs, vids, age)
              });
            }
          }

          setComparedData(results);
          if (results.length > 0) showToast('So sánh dữ liệu đối thủ thành công!', 'success');
          else showToast('Không tìm thấy dữ liệu kênh!', 'error');
        } catch (err) { showToast(err.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen overflow-y-auto custom-scrollbar animate-fade-in">
          <div className="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
            <h2 className="text-sm font-extrabold text-gray-800 mb-3 flex items-center">
              <GitCompare className="w-5 h-5 mr-2 text-indigo-600" /> 
              SO SÁNH ĐỐI THỦ SIDE-BY-SIDE (MA TRẬN CẠNH TRANH REAL-TIME)
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <input type="text" value={input1} onChange={(e)=>setInput1(e.target.value)} placeholder="Nhập Kênh 1 (ID hoặc @handle)..." className="border border-gray-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 font-medium" />
              <input type="text" value={input2} onChange={(e)=>setInput2(e.target.value)} placeholder="Nhập Kênh 2 (ID hoặc @handle)..." className="border border-gray-300 rounded px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 font-medium" />
            </div>
            <button onClick={handleCompare} disabled={isLoading} className="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-2 rounded text-xs shadow flex items-center justify-center disabled:opacity-50">
              {isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin"/> : <GitCompare className="w-4 h-4 mr-2"/>}
              SO SÁNH NGAY
            </button>
          </div>

          {comparedData.length > 0 && (
            <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm overflow-x-auto animate-fade-in">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-gray-200 bg-gray-50">
                    <th className="p-3 font-bold text-gray-500 uppercase">CHỈ SỐ SO SÁNH</th>
                    {comparedData.map(ch => (
                      <th key={ch.id} className="p-3 text-center">
                        <img src={ch.thumb} className="w-12 h-12 rounded-full mx-auto mb-1.5 shadow border" />
                        <div className="font-extrabold text-gray-900 text-sm">{ch.title}</div>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100 font-medium">
                  <tr>
                    <td className="p-3 font-bold text-gray-700">Lượt đăng ký (Subscribers)</td>
                    {comparedData.map(ch => <td key={ch.id} className="p-3 text-center font-black text-gray-800 text-sm">{ch.subsStr}</td>)}
                  </tr>
                  <tr>
                    <td className="p-3 font-bold text-gray-700">Tổng lượt xem (Total Views)</td>
                    {comparedData.map(ch => <td key={ch.id} className="p-3 text-center font-black text-blue-600 text-sm">{ch.viewsStr}</td>)}
                  </tr>
                  <tr>
                    <td className="p-3 font-bold text-gray-700">Tốc độ Views/Ngày (Avg Views/Day)</td>
                    {comparedData.map(ch => <td key={ch.id} className="p-3 text-center font-bold text-green-600">{ch.viewPerDayStr}</td>)}
                  </tr>
                  <tr>
                    <td className="p-3 font-bold text-gray-700">Tỷ lệ Viral (Views / Subs)</td>
                    {comparedData.map(ch => <td key={ch.id} className="p-3 text-center font-bold text-orange-600">{ch.viralRatio}x</td>)}
                  </tr>
                  <tr>
                    <td className="p-3 font-bold text-gray-700">Tổng số Video đã đăng</td>
                    {comparedData.map(ch => <td key={ch.id} className="p-3 text-center font-bold text-gray-700">{ch.vidsStr}</td>)}
                  </tr>
                  <tr>
                    <td className="p-3 font-bold text-gray-700">Tuổi kênh (Số ngày)</td>
                    {comparedData.map(ch => <td key={ch.id} className="p-3 text-center text-gray-600">{ch.age} ngày</td>)}
                  </tr>
                  <tr>
                    <td className="p-3 font-bold text-gray-700">Điểm sức mạnh kênh (Outlier Score)</td>
                    {comparedData.map(ch => <td key={ch.id} className="p-3 text-center"><span className="bg-yellow-100 text-yellow-800 font-black px-2.5 py-1 rounded border border-yellow-300">{ch.score}/10</span></td>)}
                  </tr>
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    };

    const TabTrending = ({ showToast, callYouTubeApi, onSpyChannel, onCheckVideo }) => {
      const [region, setRegion] = useState(() => localStorage.getItem('trend_region') || 'US');
      const [categoryId, setCategoryId] = useState(() => localStorage.getItem('trend_cat') || '0');
      const [videoTypeFilter, setVideoTypeFilter] = useState(() => localStorage.getItem('trend_type') || 'all');
      const [isLoading, setIsLoading] = useState(false);
      const [trendingVideos, setTrendingVideos] = useState(() => { const saved = localStorage.getItem('trend_vids'); return saved ? JSON.parse(saved) : []; });
      const [statusMsg, setStatusMsg] = useState('');

      useEffect(() => {
        localStorage.setItem('trend_region', region);
        localStorage.setItem('trend_cat', categoryId);
        localStorage.setItem('trend_type', videoTypeFilter);
        localStorage.setItem('trend_vids', JSON.stringify(trendingVideos));
      }, [region, categoryId, videoTypeFilter, trendingVideos]);

      const handleFetchTrending = async () => {
        setIsLoading(true);
        setStatusMsg(`Đang quét dữ liệu REAL-TIME Top Trend YouTube khu vực ${region}...`);
        try {
          let catParam = categoryId !== '0' ? `&videoCategoryId=${categoryId}` : '';
          const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&chart=mostPopular&regionCode=${region}&maxResults=30${catParam}`;
          
          const data = await callYouTubeApi(url);

          if (data.items && data.items.length > 0) {
            const formatted = data.items.map(v => {
              const views = parseInt(v.statistics?.viewCount || 0);
              const likes = parseInt(v.statistics?.likeCount || 0);
              const comments = parseInt(v.statistics?.commentCount || 0);
              const vph = calculateVPH(views, v.snippet.publishedAt);
              const durationStr = parseIsoDuration(v.contentDetails?.duration);
              const isShort = isShortsDuration(v.contentDetails?.duration);

              return {
                id: v.id,
                channelId: v.snippet.channelId,
                channelTitle: v.snippet.channelTitle,
                title: v.snippet.title,
                thumb: v.snippet.thumbnails.high?.url || v.snippet.thumbnails.medium?.url,
                views: formatLocale(views),
                likes: formatLocale(likes),
                comments: formatLocale(comments),
                vphStr: `+${formatLocale(vph)} VPH`,
                trendScore: calculateTrendScore(vph),
                duration: durationStr,
                isShort: isShort,
                publishedAt: new Date(v.snippet.publishedAt).toLocaleDateString('vi-VN'),
              };
            });

            setTrendingVideos(formatted);
            const msg = `🔥 Quét thành công ${formatted.length} Video đang Top Trend REAL-TIME tại ${region}!`;
            setStatusMsg(msg);
            showToast(msg, 'success');
          } else {
            setTrendingVideos([]);
            showToast('Không tìm thấy danh sách video trend cho cài đặt này', 'warning');
          }
        } catch (err) {
          showToast(err.message, 'error');
          setStatusMsg(`Lỗi: ${err.message}`);
        }
        setIsLoading(false);
      };

      const filteredVideos = trendingVideos.filter(v => {
        if (videoTypeFilter === 'shorts') return v.isShort;
        if (videoTypeFilter === 'long') return !v.isShort;
        return true;
      });

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen overflow-y-auto custom-scrollbar animate-fade-in">
          <div className="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
              <div>
                <h2 className="text-sm font-extrabold text-gray-800 flex items-center">
                  <Flame className="w-5 h-5 mr-2 text-red-500 fill-current animate-bounce" /> 
                  SĂN TREND YOUTUBE HOT NHẤT REAL-TIME (DỮ LIỆU THẬT 100%)
                </h2>
                <p className="text-xs text-gray-500 mt-0.5">Bắt trọn dòng chảy xu hướng theo Quốc Gia & Danh Mục thực tế từ thuật toán YouTube.</p>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1">
                  <label className="text-xs font-bold text-gray-700">Quốc Gia:</label>
                  <select value={region} onChange={(e)=>setRegion(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-bold bg-white focus:outline-none focus:border-red-500">
                    {COUNTRIES_LIST.filter(c => c.code !== 'GLOBAL').map(c => <option key={c.code} value={c.code}>{c.name}</option>)}
                  </select>
                </div>

                <div className="flex items-center gap-1">
                  <label className="text-xs font-bold text-gray-700">Danh Mục:</label>
                  <select value={categoryId} onChange={(e)=>setCategoryId(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-bold bg-white focus:outline-none focus:border-red-500">
                    {YOUTUBE_CATEGORIES.map(cat => <option key={cat.id} value={cat.id}>{cat.name}</option>)}
                  </select>
                </div>

                <div className="flex items-center gap-1">
                  <label className="text-xs font-bold text-gray-700">Loại Video:</label>
                  <select value={videoTypeFilter} onChange={(e)=>setVideoTypeFilter(e.target.value)} className="border border-gray-300 rounded px-2.5 py-1.5 text-xs font-bold bg-white focus:outline-none focus:border-red-500">
                    <option value="all">Tất cả video</option>
                    <option value="long">📺 Video Dài (&gt;1p)</option>
                    <option value="shorts">⚡ Shorts (≤60s)</option>
                  </select>
                </div>

                <button onClick={handleFetchTrending} disabled={isLoading} className="bg-red-600 hover:bg-red-700 text-white font-extrabold px-4 py-1.5 rounded text-xs flex items-center shadow transition-colors disabled:opacity-50">
                  {isLoading ? <RefreshCw className="w-3.5 h-3.5 mr-1.5 animate-spin"/> : <Flame className="w-3.5 h-3.5 mr-1.5"/>}
                  QUÉT HOT TREND
                </button>
              </div>
            </div>
          </div>

          <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
            <div className="bg-[#0f172a] text-white px-3 py-2 flex justify-between items-center text-xs">
              <span className="font-bold flex items-center"><List className="w-4 h-4 mr-2 text-red-400"/> TOP VIDEO ĐANG LÊN TREND ({filteredVideos.length})</span>
              <span className="text-[11px] text-slate-300">{statusMsg}</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs whitespace-nowrap">
                <thead className="bg-gray-100 border-b border-gray-200 font-bold text-gray-700">
                  <tr>
                    <th className="px-2 py-2.5 text-center">STT</th>
                    <th className="px-2 py-2.5 text-center">THUMB</th>
                    <th className="px-2 py-2.5 max-w-[280px]">TIÊU ĐỀ VIDEO TREND</th>
                    <th className="px-2 py-2.5">KÊNH YOUTUBE</th>
                    <th className="px-2 py-2.5 text-center">LOẠI</th>
                    <th className="px-2 py-2.5 text-right">LƯỢT XEM</th>
                    <th className="px-2 py-2.5 text-center">TỐC ĐỘ (VPH)</th>
                    <th className="px-2 py-2.5 text-center">TREND SCORE</th>
                    <th className="px-2 py-2.5 text-center">ĐĂNG NGÀY</th>
                    <th className="px-2 py-2.5 text-center">THAO TÁC</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-200">
                  {filteredVideos.map((v, idx) => (
                    <tr key={v.id} className="hover:bg-red-50/40 transition-colors">
                      <td className="px-2 py-2 text-center text-gray-500 font-semibold">{idx + 1}</td>
                      <td className="px-2 py-2 text-center">
                        <div className="relative inline-block">
                          <img src={v.thumb} className="w-16 h-9 object-cover rounded shadow-sm" />
                          <span className="absolute bottom-0.5 right-0.5 bg-black/80 text-white text-[9px] px-1 rounded font-mono">{v.duration}</span>
                        </div>
                      </td>
                      <td className="px-2 py-2 max-w-[280px]">
                        <div className="font-bold text-gray-900 truncate hover:text-red-600" title={v.title}>
                          <a href={`https://youtube.com/watch?v=${v.id}`} target="_blank" rel="noreferrer">{v.title}</a>
                        </div>
                        <div className="text-[10px] text-gray-500 flex items-center gap-2 mt-0.5">
                          <span>👍 {v.likes} likes</span>
                          <span>💬 {v.comments} cmt</span>
                        </div>
                      </td>
                      <td className="px-2 py-2 font-bold text-blue-700">{v.channelTitle}</td>
                      <td className="px-2 py-2 text-center">
                        {v.isShort ? <span className="bg-red-100 text-red-700 font-extrabold px-1.5 py-0.5 rounded text-[9px]">SHORTS</span> : <span className="bg-blue-100 text-blue-700 font-bold px-1.5 py-0.5 rounded text-[9px]">VIDEO DÀI</span>}
                      </td>
                      <td className="px-2 py-2 text-right font-black text-gray-800">{v.views}</td>
                      <td className="px-2 py-2 text-center font-bold text-orange-600">{v.vphStr}</td>

                        <span className="bg-red-100 text-red-800 font-black px-2 py-0.5 rounded border border-red-200">{v.trendScore}/100</span>

                      </td>

                  )}

              </table>
            </div>
          </div>
        </div>
      );
    };

    const TabCheckVideo = ({ showToast, callYouTubeApi, initialVideoId }) => {
      const [inputValue, setInputValue] = useState(initialVideoId || '');
      const [videoData, setVideoData] = useState(() => { const saved = localStorage.getItem('check_videoData'); return saved ? JSON.parse(saved) : null; });
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => { localStorage.setItem('check_videoData', JSON.stringify(videoData)); }, [videoData]);
      useEffect(() => { if (initialVideoId) { setInputValue(initialVideoId); handleCheckVideo(initialVideoId); } }, [initialVideoId]);

      const handleCheckVideo = async (targetId) => {
        const val = targetId || inputValue;
        if (!val) return showToast('Vui lòng nhập Video ID hoặc Link!', 'error');
        let finalVideoId = val.trim();
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/)([^"&?\/\s]{11})/i;
        const match = finalVideoId.match(regex);
        if (match && match[1]) finalVideoId = match[1];

        setIsLoading(true);
        try {
           const data = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${finalVideoId}`);
           if (data.items && data.items.length > 0) {
               const video = data.items[0];
               const vph = calculateVPH(video.statistics.viewCount, video.snippet.publishedAt);
               setVideoData({ id: finalVideoId, title: video.snippet.title, thumbnail: video.snippet.thumbnails.maxres?.url || video.snippet.thumbnails.high?.url, views: formatLocale(video.statistics.viewCount), likes: formatLocale(video.statistics.likeCount || 0), comments: formatLocale(video.statistics.commentCount || 0), duration: video.contentDetails.duration.replace('PT','').replace('H','h ').replace('M','m ').replace('S','s').toLowerCase(), vph: formatLocale(vph), trendScore: `${calculateTrendScore(vph)}/100`, channelName: video.snippet.channelTitle, desc: video.snippet.description || '', tags: video.snippet.tags || [], hashtags: (video.snippet.description || '').match(/#[^\s#<>]+/g) || [] });
               showToast('Lấy dữ liệu video thành công!', 'success');
           } else showToast('Không tìm thấy video này!', 'error');
        } catch (error) { showToast(error.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen overflow-y-auto custom-scrollbar">
           <div className="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex items-center gap-3">
             <div className="flex-1 relative"><Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4" /><input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="Nhập ID Video hoặc dán Link Video YouTube..." className="w-full border border-gray-300 rounded-md pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 font-medium" /></div>
             <button onClick={() => handleCheckVideo()} disabled={isLoading} className="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 px-6 rounded-md shadow flex items-center text-sm disabled:opacity-50">{isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <Video className="w-4 h-4 mr-2" />}KIỂM TRA VIDEO</button>
           </div>
           {videoData && (
             <div className="space-y-4 animate-fade-in">
               <div className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                 <div className="flex justify-between items-start mb-4">
                    <div><div className="text-xs text-blue-600 font-bold mb-1 tracking-wider">TỪ TIÊU ĐỀ VIDEO</div><h2 className="text-xl font-bold text-gray-800">{videoData.title}</h2></div>
                    <a href={`https://youtube.com/watch?v=${videoData.id}`} target="_blank" rel="noreferrer" className="bg-red-600 text-white font-bold py-2 px-6 rounded shadow flex items-center text-sm whitespace-nowrap"><Play className="w-4 h-4 mr-2 fill-current" /> XEM VIDEO</a>
                 </div>
                 <div className="grid grid-cols-12 gap-6">
                    <div className="col-span-12 md:col-span-5 rounded-xl overflow-hidden bg-gray-900 shadow-inner flex items-center"><img src={videoData.thumbnail} className="w-full h-auto object-cover" /></div>
                    <div className="col-span-12 md:col-span-7 grid grid-cols-2 md:grid-cols-3 gap-4">

                         <div key={i} className="bg-gray-50 border border-gray-100 rounded-xl p-4 flex flex-col justify-between shadow-sm"><div className="flex items-center mb-3"><div className="p-1.5 rounded-md bg-white border border-gray-100 shadow-sm mr-2"><stat.icon className={`w-4 h-4 ${stat.color}`} /></div><span className="text-[10px] font-bold text-gray-500">{stat.label}</span></div><div className="text-xl font-black text-gray-800">{stat.val}</div></div>

                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                      <div className="flex justify-between items-center mb-2">
                        <h4 className="font-bold text-gray-800 text-xs flex items-center"><FileText className="w-4 h-4 mr-1.5 text-blue-600"/> MÔ TẢ CHI TIẾT VIDEO</h4>
                        <button onClick={() => { fallbackCopyTextToClipboard(videoData.desc || ''); showToast('Đã sao chép Mô Tả!', 'success'); }} className="text-gray-600 hover:text-blue-600 bg-white border border-gray-200 hover:border-blue-300 px-2.5 py-1 rounded text-[10px] font-bold flex items-center transition-colors shadow-sm">
                          <Copy className="w-3 h-3 mr-1 text-blue-500"/> Copy Mô Tả
                        </button>
                      </div>
                      <div className="bg-white p-3 rounded border text-xs h-44 overflow-y-auto font-mono custom-scrollbar whitespace-pre-wrap">{videoData.desc || 'Không có mô tả.'}</div>
                    </div>
                    <div className="space-y-4">
                      <div className="bg-gray-50 p-4 rounded-xl border">
                        <div className="flex justify-between items-center mb-2">
                          <h4 className="font-bold text-gray-800 text-xs flex items-center"><Hash className="w-4 h-4 mr-1.5 text-orange-500"/> HASHTAGS</h4>
                          {videoData.hashtags && videoData.hashtags.length > 0 && (
                            <button onClick={() => { fallbackCopyTextToClipboard(videoData.hashtags.join(' ')); showToast('Đã sao chép Hashtags!', 'success'); }} className="text-gray-600 hover:text-orange-600 bg-white border border-gray-200 hover:border-orange-300 px-2.5 py-1 rounded text-[10px] font-bold flex items-center transition-colors shadow-sm">
                              <Copy className="w-3 h-3 mr-1 text-orange-500"/> Copy Hashtags
                            </button>
                          )}
                        </div>
                        <div className="flex flex-wrap gap-1.5 max-h-16 overflow-y-auto">{videoData.hashtags.map((h, i) => <span key={i} className="bg-orange-50 text-orange-700 border px-2 py-0.5 rounded text-[10px] font-semibold">{h}</span>)}</div>
                      </div>
                      <div className="bg-gray-50 p-4 rounded-xl border">
                        <div className="flex justify-between items-center mb-2">
                          <h4 className="font-bold text-gray-800 text-xs flex items-center"><Tag className="w-4 h-4 mr-1.5 text-purple-500"/> TỪ KHÓA SEO (TAGS)</h4>
                          {videoData.tags && videoData.tags.length > 0 && (
                            <button onClick={() => { fallbackCopyTextToClipboard(videoData.tags.join(', ')); showToast('Đã sao chép Từ Khóa SEO!', 'success'); }} className="text-gray-600 hover:text-purple-600 bg-white border border-gray-200 hover:border-purple-300 px-2.5 py-1 rounded text-[10px] font-bold flex items-center transition-colors shadow-sm">
                              <Copy className="w-3 h-3 mr-1 text-purple-500"/> Copy Tags

                        <div className="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto custom-scrollbar">{videoData.tags.map((t, i) => <span key={i} className="bg-purple-50 text-purple-700 border px-2 py-0.5 rounded text-[10px] font-semibold">{t}</span>)}</div>

    };

    const TabTracking = ({ showToast, callYouTubeApi, onSpyChannel, externalTrackList, setExternalTrackList }) => {
      const [inputValue, setInputValue] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [isRefreshing, setIsRefreshing] = useState(false);

      const refreshAllChannels = async (notify = true) => {
        if (externalTrackList.length === 0) return;
        setIsRefreshing(true);
        try {
          const ids = externalTrackList.map(c => c.id).join(',');
          const data = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${ids}`);
          if (data.items) {
            setExternalTrackList(prev => prev.map(ch => {
              const updated = data.items.find(item => item.id === ch.id);
              if (updated) {
                const oldSub = parseInt((ch.sub || "0").replace(/\./g, ''));
                const newSub = parseInt(updated.statistics.subscriberCount || 0);
                const diff = newSub - oldSub;
                const growthStr = diff >= 0 ? `+${formatLocale(diff)}` : formatLocale(diff);
                return {
                  ...ch,
                  sub: formatLocale(newSub),
                  subGrowth: growthStr !== '+0' ? growthStr : ch.subGrowth,
                  views: formatLocale(updated.statistics.viewCount)
                };
              }
              return ch;
            }));
            if (notify) showToast('Đã tự động cập nhật số liệu thời gian thực!', 'success');
          }
        } catch (e) { console.error("Auto refresh failed:", e); }
        setIsRefreshing(false);
      };

      const handleTrackChannel = async () => {
        if (!inputValue.trim()) return showToast('Vui lòng nhập Link Kênh!', 'error');
        setIsLoading(true);
        let finalId = inputValue.trim();
        if (finalId.includes('youtube.com/')) {
            if (finalId.includes('/channel/')) finalId = finalId.split('/channel/')[1].split('/')[0].split('?')[0];
            else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0].split('?')[0];
        }

        try {
          const fetchUrl = finalId.startsWith('@') ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${encodeURIComponent(finalId)}` : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${finalId}`;
          const data = await callYouTubeApi(fetchUrl);
          if (data.items && data.items.length > 0) {
            const ch = data.items[0];
            if (externalTrackList.find(item => item.id === ch.id)) { setIsLoading(false); return showToast('Kênh này đã được theo dõi!', 'warning'); }
            setExternalTrackList(prev => [{ id: ch.id, name: ch.snippet.title, handle: ch.snippet.customUrl || `@${ch.id.substring(0,8)}`, sub: formatLocale(ch.statistics.subscriberCount), subGrowth: '+0', views: formatLocale(ch.statistics.viewCount), date: new Date().toLocaleDateString('vi-VN'), status: 'Đang theo dõi', thumbnail: ch.snippet.thumbnails.default?.url }, ...prev]);
            setInputValue(''); showToast('Đã thêm vào theo dõi!', 'success');
          } else throw new Error('Không tìm thấy kênh này!');
        } catch (err) { showToast(err.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen overflow-y-auto custom-scrollbar animate-fade-in">
          <div className="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex items-center gap-3">
             <div className="flex-1 relative"><Target className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4" /><input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="Nhập Channel ID hoặc URL Kênh..." className="w-full border border-gray-300 rounded-md pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 font-medium" /></div>
             <button onClick={handleTrackChannel} disabled={isLoading} className="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 px-6 rounded-md shadow flex items-center text-sm disabled:opacity-50">{isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <Target className="w-4 h-4 mr-2" />}BẮT ĐẦU THEO DÕI</button>
             <button onClick={() => refreshAllChannels(true)} disabled={isRefreshing} className="bg-blue-600 text-white font-bold py-2.5 px-4 rounded-md shadow flex items-center text-sm disabled:opacity-50" title="Cập nhật số liệu mới nhất">{isRefreshing ? <RefreshCw className="w-4 h-4 animate-spin" /> : <RefreshCw className="w-4 h-4" />}</button>
          </div>
          <div className="bg-white border rounded-lg shadow-sm overflow-hidden">
             <div className="bg-[#1e293b] text-white px-3 py-2 flex justify-between items-center"><h3 className="text-xs font-bold flex items-center"><List className="w-4 h-4 mr-2"/> ĐỐI THỦ ĐANG THEO DÕI (TỰ ĐỘNG LƯU & CẬP NHẬT)</h3><span className="bg-blue-600 text-[10px] px-2 py-0.5 rounded font-bold">TỔNG: {externalTrackList.length}</span></div>
             <div className="overflow-x-auto">
               <table className="w-full text-left text-xs whitespace-nowrap">
                 <thead className="bg-gray-100 border-b text-gray-700 font-bold"><tr><th className="px-2 py-3 text-center">STT</th><th className="px-2 py-3">KÊNH</th><th className="px-2 py-3 text-center">NGÀY BẮT ĐẦU</th><th className="px-2 py-3 text-center">SUB</th><th className="px-2 py-3 text-center">VIEWS</th><th className="px-2 py-3 text-center">THAO TÁC</th></tr></thead>
                 <tbody className="divide-y divide-gray-200">
                   {externalTrackList.map((item, idx) => (
                     <tr key={item.id} className="hover:bg-blue-50"><td className="px-2 py-3 text-center text-gray-500">{idx + 1}</td><td className="px-2 py-3 flex items-center gap-2"><img src={item.thumbnail} className="w-8 h-8 rounded-full shadow-sm"/><div><div className="font-bold">{item.name}</div><div className="text-gray-500 text-[10px]">{item.handle}</div></div></td><td className="px-2 py-3 text-center text-gray-600">{item.date}</td><td className="px-2 py-3 text-center font-bold text-gray-700">{item.sub} <span className="text-green-600 text-[10px]">({item.subGrowth})</span></td><td className="px-2 py-3 text-center font-bold text-blue-600">{item.views}</td><td className="px-2 py-3 text-center"><button onClick={() => onSpyChannel(item.id)} className="bg-blue-600 text-white text-[9px] font-bold px-3 py-1.5 rounded mr-1">SPY</button><button onClick={() => setExternalTrackList(prev => prev.filter(c => c.id !== item.id))} className="bg-red-500 text-white text-[9px] font-bold px-3 py-1.5 rounded"><Trash2 className="w-3 h-3"/></button></td></tr>
                   ))}
                   {externalTrackList.length === 0 && (<tr><td colSpan="6" className="text-center py-8 text-gray-500 italic">Chưa có kênh nào. Dán ID hoặc Link kênh đối thủ ở trên để bắt đầu theo dõi.</td></tr>)}
                 </tbody>
               </table>
             </div>
          </div>
        </div>
      );
    };

    const TabNicheResearch = ({ showToast, callYouTubeApi, onCheckVideo }) => {
      const [keyword, setKeyword] = useState(() => localStorage.getItem('niche_keyword') || '');
      const [region, setRegion] = useState(() => localStorage.getItem('niche_region') || 'VN');
      const [timeFilter, setTimeFilter] = useState(() => localStorage.getItem('niche_time') || 'month');
      const [maxResults, setMaxResults] = useState(20);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [nicheData, setNicheData] = useState(() => { const saved = localStorage.getItem('niche_data'); return saved ? JSON.parse(saved) : null; });

      useEffect(() => {
        localStorage.setItem('niche_keyword', keyword);
        localStorage.setItem('niche_region', region);
        localStorage.setItem('niche_time', timeFilter);
        localStorage.setItem('niche_data', JSON.stringify(nicheData));
      }, [keyword, region, timeFilter, nicheData]);

      const handleAnalyzeNiche = async () => {
        if (!keyword.trim()) return showToast('Vui lòng nhập từ khóa ngách!', 'error');
        setIsAnalyzing(true);
        try {
          const timeDate = getTimeFilterDate(timeFilter);
          const timeQuery = timeDate ? `&publishedAfter=${encodeURIComponent(timeDate)}` : '';
          const regionQuery = region !== 'GLOBAL' ? `&regionCode=${region}` : '';
          
          const searchData = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(keyword)}${regionQuery}&maxResults=${maxResults}&order=viewCount${timeQuery}`);
          
          if (searchData.items && searchData.items.length > 0) {
            const videoIds = searchData.items.map(item => item.id.videoId).join(',');
            const statsData = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet&id=${videoIds}`);
            
            let totalViews = 0;
            const topVideos = statsData.items.map(vid => {
               const views = parseInt(vid.statistics.viewCount || 0); totalViews += views;
               return { id: vid.id, title: vid.snippet.title, channel: vid.snippet.channelTitle, thumb: vid.snippet.thumbnails.medium?.url || vid.snippet.thumbnails.default?.url, viewsStr: formatLocale(views) }
            });
            const avgViews = Math.round(totalViews / topVideos.length);
            setNicheData({ keyword, totalVolume: formatLocale(totalViews), avgViews: formatLocale(avgViews), comp: avgViews > 500000 ? 'Cao' : (avgViews > 100000 ? 'Trung bình' : 'Thấp'), topVideos });
            showToast('Phân tích ngách thành công!', 'success');
          } else { setNicheData(null); showToast('Không tìm thấy dữ liệu', 'warning'); }
        } catch (err) { showToast(err.message, 'error'); }
        setIsAnalyzing(false);
      };

      return (
        <div className="flex flex-col md:flex-row h-[calc(100vh-130px)] bg-gray-100 animate-fade-in">
          <div className="w-full md:w-72 bg-[#1e293b] text-white flex flex-col h-full overflow-y-auto custom-scrollbar shadow-xl z-10 p-5">
            <div className="flex items-center font-black text-lg mb-6"><Activity className="w-5 h-5 mr-2 text-blue-400" /> TÌM NGÁCH YOUTUBE</div>
            <div className="space-y-5">
              <div><label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Từ khóa / Ngách</label><input type="text" value={keyword} onChange={(e)=>setKeyword(e.target.value)} placeholder="Ví dụ: Nấu ăn, Camping..." className="w-full bg-[#0f172a] border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none placeholder-slate-500 placeholder:italic" /></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Quốc gia</label><select value={region} onChange={(e)=>setRegion(e.target.value)} className="w-full bg-[#0f172a] border border-slate-700 rounded p-2 text-sm text-slate-200"><option value="GLOBAL">Toàn cầu</option><option value="VN">Việt Nam</option><option value="US">Hoa Kỳ</option></select></div>
                <div><label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Thời gian</label><select value={timeFilter} onChange={(e)=>setTimeFilter(e.target.value)} className="w-full bg-[#0f172a] border border-slate-700 rounded p-2 text-sm text-slate-200"><option value="all">Tất cả</option><option value="month">30 ngày qua</option><option value="year">1 năm qua</option></select></div>
              </div>
              <button onClick={handleAnalyzeNiche} disabled={isAnalyzing} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded flex items-center justify-center text-sm shadow disabled:opacity-50">{isAnalyzing ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <Play className="w-4 h-4 mr-2" fill="white" />} PHÂN TÍCH</button>
            </div>
          </div>
          <div className="flex-1 bg-white relative flex overflow-y-auto p-6">
            {!nicheData ? (
              <div className="m-auto text-center opacity-40"><LayoutGrid className="w-20 h-20 mx-auto text-slate-300 mb-4" /><h2 className="text-2xl font-black text-slate-400 uppercase tracking-widest mb-2">SẴN SÀNG PHÂN TÍCH</h2></div>
            ) : (
              <div className="w-full max-w-5xl mx-auto space-y-6">
                <h2 className="text-xl font-bold text-gray-800">Báo cáo ngách: <span className="text-blue-600">"{nicheData.keyword}"</span></h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-white p-4 rounded-lg shadow-sm border"><div className="text-xs font-bold text-gray-500 mb-1 uppercase">Lượt Tìm Kiếm / Quan Tâm</div><div className="text-2xl font-black text-gray-800">{nicheData.totalVolume}</div></div>
                  <div className="bg-white p-4 rounded-lg shadow-sm border"><div className="text-xs font-bold text-gray-500 mb-1 uppercase">Trung bình Views</div><div className="text-2xl font-black text-blue-600">{nicheData.avgViews}</div></div>
                  <div className="bg-white p-4 rounded-lg shadow-sm border"><div className="text-xs font-bold text-gray-500 mb-1 uppercase">Độ Cạnh Tranh</div><div className="text-2xl font-black text-orange-500">{nicheData.comp}</div></div>
                </div>
                <div className="bg-white rounded-lg shadow-sm border overflow-hidden">
                   <div className="bg-gray-50 px-4 py-3 border-b font-bold text-gray-700 text-sm">TOP VIDEO THỊNH HÀNH</div>
                   <table className="w-full text-sm text-left"><tbody className="divide-y divide-gray-100">
                     {nicheData.topVideos.map((vid, idx) => (
                       <tr key={idx} className="hover:bg-blue-50/50"><td className="px-4 py-3 flex items-center gap-4"><img src={vid.thumb} className="w-20 h-12 object-cover rounded shadow-sm" /><div><div className="font-bold text-blue-700 line-clamp-1">{vid.title}</div><div className="text-[10px] text-gray-500">{vid.channel}</div></div></td><td className="px-4 py-3 text-right font-bold whitespace-nowrap">{vid.viewsStr} views</td><td className="px-4 py-3 text-center"><button onClick={() => onCheckVideo(vid.id)} className="bg-orange-500 text-white text-[10px] font-bold px-3 py-1.5 rounded">CHECK</button></td></tr>
                     ))}
                   </tbody></table>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const TabKeywordExplorer = ({ showToast, callYouTubeApi }) => {
      const [keyword, setKeyword] = useState(() => localStorage.getItem('kw_explorer_keyword') || '');
      const [lang, setLang] = useState(() => localStorage.getItem('kw_explorer_lang') || 'en');
      const [isLoading, setIsLoading] = useState(false);
      const [results, setResults] = useState(() => { const saved = localStorage.getItem('kw_explorer_results'); return saved ? JSON.parse(saved) : []; });

      useEffect(() => {
        localStorage.setItem('kw_explorer_keyword', keyword);
        localStorage.setItem('kw_explorer_lang', lang);
        localStorage.setItem('kw_explorer_results', JSON.stringify(results));
      }, [keyword, lang, results]);

      const handleFindKeywords = async () => {
        if (!keyword.trim()) return showToast('Vui lòng nhập từ khóa chủ đề!', 'error');
        
        setIsLoading(true);
        try {
          const regionMap = { 'en': 'US', 'vi': 'VN', 'ko': 'KR', 'ja': 'JP' };
          const searchData = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/search?part=id&type=video&q=${encodeURIComponent(keyword)}&relevanceLanguage=${lang}&regionCode=${regionMap[lang] || 'US'}&maxResults=30`);
          
          if (searchData.items && searchData.items.length > 0) {
             const videoIds = searchData.items.map(i => i.id.videoId).join(',');
             const vidData = await callYouTubeApi(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoIds}`);
             
             const tagData = {};
             vidData.items.forEach(v => {
                const views = parseInt(v.statistics?.viewCount || 0);
                if(v.snippet.tags) {
                   v.snippet.tags.forEach(tag => {
                      const t = tag.toLowerCase().trim();
                      if(t.length > 3 && t !== keyword.toLowerCase()) {
                         if(!tagData[t]) tagData[t] = { count: 0, views: 0 };
                         tagData[t].count += 1;
                         tagData[t].views += views;
                      }
                   });
                }
             });
             
             const tagsArr = Object.keys(tagData).map(t => ({
                kw: t, count: tagData[t].count, avgViews: Math.floor(tagData[t].views / tagData[t].count)
             })).filter(t => t.kw.split(' ').length >= 2).sort((a, b) => b.count - a.count);
             
             if (tagsArr.length === 0) {
                 showToast('Chủ đề này không có nhiều tags mở rộng. Hãy thử từ khác.', 'warning');
                 setResults([]); setIsLoading(false); return;
             }

             const finalResults = tagsArr.slice(0, 15).map(r => {
                 let diff = 'Dễ';
                 if(r.count >= 4 && r.avgViews > 500000) diff = 'Khó';
                 else if (r.count >= 2 && r.avgViews > 100000) diff = 'Vừa';
                 
                 return { kw: r.kw, volume: formatLocale(r.avgViews), diff: diff, trend: '+' + (Math.floor((r.avgViews % 40) + 10)) + '%' };
             });
             
             setResults(finalResults); showToast('Đã quét thành công data TAGS từ top video!', 'success');
          } else showToast('Không tìm thấy dữ liệu cho từ khóa này.', 'warning');
        } catch(e) { showToast(e.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-6 space-y-4 bg-gray-50 min-h-screen animate-fade-in">
           <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm text-center">
             <h2 className="text-xl font-bold text-gray-800 mb-2">TÌM KEY VIEW NGOẠI (LONG-TAIL KEYWORDS)</h2>
             <p className="text-xs text-gray-500 mb-6">Hệ thống sẽ quét và bóc tách <strong className="text-blue-600">thẻ Tags thực tế</strong> từ 30-50 video đang Top Trend tại nước ngoài để tìm ra các Long-tail Keyword giá trị nhất.</p>
             <div className="flex max-w-2xl mx-auto gap-3">
               <input type="text" value={keyword} onChange={(e)=>setKeyword(e.target.value)} placeholder="Ví dụ: make money, camping, cooking..." className="flex-1 border border-gray-300 rounded px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 placeholder-gray-400 placeholder:italic" />
               <select value={lang} onChange={(e)=>setLang(e.target.value)} className="border border-gray-300 rounded px-4 py-2.5 text-sm focus:outline-none bg-white">
                 <option value="en">🇺🇸 Tiếng Anh (Hoa Kỳ)</option>
                 <option value="vi">🇻🇳 Tiếng Việt</option>

        let finalId = channelUrl.trim();

            else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0].split('?')[0];
        }

        try {
          const fetchUrl = finalId.startsWith('@') ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,brandingSettings&forHandle=${encodeURIComponent(finalId)}` : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,brandingSettings&id=${finalId}`;
          const data = await callYouTubeApi(fetchUrl);

          if (data.items && data.items.length > 0) {
             const ch = data.items[0];
             let score = 0;
             const checks = [];
             
             const hasAvatar = !!ch.snippet.thumbnails.high;
             if (hasAvatar) { score += 20; checks.push({ label: 'Ảnh Đại Diện (Avatar)', status: 'PASS', msg: 'Kênh đã có ảnh đại diện chất lượng cao.' }); }

             const descLen = ch.snippet.description ? ch.snippet.description.length : 0;
             if (descLen > 100) { score += 20; checks.push({ label: 'Mô Tả Kênh (Giới Thiệu)', status: 'PASS', msg: `Mô tả tốt (${descLen} ký tự), chuẩn SEO.` }); }
             else { checks.push({ label: 'Mô Tả Kênh (Giới Thiệu)', status: 'WARN', msg: 'Mô tả quá ngắn hoặc không có. Cần > 100 ký tự chứa từ khóa.' }); score += 10; }

             const hasHandle = ch.snippet.customUrl;

             const hasCountry = ch.snippet.country;
             const vidCount = Number(ch.statistics.videoCount || 0);
             if (hasCountry && vidCount > 5) { score += 25; checks.push({ label: 'Quốc Gia & Độ Active', status: 'PASS', msg: `Quốc gia: ${hasCountry}. Tổng video: ${vidCount} (Kênh hoạt động tốt)` }); }

             setAuditData({
               channel: ch.snippet.title,
               thumb: ch.snippet.thumbnails.default.url,
               score,
               checks

             showToast('Audit kênh hoàn tất!', 'success');

      const callYouTubeApi = async (baseUrl) => {
        const keysToTry = ytKeysList.length > 0 ? ytKeysList : [""];
        let currentIdx = ytActiveIdx;

        for (let attempt = 0; attempt < keysToTry.length; attempt++) {
          const idx = (currentIdx + attempt) % keysToTry.length;
          const key = keysToTry[idx];
          const fullUrl = baseUrl.includes('?') ? `${baseUrl}&key=${key}` : `${baseUrl}?key=${key}`;

          try {
            const res = await fetch(fullUrl);
            const data = await res.json();
            if (data.error) { lastError = new Error(data.error.message || 'Lỗi API YouTube'); continue; }
            setYtActiveIdx(idx); return data;
          } catch (err) { lastError = err; }
        }
        throw lastError || new Error("Tất cả API Key YouTube đã bị hết Quota!");
      };
