    const calculateVPH = (viewCount, publishedAt) => {
      if (!viewCount || !publishedAt) return 0;
      const hours = Math.max(1, (new Date() - new Date(publishedAt)) / (1000 * 60 * 60));
      return Math.round(viewCount / hours);
    };

    const calculateTrendScore = (vph) => {
      if (vph > 5000) return 99;
      if (vph > 1000) return Math.floor(85 + (Math.random() * 10));
      if (vph > 500) return Math.floor(70 + (Math.random() * 10));
      if (vph > 100) return Math.floor(50 + (Math.random() * 15));
      return Math.floor(30 + (Math.random() * 20));
    };

    const formatLocale = (num) => {

    const getTimeFilterDate = (filterType) => {
      const d = new Date();
      switch (filterType) {
        case 'today': d.setDate(d.getDate() - 1); break;
        case 'week': d.setDate(d.getDate() - 7); break;
        case 'month': d.setDate(d.getDate() - 30); break;
        case 'year': d.setFullYear(d.getFullYear() - 1); break;
        default: return null;
      }
      return d.toISOString();
    };

    const calculateAgeDays = (publishedAt) => {
      if (!publishedAt) return 1;
      const days = Math.floor((new Date() - new Date(publishedAt)) / (1000 * 60 * 60 * 24));

            { id: 1, keyword: `${keyword} cơ bản`, trend: 'HOT', comp: 'Thấp', compScore: '9.0/10' },
            { id: 2, keyword: `Hướng dẫn ${keyword}`, trend: 'HOT', comp: 'Trung bình', compScore: '7.5/10' },
            { id: 3, keyword: `${keyword} 2026`, trend: 'MỚI', comp: 'Thấp', compScore: '8.8/10' },
            { id: 4, keyword: `${keyword} kiếm tiền`, trend: 'HOT', comp: 'Cao', compScore: '6.5/10' },
          ]);

          const timeDate = getTimeFilterDate(timeRange);
          const timeQuery = timeDate ? `&publishedAfter=${encodeURIComponent(timeDate)}` : '';
          const regionQuery = region !== 'GLOBAL' ? `&regionCode=${encodeURIComponent(region)}` : '';
          
          let collectedChannels = [];
          let keywordsToTry = [keyword];
          
          if (autoRotateKw) {
            keywordsToTry.push(
              `${keyword} review`, 
              `${keyword} 2026`, 
              `top ${keyword}`, 
              `hướng dẫn ${keyword}`
            );
          }

          for (let currentKw of keywordsToTry) {
            if (collectedChannels.length >= 10 && !autoRotateKw) break;
            
            const searchRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(currentKw)}${regionQuery}&maxResults=${maxResults}${timeQuery}&key=${YOUTUBE_API_KEY}`);
            const searchData = await searchRes.json();
            if (searchData.error) throw new Error(searchData.error.message);

            if (searchData.items && searchData.items.length > 0) {
              const channelIdsMap = {};
              searchData.items.forEach((item) => { 
                if (item.snippet?.channelId) channelIdsMap[item.snippet.channelId] = true; 
              });
              const channelIds = Object.keys(channelIdsMap).slice(0, 50).join(',');

              if (channelIds) {
                const statRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelIds}&key=${YOUTUBE_API_KEY}`);
                const statData = await statRes.json();

                if (statData.items) {
                  const formattedChannels = statData.items.map((ch) => {
                    const subs = parseInt(ch.statistics.subscriberCount || 0);
                    const views = parseInt(ch.statistics.viewCount || 0);
                    const videos = parseInt(ch.statistics.videoCount || 0);
                    const age = calculateAgeDays(ch.snippet.publishedAt);
                    
                    return {
                      id: ch.id,
                      name: ch.snippet.title,
                      handle: ch.snippet.customUrl || `@${ch.id.substring(0,8)}`,
                      kw: currentKw,
                      topic: 'N/A', 
                      income: `$${formatLocale(Math.floor(views/1000 * 0.5))} - $${formatLocale(Math.floor(views/1000 * 2.5))}`,
                      url: `youtube.com/channel/${ch.id}`,
                      country: ch.snippet.country || 'N/A',
                      date: new Date(ch.snippet.publishedAt).toLocaleDateString('vi-VN'),
                      age: age,
                      sub: formatLocale(subs),
                      views: formatLocale(views),
                      videos: formatLocale(videos),
                      score: (subs >= minSubs && subs <= maxSubs) ? '8.5' : '5.0',
                      rawSubs: subs,
                      rawViews: views,
                      thumbnail: ch.snippet.thumbnails.default.url
                    };
                  });

                  let effectiveMaxSubs = maxSubs;
                  if (isHuntSmall) {
                    effectiveMaxSubs = Math.min(maxSubs, 50000);
                  }

                  const batchFiltered = formattedChannels.filter((c) => c.rawSubs >= minSubs && c.rawSubs <= effectiveMaxSubs);
                  
                  for (let bc of batchFiltered) {
                    if (!collectedChannels.some(existing => existing.id === bc.id)) {
                      collectedChannels.push(bc);
                    }
                  }
                }
              }
            }

            if (collectedChannels.length >= 10 && autoRotateKw) break;
          }

          if (isHuntSmall) {
            collectedChannels.sort((a, b) => {
              const ratioA = a.rawViews / (a.rawSubs || 1);
              const ratioB = b.rawViews / (b.rawSubs || 1);
              return ratioB - ratioA;
            });
          }

          setChannels(collectedChannels);
          if (collectedChannels.length > 0) {
            showToast(`Đã tìm thấy ${collectedChannels.length} kênh thỏa mãn điều kiện!`, 'success');
          } else {
            showToast('Không tìm thấy kênh nào thỏa mãn điều kiện lọc.', 'warning');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
        setIsLoading(false);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen">
          <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm">
            <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
              <div className="md:col-span-3 space-y-3">
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-24">Từ khóa:</label><input type="text" value={keyword} onChange={(e)=>setKeyword(e.target.value)} className="w-36 border border-gray-300 rounded px-2.5 py-1.5 text-sm focus:outline-none focus:border-blue-500" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-24">Khu vực:</label><select value={region} onChange={(e)=>setRegion(e.target.value)} className="w-36 border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-blue-500 bg-white">{COUNTRIES_LIST.map((c) => (<option key={c.code} value={c.code}>{c.name}</option>))}</select></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-24">Đăng trong:</label><select value={timeRange} onChange={(e)=>setTimeRange(e.target.value)} className="w-36 border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-blue-500 bg-white"><option value="all">Toàn thời gian</option><option value="today">Hôm nay</option><option value="week">Tuần này</option><option value="month">Tháng này</option><option value="year">Năm nay</option></select></div>
              </div>
              <div className="md:col-span-3 space-y-3">
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Đăng ký tối thiểu:</label><input type="number" value={minSubs} onChange={(e)=>setMinSubs(Number(e.target.value))} className="w-28 border border-gray-300 rounded px-2.5 py-1.5 text-sm focus:outline-none focus:border-blue-500 no-spinner" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Đăng ký tối đa:</label><input type="number" value={maxSubs} onChange={(e)=>setMaxSubs(Number(e.target.value))} className="w-28 border border-yellow-400 rounded px-2.5 py-1.5 text-sm focus:outline-none focus:border-blue-500 bg-yellow-50/30 no-spinner" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Số lượng quét:</label><input type="number" value={maxResults} onChange={(e)=>setMaxResults(Number(e.target.value))} className="w-28 border border-gray-300 rounded px-2.5 py-1.5 text-sm focus:outline-none focus:border-blue-500 no-spinner" /></div>
              </div>
              <div className="md:col-span-3 space-y-3">
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Video tối thiểu:</label><input type="number" defaultValue="1" className="w-28 border border-gray-300 rounded px-2.5 py-1.5 text-sm focus:outline-none focus:border-blue-500 no-spinner" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Video tối đa:</label><input type="number" defaultValue="1000" className="w-28 border border-gray-300 rounded px-2.5 py-1.5 text-sm focus:outline-none focus:border-blue-500 no-spinner" /></div>
                <div className="flex items-center justify-between"><label className="text-xs font-semibold text-gray-700 w-28">Lượt xem t.thiểu:</label><input type="number" defaultValue="1000" className="w-28 border border-gray-300 rounded px-2.5 py-1.5 text-sm focus:outline-none focus:border-blue-500 no-spinner" /></div>
              </div>
              <div className="md:col-span-3">
                <div className="bg-gray-50 border border-gray-200 rounded p-3 h-full flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-700">Hệ thống API & Gói</span><span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${userPlan === 'FREE' ? 'bg-gray-200 text-gray-700' : 'bg-orange-500 text-white'}`}>{userPlan} TIER</span></div>
                    <div className="space-y-1"><div className="flex justify-between text-xs"><span className="flex items-center text-red-600"><Play className="w-3 h-3 mr-1 fill-current"/> YouTube V3:</span><span className={YOUTUBE_API_KEY ? "text-green-600 font-semibold" : "text-red-600 font-semibold"}>{YOUTUBE_API_KEY ? 'Đã kết nối' : 'Chưa kết nối'}</span></div></div>
                  </div>
                  <button onClick={onOpenSettings} className="w-full mt-3 bg-blue-600 text-white text-xs font-bold py-1.5 rounded flex items-center justify-center hover:bg-blue-700"><Settings className="w-3 h-3 mr-1"/> CÀI ĐẶT</button>
                </div>
              </div>
            </div>

            <div className="mt-5 flex flex-col md:flex-row items-end justify-between border-t border-gray-100 pt-4 gap-4">
              <div className="flex flex-col md:flex-row gap-3">
                <div className="flex items-start bg-orange-50/50 p-2 rounded border border-orange-100">
                  <input type="checkbox" checked={autoRotateKw} onChange={(e)=>setAutoRotateKw(e.target.checked)} className="mt-1 w-4 h-4 text-orange-500 border-gray-300 rounded focus:ring-orange-500" />
                  <div className="ml-2">
                    <div className="text-xs font-bold text-orange-700">Tự động chuyển từ khóa</div>
                    <div className="text-[10px] text-orange-500">đến khi đủ 10 Kênh</div>
                  </div>
                </div>
                <div className="flex items-start bg-blue-50/50 p-2 rounded border border-blue-100">
                  <input type="checkbox" checked={isHuntSmall} onChange={(e) => setIsHuntSmall(e.target.checked)} className="mt-1 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                  <div className="ml-2">
                    <div className="text-xs font-bold text-blue-700">Săn kênh nhỏ / Mới trend</div>
                    <div className="text-[10px] text-blue-500">Ưu tiên sub thấp, view bùng nổ</div>
                  </div>
                </div>
              </div>
              <button onClick={handleSearch} disabled={isLoading} className="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 px-8 rounded shadow-md flex items-center transition-colors text-sm disabled:opacity-50">
                {isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <Play className="w-4 h-4 mr-2 fill-current" />}
                {isLoading ? 'ĐANG QUÉT...' : 'BẮT ĐẦU TÌM KÊNH'}
              </button>
            </div>
          </div>

          {hasSearched ? (
            <div className="space-y-4">
              {aiKeywords.length > 0 && (
                <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                   <div className="bg-[#f97316] text-white px-3 py-2 flex justify-between items-center"><h3 className="text-xs font-bold flex items-center"><List className="w-4 h-4 mr-2"/> DANH SÁCH GỢI Ý NGÁCH LIÊN QUAN - TỪ KHÓA ĐỀ XUẤT (AI)</h3></div>
                   <div className="overflow-x-auto">
                     <table className="w-full text-left text-xs">
                       <thead className="bg-gray-50 border-b border-gray-200 text-gray-700"><tr><th className="px-3 py-2 font-bold w-12 text-center">STT</th><th className="px-3 py-2 font-bold">TỪ KHÓA / NGÁCH TIỀM NĂNG</th><th className="px-3 py-2 font-bold text-center">CẠNH TRANH</th><th className="px-3 py-2 font-bold text-center">ĐIỂM SEO</th></tr></thead>
                       <tbody className="divide-y divide-gray-100">
                         {aiKeywords.map((item, idx) => (
                           <tr key={item.id} className="hover:bg-gray-50"><td className="px-3 py-2 text-center text-gray-500">{idx + 1}</td><td className="px-3 py-2 font-medium"><span className="text-gray-800">{item.keyword}</span><span className="ml-2 text-[10px] font-bold text-blue-500 bg-blue-50 px-1 py-0.5 rounded border border-blue-100">{item.trend}</span></td><td className="px-3 py-2 text-center"><span className={`font-bold ${item.comp === 'Thấp' ? 'text-green-500' : item.comp === 'Trung bình' ? 'text-yellow-600' : 'text-red-500'}`}>{item.comp}</span></td><td className="px-3 py-2 text-center font-bold text-blue-600">{item.compScore}</td></tr>
                         ))}
                       </tbody>
                     </table>
                   </div>
                </div>
              )}

              <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                 <div className="bg-[#334155] text-white px-3 py-2 flex justify-between items-center"><h3 className="text-xs font-bold flex items-center"><List className="w-4 h-4 mr-2"/> DANH SÁCH KÊNH QUÉT ĐƯỢC</h3><span className="bg-blue-500 text-[10px] px-2 py-0.5 rounded font-bold">TỔNG: {channels.length}</span></div>
                 <div className="overflow-x-auto">
                   <table className="w-full text-left text-xs whitespace-nowrap">
                     <thead className="bg-gray-100 border-b border-gray-200 text-gray-700"><tr><th className="px-2 py-3 text-center">STT</th><th className="px-2 py-3 text-center">ICON</th><th className="px-2 py-3">TÊN KÊNH</th><th className="px-2 py-3 text-center">THU NHẬP</th><th className="px-2 py-3 text-center">QUỐC GIA</th><th className="px-2 py-3 text-center">TUỔI KÊNH</th><th className="px-2 py-3 text-center">SUB</th><th className="px-2 py-3 text-center">VIEWS</th><th className="px-2 py-3 text-center">VIDEOS</th><th className="px-2 py-3 text-center">THAO TÁC</th></tr></thead>
                     <tbody className="divide-y divide-gray-200">
                       {channels.map((item, idx) => (
                         <tr key={item.id} className="hover:bg-blue-50/50"><td className="px-2 py-2 text-center">{idx + 1}</td><td className="px-2 py-2 text-center"><img src={item.thumbnail} className="w-6 h-6 rounded-full mx-auto" /></td><td className="px-2 py-2 font-bold text-gray-800">{item.name}</td><td className="px-2 py-2 text-center text-green-600 font-semibold">{item.income}</td><td className="px-2 py-2 text-center">{item.country}</td><td className="px-2 py-2 text-center">{item.age}</td><td className="px-2 py-2 text-center font-bold text-gray-700">{item.sub}</td><td className="px-2 py-2 text-center font-bold text-blue-600">{item.views}</td><td className="px-2 py-2 text-center">{item.videos}</td><td className="px-2 py-2 text-center"><button onClick={() => onSpyChannel(item.id)} className="bg-blue-600 text-white text-[9px] font-bold px-2 py-1 rounded">SPY</button></td></tr>
                       ))}
                       {channels.length === 0 && (<tr><td colSpan="10" className="text-center py-6 text-gray-500 italic">Không có kênh nào thỏa mãn điều kiện lọc.</td></tr>)}
                     </tbody>
                   </table>
                 </div>
              </div>
            </div>
          ) : (
            <div className="bg-white border border-gray-200 rounded-lg p-10 mt-4 text-center text-gray-400 text-sm italic">Chưa có kết quả nào. Bấm "Bắt đầu tìm kênh" để bắt đầu...</div>
          )}
        </div>
      );
    };

    const TabSpyChannel = ({ showToast, YOUTUBE_API_KEY, externalChannelId, onAnalyzeVideo }) => {
      const [channelIdInput, setChannelIdInput] = useState(externalChannelId || '');
      const [channelData, setChannelData] = useState(null);
      const [videosData, setVideosData] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [selectedVideoDetail, setSelectedVideoDetail] = useState(null);

      useEffect(() => { if (externalChannelId) { setChannelIdInput(externalChannelId); handleAnalyzeSpy(externalChannelId); } }, [externalChannelId]);

      const handleAnalyzeSpy = async (targetId) => {
        const inputVal = targetId || channelIdInput;
        if (!YOUTUBE_API_KEY) return showToast('Vui lòng cài đặt API Key!', 'error');
        if (!inputVal.trim()) return showToast('Vui lòng nhập Channel ID hoặc Link!', 'error');
        setIsLoading(true);
        let finalId = inputVal.trim();
        if (finalId.includes('youtube.com/')) {
            if (finalId.includes('/channel/')) finalId = finalId.split('/channel/')[1].split('/')[0].split('?')[0];
            else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0].split('?')[0];
        }

        try {
          let fetchUrl = finalId.startsWith('@') 
            ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&forHandle=${encodeURIComponent(finalId)}&key=${YOUTUBE_API_KEY}`
            : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&id=${finalId}&key=${YOUTUBE_API_KEY}`;
          const channelRes = await fetch(fetchUrl);
          const channelJson = await channelRes.json();
          if (channelJson.items && channelJson.items.length > 0) {
            const channel = channelJson.items[0];
            const age = calculateAgeDays(channel.snippet.publishedAt);
            const views = Number(channel.statistics.viewCount || 0);
            setChannelData({
              id: channel.id, title: channel.snippet.title, thumbnail: channel.snippet.thumbnails.high?.url || channel.snippet.thumbnails.default?.url, country: channel.snippet.country || 'N/A', customUrl: channel.snippet.customUrl || `@${channel.id.substring(0,8)}`, publishedAt: new Date(channel.snippet.publishedAt).toLocaleDateString('vi-VN'), ageDays: age, subscriberCount: formatLocale(channel.statistics.subscriberCount), viewCount: formatLocale(views), videoCount: formatLocale(channel.statistics.videoCount), viewPerDay: formatLocale(Math.round(views / age))
            });
            const uploadsId = channel.contentDetails?.relatedPlaylists?.uploads;
            if (uploadsId) {
                const plistRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=10&key=${YOUTUBE_API_KEY}`);
                const plistJson = await plistRes.json();
                if (plistJson.items) {
                    const vidIds = plistJson.items.map(item => item.snippet.resourceId.videoId).join(',');
                    const vRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${vidIds}&key=${YOUTUBE_API_KEY}`);
                    const vJson = await vRes.json();
                    const formattedVids = vJson.items.map(v => {
                      const vph = calculateVPH(v.statistics.viewCount, v.snippet.publishedAt);
                      const desc = v.snippet.description || '';
                      return { id: v.id, thumb: v.snippet.thumbnails.medium?.url || v.snippet.thumbnails.default?.url, title: v.snippet.title, description: desc, tags: v.snippet.tags || [], hashtags: desc.match(/#[^\s#<>]+/g) || [], date: new Date(v.snippet.publishedAt).toLocaleString('vi-VN'), views: formatLocale(v.statistics.viewCount), vph: `+${formatLocale(vph)} VPH`, outlier: `${calculateTrendScore(vph)}/100` }
                    });
                    setVideosData(formattedVids);
                    if (formattedVids.length > 0) setSelectedVideoDetail(formattedVids[0]);
                }
            }
            showToast('Tải dữ liệu Kênh thành công!', 'success');
          } else throw new Error('Không tìm thấy kênh!');
        } catch (err) { showToast(err.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-4 space-y-4 bg-gray-50 min-h-screen overflow-y-auto custom-scrollbar">
          <div className="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex items-center gap-3">
             <div className="flex items-center gap-2 flex-1"><label className="text-sm font-bold text-gray-700 whitespace-nowrap">Channel ID / Handle:</label><input type="text" value={channelIdInput} onChange={(e)=>setChannelIdInput(e.target.value)} placeholder="Nhập Channel ID hoặc @handle..." className="w-1/2 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-blue-500" /></div>
             <button onClick={() => handleAnalyzeSpy()} disabled={isLoading} className="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded shadow flex items-center text-sm disabled:opacity-50">{isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <BarChart2 className="w-4 h-4 mr-2" />}PHÂN TÍCH SPY</button>
          </div>
          {channelData && (
            <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm flex gap-6 animate-fade-in">
               <div className="w-32 flex flex-col items-center flex-shrink-0"><img src={channelData.thumbnail} className="w-24 h-24 rounded-full shadow-sm mb-2 object-cover" /><div className="font-bold text-gray-800 text-sm text-center">{channelData.title}</div><a href={`https://youtube.com/channel/${channelData.id}`} target="_blank" className="text-blue-500 text-[10px] hover:underline mt-1">Xem kênh 👉</a></div>
               <div className="flex-1 text-xs text-gray-700 space-y-2">
                  <div><span className="font-bold text-blue-800">Quốc gia:</span> {channelData.country} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Tuổi kênh:</span> {formatLocale(channelData.ageDays)} ngày</div>
                  <div><span className="font-bold text-blue-800">Đăng ký:</span> {channelData.subscriberCount} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Lượt xem:</span> {channelData.viewCount} &nbsp;|&nbsp; <span className="font-bold text-blue-800">Video:</span> {channelData.videoCount}</div>
                  <div><span className="font-bold text-blue-800">View/ngày (TB):</span> {channelData.viewPerDay}</div>
               </div>
            </div>
          )}
          {videosData.length > 0 && (
            <div className="space-y-4 animate-fade-in">
              <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                 <div className="bg-[#334155] text-white px-3 py-2 flex"><h3 className="text-xs font-bold flex items-center"><Play className="w-4 h-4 mr-2"/> Video mới nhất từ kênh</h3></div>
                 <div className="overflow-x-auto">
                   <table className="w-full text-left text-xs whitespace-nowrap">
                     <thead className="bg-gray-100 border-b border-gray-200"><tr><th className="px-2 py-3 text-center">THUMB</th><th className="px-2 py-3 text-center">XEM CT</th><th className="px-2 py-3 max-w-[250px]">TIÊU ĐỀ</th><th className="px-2 py-3 text-right">VIEWS</th><th className="px-2 py-3 text-center">VPH</th><th className="px-2 py-3 text-center">TREND SCORE</th></tr></thead>
                     <tbody className="divide-y divide-gray-200">
                       {videosData.map((item, idx) => (

          const searchRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&q=${encodeURIComponent(keyword)}${regionQuery}&maxResults=${maxResults}&order=viewCount${timeQuery}&key=${YOUTUBE_API_KEY}`);

        setIsLoading(true);

          // BƯỚC 1: Tìm kiếm 25-50 video đang thịnh hành ở quốc gia đó
          const regionMap = { 'en': 'US', 'vi': 'VN', 'ko': 'KR', 'ja': 'JP' };
          const searchRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=id&type=video&q=${encodeURIComponent(keyword)}&relevanceLanguage=${lang}&regionCode=${regionMap[lang] || 'US'}&maxResults=30&key=${YOUTUBE_API_KEY}`);
          const searchData = await searchRes.json();
          if (searchData.error) throw new Error(searchData.error.message);
          
          if (searchData.items && searchData.items.length > 0) {
             const videoIds = searchData.items.map(i => i.id.videoId).join(',');
             
             // BƯỚC 2: Gọi API lấy chi tiết để quét toàn bộ thẻ Tags thật của họ
             const vidRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoIds}&key=${YOUTUBE_API_KEY}`);
             const vidData = await vidRes.json();
             
             const tagData = {};
             vidData.items.forEach(v => {
                const views = parseInt(v.statistics?.viewCount || 0);
                if(v.snippet.tags) {
                   v.snippet.tags.forEach(tag => {
                      const t = tag.toLowerCase().trim();
                      // Loại bỏ tag rác hoặc trùng đúng từ khóa gốc
                      if(t.length > 3 && t !== keyword.toLowerCase()) {
                         if(!tagData[t]) tagData[t] = { count: 0, views: 0 };
                         tagData[t].count += 1;
                         tagData[t].views += views;
                      }
                   });
                }
             });
             
             // BƯỚC 3: Xử lý data - Ưu tiên các Tag nhiều từ (Long-tail) và tần suất xuất hiện cao
             const tagsArr = Object.keys(tagData).map(t => ({
                kw: t,
                count: tagData[t].count,
                avgViews: Math.floor(tagData[t].views / tagData[t].count)
             }))
             .filter(t => t.kw.split(' ').length >= 2) // Lọc long-tail
             .sort((a, b) => b.count - a.count); // Xếp theo tần suất xuất hiện nhiều nhất
             
             if (tagsArr.length === 0) {
                 showToast('Chủ đề này các kênh ngoại không sử dụng nhiều tags mở rộng. Hãy thử từ khác.', 'warning');
                 setResults([]);
                 setIsLoading(false);
                 return;
             }

             const finalResults = tagsArr.slice(0, 15).map(r => {
                 // Đánh giá cạnh tranh thực tế dựa trên số lượt xem trung bình và độ phổ biến
                 let diff = 'Dễ';
                 if(r.count >= 4 && r.avgViews > 500000) diff = 'Khó';
                 else if (r.count >= 2 && r.avgViews > 100000) diff = 'Vừa';
                 
                 return {
                    kw: r.kw,
                    volume: formatLocale(r.avgViews), // Lấy trung bình view làm tiềm năng tìm kiếm
                    diff: diff,
                    trend: '+' + (Math.floor(Math.random() * 40) + 10) + '%' // Giả lập xu hướng
                 };
             });
             
             setResults(finalResults);
             showToast('Đã quét thành công data TAGS từ top video ngoại!', 'success');
          } else {
             showToast('Không tìm thấy dữ liệu cho từ khóa này.', 'warning');
          }
        } catch(e) { showToast(e.message, 'error'); }
        setIsLoading(false);
      };

      return (
        <div className="p-6 space-y-4 bg-gray-50 min-h-screen animate-fade-in">
           <div className="bg-white border border-gray-200 rounded-lg p-5 shadow-sm text-center">
             <h2 className="text-xl font-bold text-gray-800 mb-2">TÌM KEY VIEW NGOẠI (LONG-TAIL KEYWORDS)</h2>
             <p className="text-xs text-gray-500 mb-6">Hệ thống sẽ quét và bóc tách <strong className="text-blue-600">thẻ Tags thực tế</strong> từ 30-50 video đang Top Trend tại nước ngoài để tìm ra các Long-tail Keyword giá trị nhất.</p>
             <div className="flex max-w-2xl mx-auto gap-3">
               <input type="text" value={keyword} onChange={(e)=>setKeyword(e.target.value)} placeholder="Nhập chủ đề (VD: make money, camping, cooking...)" className="flex-1 border border-gray-300 rounded px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500" />
               <select value={lang} onChange={(e)=>setLang(e.target.value)} className="border border-gray-300 rounded px-4 py-2.5 text-sm focus:outline-none bg-white">

                 <option value="vi">🇻🇳 Tiếng Việt</option>

               </select>
               <button onClick={handleFindKeywords} disabled={isLoading} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded shadow flex items-center text-sm disabled:opacity-50">
                 {isLoading ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <KeyIcon className="w-4 h-4 mr-2" />} QUÉT DATA THẬT
               </button>
             </div>
           </div>

           {results.length > 0 && (
             <div className="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
               <div className="bg-[#1e293b] text-white px-4 py-3 flex justify-between items-center">
                 <h3 className="text-sm font-bold flex items-center"><KeyIcon className="w-4 h-4 mr-2"/> CÁC TỪ KHÓA MỞ RỘNG (ĐƯỢC DÙNG NHIỀU NHẤT)</h3>
                 <button onClick={() => { fallbackCopyTextToClipboard(results.map(r=>r.kw).join('\n')); showToast('Đã copy danh sách từ khóa!', 'success'); }} className="bg-white/20 hover:bg-white/30 px-3 py-1 rounded text-xs font-bold transition">Copy Tất Cả</button>
               </div>
               <table className="w-full text-left text-sm">
                 <thead className="bg-gray-50 border-b text-gray-700"><tr><th className="px-4 py-3">TỪ KHÓA MỞ RỘNG</th><th className="px-4 py-3 text-center">TIỀM NĂNG VIEWS</th><th className="px-4 py-3 text-center">XU HƯỚNG</th><th className="px-4 py-3 text-center">ĐỘ CẠNH TRANH</th></tr></thead>
                 <tbody className="divide-y divide-gray-100">

                       <td className="px-4 py-3 text-center font-semibold text-gray-700">{r.volume}</td>
                       <td className="px-4 py-3 text-center font-bold text-green-500">{r.trend}</td>
                       <td className="px-4 py-3 text-center">
                         <span className={`px-2 py-1 rounded text-[10px] font-bold ${r.diff === 'Dễ' ? 'bg-green-100 text-green-700' : r.diff === 'Vừa' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`}>{r.diff}</span>
                       </td>

               </table>
               <div className="p-3 bg-gray-50 text-xs text-gray-500 text-center italic border-t border-gray-100">
                 * Dữ liệu bóc tách từ thẻ Tags của Top 30 Video thực tế trên YouTube theo quốc gia bạn chọn.
               </div>
             </div>
           )}
        </div>
      );
    };

    const TabAISEO = ({ showToast, YOUTUBE_API_KEY, GEMINI_API_KEY }) => {

        setIsGenerating(true);
        try {

            const prompt = `Bạn là một chuyên gia SEO YouTube và người sáng tạo nội dung xuất sắc với 10 năm kinh nghiệm.

            {
                "titles": ["5 tiêu đề video giật tít, có chứa icon cảm xúc phù hợp, độ dài 50-80 ký tự"],

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {

            let textObj = resData.candidates[0].content.parts[0].text;

            setData(parsedData);

                 {isGenerating ? <RefreshCw className="w-4 h-4 mr-2 animate-spin" /> : <Sparkles className="w-4 h-4 mr-2" />} TẠO AI SEO

             <div className="grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade-in">

                    <ul className="space-y-2">

                    <div className="flex flex-wrap gap-2">
                      {data.tags.map((t, i) => <span key={i} className="bg-purple-50 text-purple-700 border border-purple-200 px-2 py-1 rounded text-xs font-semibold">{t}</span>)}

            else if (finalId.includes('/@')) finalId = '@' + finalId.split('/@')[1].split('/')[0].split('?')[0];
        }

        try {
          const fetchUrl = finalId.startsWith('@') ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,brandingSettings&forHandle=${encodeURIComponent(finalId)}&key=${YOUTUBE_API_KEY}` : `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,brandingSettings&id=${finalId}&key=${YOUTUBE_API_KEY}`;

          const data = await res.json();

          if (data.items && data.items.length > 0) {
             const ch = data.items[0];
             let score = 0;
             const checks = [];
             
             const hasAvatar = !!ch.snippet.thumbnails.high;
             if (hasAvatar) { score += 20; checks.push({ label: 'Ảnh Đại Diện (Avatar)', status: 'PASS', msg: 'Kênh đã có ảnh đại diện chất lượng cao.' }); }

             const hasBanner = ch.brandingSettings?.image?.bannerExternalUrl;
             if (hasBanner) { score += 20; checks.push({ label: 'Ảnh Bìa (Banner)', status: 'PASS', msg: 'Kênh đã có ảnh bìa chuyên nghiệp.' }); }
             else { checks.push({ label: 'Ảnh Bìa (Banner)', status: 'FAIL', msg: 'Thiếu ảnh bìa (Banner), giảm độ uy tín kênh.' }); }

             const descLen = ch.snippet.description ? ch.snippet.description.length : 0;
             if (descLen > 100) { score += 20; checks.push({ label: 'Mô Tả Kênh (Giới Thiệu)', status: 'PASS', msg: `Mô tả tốt (${descLen} ký tự), chuẩn SEO.` }); }
             else { checks.push({ label: 'Mô Tả Kênh (Giới Thiệu)', status: 'WARN', msg: 'Mô tả quá ngắn hoặc không có. Cần > 100 ký tự chứa từ khóa.' }); score += 10; }

             const hasHandle = ch.snippet.customUrl;

             const hasCountry = ch.snippet.country;

             <p className="text-xs text-gray-500 mb-4">Công cụ tự động phân tích và chấm điểm SEO tổng thể của kênh YouTube (Avatar, Banner, About, Handle...)</p>
             <div className="flex max-w-2xl gap-3">

               </div>
               <div className="flex-1 space-y-3">
                 <h4 className="font-bold text-sm text-gray-700 mb-4 border-b pb-2">KẾT QUẢ PHÂN TÍCH CHI TIẾT 5 YẾU TỐ</h4>
                 {auditData.checks.map((c, i) => (
                   <div key={i} className="flex items-start p-3 bg-gray-50 rounded border border-gray-100">
                     <div className={`mt-0.5 w-5 h-5 rounded-full flex items-center justify-center text-white flex-shrink-0 ${c.status === 'PASS' ? 'bg-green-500' : c.status === 'WARN' ? 'bg-orange-500' : 'bg-red-500'}`}>
                       {c.status === 'PASS' ? <CheckCircle className="w-3 h-3"/> : c.status === 'WARN' ? <AlertCircle className="w-3 h-3"/> : <X className="w-3 h-3"/>}
                     </div>
                     <div className="ml-3">
                       <div className="text-xs font-bold text-gray-800">{c.label}</div>
                       <div className="text-[11px] text-gray-500 mt-0.5">{c.msg}</div>
                     </div>
                   </div>
                 ))}
               </div>
             </div>
           )}
        </div>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('tab1');
      const [toast, setToast] = useState({ message: '', type: 'success', visible: false });
      
      const [apiKey, setApiKey] = useState('AIzaSyBIip0Ohh9s6xyUQeYjIsB4r6sajmDbnaE');
      const [geminiApiKey, setGeminiApiKey] = useState('');
      
      const [showSettings, setShowSettings] = useState(false);
      
      const [showUpgradeModal, setShowUpgradeModal] = useState(false);
      const [userPlan, setUserPlan] = useState(() => localStorage.getItem('user_plan') || 'FREE');
      
      const [freeSearchesLeft, setFreeSearchesLeft] = useState(() => {
        const saved = localStorage.getItem('free_searches_left');
        return saved !== null ? Number(saved) : 3;
      });

      const [checkoutStep, setCheckoutStep] = useState(1);
      const [selectedPlanToBuy, setSelectedPlanToBuy] = useState('');
      const [paymentStatus, setPaymentStatus] = useState('idle');
      const [orderCode, setOrderCode] = useState('');

      const [spyTargetId, setSpyTargetId] = useState('');
      const [checkVideoTargetId, setCheckVideoTargetId] = useState('');

      const showToast = (message, type = 'success') => {
        setToast({ message, type, visible: true });
        setTimeout(() => setToast((prev) => ({ ...prev, visible: false })), 3000);
      };

      const useFreeSearch = () => {
        if (userPlan !== 'FREE') return true;
        if (freeSearchesLeft <= 0) return false;
        const nextLeft = freeSearchesLeft - 1;
        setFreeSearchesLeft(nextLeft);
        localStorage.setItem('free_searches_left', String(nextLeft));
        return true;
      };

      const navigateToSpy = (channelId) => { setSpyTargetId(channelId); setActiveTab('tab2'); };
      const navigateToCheckVideo = (videoId) => { setCheckVideoTargetId(videoId); setActiveTab('tab3'); };

      const tabs = [
        { id: 'tab1', label: 'TÌM KÊNH & NGÁCH', icon: Search, isLocked: false },
        { id: 'tab2', label: 'SPY ĐỐI THỦ', icon: BarChart2, isLocked: false },
        { id: 'tab3', label: 'KIỂM TRA VIDEO', icon: LinkIcon, isLocked: false },
        { id: 'tab4', label: 'TRACKING KÊNH', icon: Target, isLocked: false },
        { id: 'tab5', label: 'NGHIÊN CỨU NGÁCH', icon: LayoutGrid, isLocked: userPlan === 'FREE' },
        { id: 'tab6', label: 'TÌM KEY VIEW NGOẠI', icon: KeyIcon, isLocked: userPlan === 'FREE' },
        { id: 'tab7', label: 'AI SEO & KẾ HOẠCH', icon: Sparkles, isLocked: userPlan === 'FREE' },
        { id: 'tab8', label: 'AUDIT KÊNH', icon: ShieldCheck, isLocked: userPlan === 'FREE' },
      ];

      const handleTabClick = (tab) => {
        if (tab.isLocked) {
          setCheckoutStep(1);
          setShowUpgradeModal(true);
          return;
        }
        setActiveTab(tab.id);
      };

      const openUpgradeModal = () => {
        setCheckoutStep(1);
        setShowUpgradeModal(true);
      };

      const handleStartPurchase = (plan) => {
        setSelectedPlanToBuy(plan);
        setOrderCode(`MUA${plan}${Math.floor(1000 + Math.random() * 9000)}`);
        setCheckoutStep(2);
        setPaymentStatus('idle');
      };

      const handleSimulatePaymentCheck = () => {
        setPaymentStatus('checking');
        
        setTimeout(() => {
          setPaymentStatus('success');
          setUserPlan(selectedPlanToBuy);
          localStorage.setItem('user_plan', selectedPlanToBuy);
          
          showToast(`Kích hoạt thành công gói ${selectedPlanToBuy}! Cảm ơn bạn.`, "success");
          
          setTimeout(() => {
            setShowUpgradeModal(false);
            setCheckoutStep(1);
          }, 2000);
        }, 3000);
      };

      return (
        <div className="min-h-screen bg-white text-gray-800 font-sans flex flex-col">
          <Header onOpenSettings={() => setShowSettings(true)} onOpenUpgrade={openUpgradeModal} userPlan={userPlan} freeSearchesLeft={freeSearchesLeft} />
          
          <div className="bg-gray-100 border-b border-gray-200 px-4 pt-3 flex space-x-1 overflow-x-auto custom-scrollbar shadow-inner">
            {tabs.map((tab) => {
              const isActive = activeTab === tab.id;
              const Icon = tab.icon;
              return (
                <button
                  key={tab.id}
                  onClick={() => handleTabClick(tab)}
                  className={`flex items-center px-4 py-2.5 rounded-t-lg text-[11px] font-bold transition-colors whitespace-nowrap border-t border-l border-r relative ${
                    isActive ? 'bg-blue-600 text-white border-blue-700 shadow-[0_-2px_5px_rgba(0,0,0,0.1)]' : 'bg-gray-200 text-gray-600 border-gray-300 hover:bg-gray-300'
                  }`}
                >
                  <Icon className={`w-3.5 h-3.5 mr-2 ${isActive ? 'text-blue-100' : 'text-gray-500'}`} />
                  {tab.label}
                  {tab.isLocked && <Lock className="w-3 h-3 ml-2 text-orange-500" />}
                </button>
              );
            })}
          </div>

          <main className="flex-1 overflow-hidden relative bg-gray-50">
            <div style={{ display: activeTab === 'tab1' ? 'block' : 'none', height: '100%' }}>
              <TabFindChannels showToast={showToast} YOUTUBE_API_KEY={apiKey} onOpenSettings={() => setShowSettings(true)} onSpyChannel={navigateToSpy} onCheckVideo={navigateToCheckVideo} userPlan={userPlan} onOpenUpgrade={openUpgradeModal} freeSearchesLeft={freeSearchesLeft} useFreeSearch={useFreeSearch} />
            </div>
            
            <div style={{ display: activeTab === 'tab2' ? 'block' : 'none', height: '100%' }}>
              <TabSpyChannel showToast={showToast} YOUTUBE_API_KEY={apiKey} externalChannelId={spyTargetId} onAnalyzeVideo={navigateToCheckVideo} />
            </div>
            
            <div style={{ display: activeTab === 'tab3' ? 'block' : 'none', height: '100%' }}>
              <TabCheckVideo showToast={showToast} YOUTUBE_API_KEY={apiKey} initialVideoId={checkVideoTargetId} onSpyChannel={navigateToSpy} />
            </div>
            
            <div style={{ display: activeTab === 'tab4' ? 'block' : 'none', height: '100%' }}>
              <TabTracking showToast={showToast} YOUTUBE_API_KEY={apiKey} onSpyChannel={navigateToSpy} />
            </div>
            
            <div style={{ display: activeTab === 'tab5' ? 'block' : 'none', height: '100%' }}>
              <TabNicheResearch showToast={showToast} YOUTUBE_API_KEY={apiKey} onCheckVideo={navigateToCheckVideo} />
            </div>
            
            <div style={{ display: activeTab === 'tab6' ? 'block' : 'none', height: '100%' }}>
              <TabKeywordExplorer showToast={showToast} YOUTUBE_API_KEY={apiKey} />
            </div>
            
            <div style={{ display: activeTab === 'tab7' ? 'block' : 'none', height: '100%' }}>
              <TabAISEO showToast={showToast} YOUTUBE_API_KEY={apiKey} GEMINI_API_KEY={geminiApiKey} />
            </div>
            
            <div style={{ display: activeTab === 'tab8' ? 'block' : 'none', height: '100%' }}>
              <TabChannelAudit showToast={showToast} YOUTUBE_API_KEY={apiKey} />
            </div>
          </main>

          {/* Modal Nâng Cấp Gói */}
          {showUpgradeModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[110] backdrop-blur-sm animate-fade-in p-4">
              <div className="bg-white p-2 rounded-2xl w-full max-w-3xl shadow-2xl relative overflow-hidden">
                <button onClick={() => setShowUpgradeModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 z-10"><X className="w-6 h-6" /></button>
                
                {checkoutStep === 1 && (
                  <div className="p-6 md:p-8">
                    <div className="text-center mb-8">
                       <h3 className="font-extrabold text-2xl text-gray-800 flex items-center justify-center gap-2"><Crown className="text-orange-500 w-8 h-8"/> NÂNG CẤP GÓI DỊCH VỤ CHUYÊN NGHIỆP</h3>
                       <p className="text-sm text-gray-500 mt-2">Mở khóa toàn bộ 8 công cụ (Tìm Kênh, Spy, Tracking, Niche, Key Ngoại, AI SEO, Audit Kênh).</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                       <div className={`p-4 rounded-xl border-2 flex flex-col justify-between ${userPlan === 'FREE' ? 'border-blue-500 bg-blue-50/20' : 'border-gray-200'}`}>
                          <div>
                            <div className="font-bold text-gray-800 text-sm">Gói Miễn Phí</div><div className="text-lg font-black text-blue-600 my-1">0đ</div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3"><li>• Tối đa 15-20 kết quả quét</li><li>• Dùng thử 3 lần tìm kiếm</li><li>• Chỉ dùng 4 Tab cơ bản</li></ul>
                          </div>
                          <div className="mt-4 text-center"><span className="text-[10px] font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full uppercase tracking-wider">Đang sử dụng</span></div>
                       </div>
                       <div className={`p-5 rounded-xl border-2 shadow-lg flex flex-col justify-between ${userPlan === 'PRO' ? 'border-orange-500 bg-orange-50/20' : 'border-orange-200 bg-orange-50/10'}`}>
                          <div>
                            <div className="flex justify-between items-center"><span className="font-bold text-orange-600 text-sm">Chuyên Nghiệp</span><span className="bg-orange-500 text-white text-[9px] font-bold px-2 py-1 rounded">PHỔ BIẾN</span></div>
                            <div className="text-2xl font-black text-orange-600 my-2">299k<span className="text-xs text-gray-500 font-normal">/tháng</span></div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3 font-medium"><li>• Quét tới 200 kết quả</li><li>• Không giới hạn lượt tìm</li><li>• Mở khóa Tab AI SEO & Key Ngoại</li></ul>
                          </div>
                          <button onClick={() => handleStartPurchase('PRO')} className="mt-6 w-full bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-2.5 rounded-lg shadow-md transition-all transform hover:scale-105">NÂNG CẤP PRO</button>
                       </div>
                       <div className={`p-5 rounded-xl border-2 flex flex-col justify-between ${userPlan === 'VIP' ? 'border-purple-500 bg-purple-50/20' : 'border-purple-200 bg-purple-50/10'}`}>
                          <div>
                            <div className="font-bold text-purple-700 text-sm">Doanh Nghiệp / VIP</div><div className="text-2xl font-black text-purple-600 my-2">699k<span className="text-xs text-gray-500 font-normal">/tháng</span></div>
                            <ul className="text-xs text-gray-600 space-y-2 mt-3 font-medium"><li>• Quét không giới hạn (Unlimited)</li><li>• Tự động xoay từ khóa API</li><li>• Audit & Tool VIP A-Z</li></ul>
                          </div>
                          <button onClick={() => handleStartPurchase('VIP')} className="mt-6 w-full bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold py-2.5 rounded-lg shadow-md transition-all">NÂNG CẤP VIP</button>
                       </div>
                    </div>
                  </div>
                )}

                {checkoutStep === 2 && (
                  <div className="p-6 md:p-8">
                     <button onClick={() => setCheckoutStep(1)} className="text-blue-600 hover:underline mb-4 font-medium flex items-center text-sm">
                       &larr; Quay lại chọn gói
                     </button>
                     
                     <div className="bg-blue-50/50 border border-blue-100 rounded-xl p-6 text-center">
                        <h2 className="text-xl font-bold text-gray-800 mb-2">Thanh toán tự động gói <span className="text-blue-600">{selectedPlanToBuy}</span></h2>
                        <p className="text-sm text-gray-600 mb-6">Sử dụng ứng dụng ngân hàng quét mã QR bên dưới để thanh toán. Cú pháp sẽ được tự động điền.</p>
                        
                        <div className="flex flex-col md:flex-row items-center justify-center gap-8">
                          <div className="bg-white p-3 rounded-xl shadow-md border-2 border-dashed border-gray-300">
                            <img 
                              src={`https://img.vietqr.io/image/${MY_BANK.BANK_ID}-${MY_BANK.ACCOUNT_NO}-compact2.png?amount=${PLAN_PRICES[selectedPlanToBuy]}&addInfo=${orderCode}&accountName=${encodeURIComponent(MY_BANK.ACCOUNT_NAME)}`} 
                              alt="Mã QR Thanh Toán VietQR" 
                              className="w-56 h-56 md:w-64 md:h-64 object-contain" 
                            />
                          </div>

                          <div className="text-left bg-white p-5 rounded-xl shadow-md w-full max-w-sm text-sm border border-gray-100">
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3">
                               <span className="text-gray-500">Ngân hàng thụ hưởng:</span>
                               <span className="font-bold text-gray-800">MBBank</span>
                             </div>
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3">
                               <span className="text-gray-500">Số tài khoản:</span>
                               <span className="font-bold text-gray-800">{MY_BANK.ACCOUNT_NO}</span>
                             </div>
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3">
                               <span className="text-gray-500">Chủ tài khoản:</span>
                               <span className="font-bold text-gray-800">{MY_BANK.ACCOUNT_NAME}</span>
                             </div>
                             <div className="flex justify-between border-b border-gray-100 pb-3 mb-3">
                               <span className="text-gray-500">Số tiền:</span>
                               <span className="font-bold text-blue-600 text-lg">{PLAN_PRICES[selectedPlanToBuy].toLocaleString()} VNĐ</span>
                             </div>
                             <div className="flex flex-col pt-1">
                               <span className="text-gray-500 mb-1">Nội dung chuyển khoản (Bắt buộc):</span>
                               <span className="font-mono font-bold text-red-600 bg-red-50 border border-red-100 px-3 py-2 rounded text-center tracking-widest text-lg">{orderCode}</span>
                             </div>
                          </div>
                        </div>

                        <div className="mt-8 border-t border-gray-200 pt-6">
                          {paymentStatus === 'idle' && (
                            <button 
                              onClick={handleSimulatePaymentCheck}
                              className="w-full max-w-md mx-auto flex items-center justify-center py-4 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold shadow-lg transition-all text-sm animate-pulse"
                            >
                              <CheckCircle className="w-5 h-5 mr-2" />
                              TÔI ĐÃ CHUYỂN KHOẢN THÀNH CÔNG
                            </button>
                          )}

                          {paymentStatus === 'checking' && (
                            <div className="w-full max-w-md mx-auto flex items-center justify-center py-4 bg-gray-200 text-gray-700 rounded-xl font-bold text-sm">
                              <RefreshCw className="w-5 h-5 mr-2 animate-spin text-blue-600" />
                              Hệ thống đang kiểm tra giao dịch (Vui lòng đợi 3-5s)...
                            </div>
                          )}

                          {paymentStatus === 'success' && (
                            <div className="w-full max-w-md mx-auto flex items-center justify-center py-4 bg-green-100 text-green-800 border-2 border-green-500 rounded-xl font-bold text-sm animate-bounce">
                              <CheckCircle className="w-6 h-6 mr-2 text-green-600" />
                              THANH TOÁN THÀNH CÔNG! HỆ THỐNG ĐANG MỞ KHÓA...
                            </div>
                          )}
                        </div>
                     </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal Cài Đặt */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] backdrop-blur-sm animate-fade-in">
              <div className="bg-white p-6 rounded-xl w-full max-w-md shadow-2xl relative">
                <button onClick={() => setShowSettings(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><X className="w-5 h-5" /></button>
                <h3 className="font-bold text-xl text-gray-800 mb-4 flex items-center gap-2"><Settings className="w-5 h-5"/> Cấu hình Hệ thống (API)</h3>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">YouTube Data API V3 Key</label>
                    <input type="text" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="Nhập mã AIzaSy..." className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm" />
                    <p className="text-[10px] text-gray-500 mt-2">API này kết nối dữ liệu thật từ YouTube.</p>
                  </div>
                  <div className="border-t border-gray-100 pt-3">
                    <label className="text-sm font-medium text-gray-700 mb-1 flex items-center">
                       <Sparkles className="w-4 h-4 mr-1 text-orange-500"/> Google Gemini API Key
                    </label>
                    <input type="text" value={geminiApiKey} onChange={(e) => setGeminiApiKey(e.target.value)} placeholder="Nhập mã API Gemini (Tùy chọn)" className="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-orange-500 outline-none font-mono text-sm mt-1" />
                    <p className="text-[10px] text-orange-600 mt-2 font-medium bg-orange-50 p-2 rounded">Khuyên dùng! Dùng để kích hoạt Trí Tuệ Nhân Tạo cho Tab 7 (AI SEO) tạo nội dung không bị máy móc. (Lấy miễn phí tại Google AI Studio).</p>
                  </div>
                  <button onClick={() => { setShowSettings(false); showToast('Đã lưu cấu hình thành công!', 'success'); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors mt-2">Lưu & Đóng</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast.visible && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center px-4 py-3 rounded-md shadow-2xl border transition-all duration-300 animate-fade-in ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : toast.type === 'warning' ? 'bg-yellow-50 border-yellow-200 text-yellow-800' : 'bg-green-50 border-green-200 text-green-800'}`}>
               {toast.type === 'error' ? <AlertCircle className="w-5 h-5 mr-2 text-red-500" /> : <CheckCircle className="w-5 h-5 mr-2 text-green-500" />}
               <span className="text-sm font-bold">{toast.message}</span>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
